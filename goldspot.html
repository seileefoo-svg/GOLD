<style>
:root {
  --bg: #f2f4f7;
  --panel: #ffffff;
  --panel-2: #f8fafc;
  --line: #e4e7ec;
  --text: #101828;
  --muted: #667085;
  --gold: #b07d12;
  --gold-soft: rgba(176,125,18,.12);
  --green: #0e9f6e;
  --red: #e5484d;
  --amber: #d97706;
  --blue: #2563eb;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: radial-gradient(1200px 600px at 80% -10%, #ffffff 0%, var(--bg) 55%) fixed;
  color: var(--text);
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 14px;
}

body { min-height: 100vh; padding-bottom: 40px; }

.top {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 16px 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,.9);
  backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 20;
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { margin: 0; font-size: 18px; letter-spacing: .14em; font-weight: 700; }
.brand p { margin: 2px 0 0; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
.dot.stale { background: var(--amber); box-shadow: 0 0 12px var(--amber); }
.dot.down { background: var(--red); box-shadow: 0 0 12px var(--red); }

.quote { display: flex; flex-direction: column; }
.price { font-family: var(--mono); font-size: 30px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
.price.up { color: var(--green); }
.price.down { color: var(--red); }
.quote .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; font-family: var(--mono); }

.toolbar { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.clock { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-align: right; line-height: 1.5; }
button {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 14px; font-size: 12.5px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
button:hover { border-color: var(--gold); background: #f2f4f7; }
button.primary { border-color: rgba(176,125,18,.45); color: var(--gold); }

main { max-width: 1500px; margin: 0 auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

.card {
  background: linear-gradient(180deg, var(--panel) 0%, #ffffff 100%);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  display: flex; flex-direction: column;
}
.card-head {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.card-head h2 { margin: 0; font-size: 13px; letter-spacing: .06em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.card-body { padding: 14px 16px; }

/* verdict */
.hero { display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; padding: 18px 22px; }
.badge {
  font-size: 22px; font-weight: 800; letter-spacing: .04em; padding: 12px 22px; border-radius: 12px;
  border: 1px solid; white-space: nowrap;
}
.badge.buy { color: var(--green); border-color: rgba(14,159,110,.45); background: rgba(14,159,110,.08); }
.badge.sell { color: var(--red); border-color: rgba(229,72,77,.4); background: rgba(229,72,77,.08); }
.badge.limit { color: var(--amber); border-color: rgba(217,119,6,.45); background: rgba(217,119,6,.08); }
.badge.wait { color: var(--muted); border-color: var(--line); background: rgba(102,112,133,.06); }

.hero-mid .summary { font-size: 13.5px; line-height: 1.65; color: #1d2939; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tag {
  font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); font-family: var(--mono);
}
.tag.hot { color: var(--gold); border-color: rgba(176,125,18,.4); }
.blockers { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.blocker { font-size: 12px; color: var(--amber); }
.gauge { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.gauge .ring { position: relative; width: 112px; height: 112px; }
.gauge svg { display: block; transform: rotate(-90deg); }
.gauge .num {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 32px; font-weight: 700; letter-spacing: -.03em;
}
.gauge .ring-bg { fill: none; stroke: #eaecf0; stroke-width: 9; }
.gauge .ring-fg { fill: none; stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .6s; }
.gauge-label { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* layout */
.row { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.9fr) minmax(320px, 1fr); }
.row-secondary { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); }
@media (max-width: 1080px) {
  .row, .row-secondary { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; }
  .gauge { flex-direction: row; gap: 12px; }
}

/* chart */
.canvas-wrap { position: relative; flex: 1 1 auto; min-height: 380px; padding: 6px 4px 0; }
canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
.tip {
  position: absolute; pointer-events: none; display: none; z-index: 5;
  background: rgba(255,255,255,.98); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 10px; font-family: var(--mono); font-size: 11px; line-height: 1.55;
  color: #1d2939; box-shadow: 0 10px 24px rgba(16,24,40,.12); white-space: pre;
}
.legend { margin-left: auto; display: flex; gap: 14px; font-size: 11px; color: var(--muted); font-family: var(--mono); }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }

/* plan */
.plan-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px dashed #e4e7ec; }
.plan-row:last-child { border-bottom: none; }
.plan-row .k { color: var(--muted); font-size: 12px; }
.plan-row .v { font-family: var(--mono); font-size: 16px; font-weight: 600; }
.plan-row .why { font-size: 11px; color: #8a94a6; margin-top: 2px; text-align: right; max-width: 62%; }
.v.entry { color: var(--blue); }
.v.stop { color: var(--red); }
.v.tp { color: var(--green); }
.v.r { font-size: 11.5px; color: var(--muted); margin-left: 6px; }
.empty-note { color: var(--muted); font-size: 12.5px; line-height: 1.6; }

.ticket {
  margin-top: 12px; background: #f5f7fb; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; color: #344054;
  display: flex; gap: 10px; align-items: center;
}
.ticket code { flex: 1; overflow-wrap: anywhere; word-break: normal; line-height: 1.5; }
.ticket button { padding: 5px 9px; font-size: 11px; }

.size-box { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.size-box div { background: #f9fafb; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.size-box .k { font-size: 10.5px; color: var(--muted); letter-spacing: .04em; }
.size-box .v { font-family: var(--mono); font-size: 13px; margin-top: 2px; }
.warn { margin-top: 10px; font-size: 11.5px; color: var(--amber); line-height: 1.5; }

/* evidence */

  /* ------------------------------------------------------------------ indicators */
  function ema(v, n) {
    const out = new Array(v.length);
    if (!v.length) return out;
    const a = 2 / (n + 1);
    out[0] = v[0];
    for (let i = 1; i < v.length; i++) out[i] = a * v[i] + (1 - a) * out[i - 1];
    return out;
  }
  function rma(v, n) {
    const out = new Array(v.length);
    if (!v.length) return out;
    out[0] = v[0];
    for (let i = 1; i < v.length; i++) out[i] = (v[i] + (n - 1) * out[i - 1]) / n;
    return out;

  function trueRange(bars) {

        hl = 1; detail.push('低点抬高 HL ' + fmtPrice(lows[lows.length - 2].price) + ' → ' + fmtPrice(lows[lows.length - 1].price));
      } else {
        ll = 1; detail.push('低点降低 LL ' + fmtPrice(lows[lows.length - 2].price) + ' → ' + fmtPrice(lows[lows.length - 1].price));
      }
    }
    let trend, label;
    if (hh && hl) { trend = 1; label = '上升结构 (HH + HL)'; }
    else if (lh && ll) { trend = -1; label = '下降结构 (LH + LL)'; }
    else if ((hh && ll) || (lh && hl)) { trend = 0; label = '扩张结构 (高低点同时外扩/内收)'; }
    else if (hh || hl) { trend = 0.5; label = '偏多但结构不完整'; }
    else if (lh || ll) { trend = -0.5; label = '偏空但结构不完整'; }
    else { trend = 0; label = '区间 / 数据不足'; }
    return {
      trend, label,
      detail: detail.length ? label + '：' + detail.join('；') : label,
      lastHigh: highs.length ? highs[highs.length - 1] : null,
      lastLow: lows.length ? lows[lows.length - 1] : null,
    };
  }
  function zigzag(swings, atr, minAtr) {
    minAtr = minAtr || 1;
    if (swings.length < 2 || !(atr > 0)) return [];
    const pivots = [swings[0]];
    for (let i = 1; i < swings.length; i++) {
      const s = swings[i], last = pivots[pivots.length - 1];
      if (s.kind === last.kind) {
        const more = s.kind === 'H' ? s.price > last.price : s.price < last.price;
        if (more) pivots[pivots.length - 1] = s;
        continue;
      }
      if (Math.abs(s.price - last.price) >= minAtr * atr) pivots.push(s);
    }
    const legs = [];
    for (let i = 0; i + 1 < pivots.length; i++) {
      const a = pivots[i], b = pivots[i + 1];
      legs.push({
        fromI: a.i, toI: b.i, from: a.price, to: b.price,
        dir: b.price > a.price ? 1 : -1,
        size: Math.abs(b.price - a.price),
        sizeAtr: Math.abs(b.price - a.price) / atr,
      });
    }
    return legs;
  }
  function fibLevels(leg) {
    const rng = leg.to - leg.from;
    return FIB_RATIOS.map((r) => ({ ratio: r, price: leg.to - rng * r, dir: leg.dir }));
  }
  function buildZones(swings, atr, bars, lookback, tolAtr, maxZones) {
    lookback = lookback || 240; tolAtr = tolAtr || 0.35; maxZones = maxZones || 8;
    const lastI = bars.length - 1;
    const recent = swings.filter((s) => s.i >= lastI - lookback);
    if (!recent.length || !(atr > 0)) return [];
    const tol = tolAtr * atr;
    const ordered = recent.slice().sort((a, b) => a.price - b.price);
    const clusters = [];
    ordered.forEach((s) => {
      const last = clusters[clusters.length - 1];
      if (last && s.price - last[last.length - 1].price <= tol) last.push(s);
      else clusters.push([s]);
    });
    let zones = clusters.map((cl) => {
      const prices = cl.map((x) => x.price);
      const lo = Math.min.apply(null, prices), hi = Math.max.apply(null, prices);
      let last = cl[0];
      cl.forEach((x) => { if (x.i > last.i) last = x; });
      return { lo, hi, mid: (lo + hi) / 2, touches: cl.length, lastI: last.i, lastT: bars[last.i].t, kinds: cl.map((x) => x.kind) };
    });
    const merged = [];
    zones.sort((a, b) => a.mid - b.mid).forEach((z) => {
      const m = merged[merged.length - 1];
      if (m && z.lo <= m.hi + tol * 0.5) {
        m.hi = Math.max(m.hi, z.hi); m.lo = Math.min(m.lo, z.lo);
        m.mid = (m.lo + m.hi) / 2; m.touches += z.touches;
        m.lastI = Math.max(m.lastI, z.lastI);

    });
    merged.forEach((z) => {

      z.strength = r1(Math.min(10, z.touches * 1.6 + recency * 3));

  }
  function nearestZones(price, zones, atr, count) {
    count = count || 4;

    const above = zones.filter((z) => z.lo > price).sort((a, b) => (a.lo - price) - (b.lo - price));
    const inside = zones.filter((z) => z.lo <= price && price <= z.hi);
    return {
      support: below.slice(0, count), resistance: above.slice(0, count), inside,
      distSupportAtr: below.length && atr ? (price - below[0].hi) / atr : null,
      distResistanceAtr: above.length && atr ? (above[0].lo - price) / atr : null,

  }
  function candlePatterns(bars, atr, lookback) {
    lookback = lookback || 3;
    const out = [];
    const n = bars.length;
    for (let i = Math.max(1, n - lookback); i < n; i++) {
      const b = bars[i], p = bars[i - 1];
      const body = Math.abs(b.c - b.o), rng = b.h - b.l;
      if (rng <= 0) continue;
      const upper = b.h - Math.max(b.o, b.c), lower = Math.min(b.o, b.c) - b.l;
      const prevBody = Math.abs(p.c - p.o);
      const bull = b.c > b.o;
      if (bull && p.c < p.o && b.c >= p.o && b.o <= p.c && body > prevBody) {
        out.push({ i, name: '看涨吞没', dir: 1, detail: '实体 ' + r2(body) + ' 覆盖前一根 ' + r2(prevBody) });
      }
      if (!bull && p.c > p.o && b.c <= p.o && b.o >= p.c && body > prevBody) {
        out.push({ i, name: '看跌吞没', dir: -1, detail: '实体 ' + r2(body) + ' 覆盖前一根 ' + r2(prevBody) });
      }
      if (lower >= 2 * body && lower / rng >= 0.55 && b.c >= b.l + 0.6 * rng) {
        out.push({ i, name: '下影拒绝 (Pin)', dir: 1, detail: '下影 ' + r2(lower) + ' = 实体 ' + r2(body) + ' 的 ' + (lower / Math.max(body, 1e-9)).toFixed(1) + ' 倍' });
      }
      if (upper >= 2 * body && upper / rng >= 0.55 && b.c <= b.h - 0.6 * rng) {
        out.push({ i, name: '上影拒绝 (Pin)', dir: -1, detail: '上影 ' + r2(upper) + ' = 实体 ' + r2(body) + ' 的 ' + (upper / Math.max(body, 1e-9)).toFixed(1) + ' 倍' });
      }
      if (b.h <= p.h && b.l >= p.l) out.push({ i, name: '内包线 (Inside)', dir: 0, detail: '区间 ' + r2(b.l) + '-' + r2(b.h) + ' 位于前一根 ' + r2(p.l) + '-' + r2(p.h) + ' 内' });
      if (body / rng < 0.12 && rng > 0.6 * atr) out.push({ i, name: '十字星 (Doji)', dir: 0, detail: '实体仅占区间 ' + Math.round((body / rng) * 100) + '%' });
    }
    return out;
  }
  function roundLevels(price, atr, spanAtr, step) {
    spanAtr = spanAtr || 4; step = step || 10;
    if (!(atr > 0)) return [];
    const lo = price - spanAtr * atr, hi = price + spanAtr * atr;
    const out = [];
    let v = Math.ceil(lo / step) * step;
    while (v <= hi) { if (Math.abs(v - price) > 1e-9) out.push(v); v += step; }
    return out;
  }
  function liquidityPools(swings, atr, tolAtr) {
    tolAtr = tolAtr || 0.15;

    ['H', 'L'].forEach((kind) => {
      const pts = swings.filter((s) => s.kind === kind).slice(-6);
      for (let i = 0; i + 1 < pts.length; i++) {
        const a = pts[i], b = pts[i + 1];
        if (Math.abs(a.price - b.price) <= tolAtr * atr && b.i - a.i > 3) {
          out.push({ kind, price: (a.price + b.price) / 2, detail: (kind === 'H' ? '等高' : '等低') + ' ' + fmtPrice(a.price) + ' / ' + fmtPrice(b.price) });
        }
      }
    });
    return out;
  }

  /* ------------------------------------------------------------------ context */
  function tfContext(rawBars, label) {
    const bars = addIndicators(rawBars);
    if (bars.length < 60) throw new Error(label + ' 数据不足 (' + bars.length + ' 根)');
    const last = bars[bars.length - 1];
    let atr = last.atr;
    if (!isFinite(atr) || atr <= 0) {
      const tail = bars.slice(-20);
      atr = tail.reduce((a, b) => a + (b.h - b.l), 0) / tail.length;
    }
    const swings = cleanSwings(findSwings(bars, 2));
    const state = structureState(swings);
    const price = last.c;
    // use the longest EMA the sample supports, so MN/W1 still get a trend read
    const emaLen = bars.length >= 200 ? 200 : bars.length >= 100 ? 100 : 50;
    const emaLong = emaLen === 200 ? last.ema200 : emaLen === 100 ? last.ema100 : last.ema50;
    const sEma = last.ema20 > last.ema50 + 0.05 * atr ? 1 : last.ema20 < last.ema50 - 0.05 * atr ? -1 : 0;
    const sPx = price > emaLong + 0.1 * atr ? 1 : price < emaLong - 0.1 * atr ? -1 : 0;
    const score = r2(sEma + sPx + state.trend);
    let labelTxt;
    if (score >= 1.5) labelTxt = '强多头';
    else if (score >= 0.5) labelTxt = '偏多';
    else if (score <= -1.5) labelTxt = '强空头';
    else if (score <= -0.5) labelTxt = '偏空';
    else labelTxt = '中性';
    return {
      tf: label, bars, price, atr,
      ema20: last.ema20, ema50: last.ema50, ema200: emaLong, emaLen, ema200Ok: emaLen === 200,
      rsi: last.rsi, adx: last.adx, diPlus: last.diPlus, diMinus: last.diMinus,
      macdHist: last.macdHist, relVol: isFinite(last.relVol) ? last.relVol : 1,
      swings, state, score, label: labelTxt, detail: state.detail,
      t: last.t, barsCount: bars.length,
    };
  }

  function consensus(ctx) {
    let total = 0, used = 0;
    const rows = [];
    let longs = 0, shorts = 0, neutral = 0;
    TF_LIST.forEach(({ key, label, weight }) => {
      const c = ctx[key];
      if (!c) return;
      total += c.score * weight; used += weight;
      if (c.score >= 0.5) longs++; else if (c.score <= -0.5) shorts++; else neutral++;
      rows.push({
        tf: label, key, score: c.score, label: c.label,
        structure: c.state.label, detail: c.detail,
        rsi: r1(c.rsi), adx: r1(c.adx), atr: r2(c.atr), atrPct: r2((c.atr / c.price) * 100),
        bars: c.barsCount, emaOk: c.ema200Ok, emaLen: c.emaLen,
        ema20: r2(c.ema20), ema50: r2(c.ema50), ema200: r2(c.ema200),
        macdHist: r2(c.macdHist), price: r2(c.price), t: c.t,
      });
    });
    const score = used ? r2(total / used) : 0;
    let direction = 0, label = '中性';
    if (score >= 0.6) { direction = 1; label = '偏多'; }
    else if (score <= -0.6) { direction = -1; label = '偏空'; }
    const aligned = direction === 0 ? 0 : rows.filter((r) => r.score * direction > 0.4).length;
    return {
      direction, score, label, rows, alignment: rows.length ? aligned / rows.length : 0,
      aligned, counts: { long: longs, short: shorts, neutral },
    };
  }

  function legacyBias(ctx) {
    const weights = { '1d': 0.5, '4h': 0.3, '1h': 0.2 };
    const rows = [];
    let total = 0, used = 0;
    Object.keys(weights).forEach((tf) => {
      const c = ctx[tf];
      if (!c) return;

      rows.push({ tf: tf.toUpperCase(), score: c.score, label: c.label, structure: c.state.label, detail: c.detail });
    });
    const score = used ? r2(total / used) : 0;
    let direction = 0, label = '中性';
    if (score >= 0.6) { direction = 1; label = '偏多'; }
    else if (score <= -0.6) { direction = -1; label = '偏空'; }
    return { direction, score, label, rows, alignment: 0, aligned: 0, counts: { long: 0, short: 0, neutral: 0 }, legacy: true };
  }

  function groupScore(rows, labels) {

  function buildLevels(h1, d1, price) {
    const atr = h1.atr;

    const prevIdx = lastDay.getTime() === today.getTime() ? d.length - 2 : d.length - 1;

  function m15Trigger(m15, d) {

  function cleanCandidates(cands, atr) {

  function buildTargets(d, entry, stop, atr, levels, ctx) {

    let cands = [];
    levels.zones.forEach((z) => {
      if (d === 1 && z.lo > entry + 0.4 * risk) cands.push([z.lo, '阻力区 ' + fmtPrice(z.lo) + '-' + fmtPrice(z.hi) + '（' + z.touches + ' 次触碰，强度 ' + z.strength + '）']);

      for (let i = 0; i < scored.length; i++) {

  function positionSize(cfg, entry, stop) {

    let lots = Math.round((units / 100) * 100) / 100;
    let warning = null;
    if (lots < 0.01) {

    }
    units = lots * 100;
    const actualRisk = units * riskPerUnit;
    if (!warning && actualRisk > riskAmount * 1.25) warning = '最小手数取整后实际风险 $' + actualRisk.toFixed(2) + '，高于目标 $' + riskAmount.toFixed(2);
    return {

  function band(a, b) { return [r2(Math.min(a, b)), r2(Math.max(a, b))]; }

  function stopFromStructure(d, entry, structure, atr) {

    if (dist < 0.45 * atr) stop = entry - d * 0.6 * atr;
    return stop;
  }

  function trendSetup(d, c, levels, cfg) {
    const h1 = c;
    const bars = h1.bars, atr = h1.atr, price = h1.price;
    const legs = zigzag(h1.swings, atr, 1);
    let leg = null;
    for (let i = legs.length - 1; i >= 0; i--) {
      if (legs[i].dir === d && legs[i].sizeAtr >= 1) { leg = legs[i]; break; }
    }
    const recent = bars.slice(-30, -1);
    const recentExt = d === 1 ? Math.max.apply(null, recent.map((b) => b.h)) : Math.min.apply(null, recent.map((b) => b.l));

    const broke = d === 1 ? price > recentExt + 0.05 * atr : price < recentExt - 0.05 * atr;
    if (broke && h1.relVol >= 1.0) {
      const level = recentExt;
      const entry = price;
      const stop = stopFromStructure(d, entry, level - d * 0.7 * atr, atr);
      return {
        type: '突破跟进', dir: d, status: 'READY', triggered: true,

        trigger: 'H1 收盘 ' + fmtPrice(price) + (d === 1 ? ' 上破' : ' 下破') + '近 30 根' + (d === 1 ? '高点' : '低点') + ' ' + fmtPrice(level) + '，量比 ' + h1.relVol.toFixed(2),
        confluence: ['突破位 ' + fmtPrice(level), '量比 ' + h1.relVol.toFixed(2) + '（>1 表示放量）'],
        stop: r2(stop),
        stop_reason: (d === 1 ? '突破位' : '跌破位') + ' ' + fmtPrice(level) + ' 反向 0.7×ATR(' + atr.toFixed(2) + ') 作为失败突破止损',
        risk_ref: level,
      };
    }

    let bandLo, bandHi, origin, legNote, fibTxt;
    if (!leg) {
      const anchor = d === 1 ? Math.min(h1.ema20, h1.ema50) : Math.max(h1.ema20, h1.ema50);
      [bandLo, bandHi] = band(anchor - d * 0.4 * atr, anchor + d * 0.2 * atr);
      legNote = '无有效推动浪，使用 EMA20/50 区域作为回踩位';
      const tail = bars.slice(-20);
      origin = d === 1 ? Math.min.apply(null, tail.map((b) => b.l)) : Math.max.apply(null, tail.map((b) => b.h));
      fibTxt = '';
    } else {
      const fibs = {};
      fibLevels(leg).forEach((f) => { fibs[f.ratio] = f.price; });
      [bandLo, bandHi] = band(fibs[0.618], fibs[0.382]);
      origin = leg.from;
      legNote = '最近' + (d === 1 ? '上涨' : '下跌') + '推动浪 ' + fmtPrice(leg.from) + ' → ' + fmtPrice(leg.to) + '（' + leg.sizeAtr.toFixed(1) + '×ATR）';
      fibTxt = '斐波那契 0.382-0.618 回踩带 ' + fmtPrice(bandLo) + '-' + fmtPrice(bandHi);
    }

    const ema = h1.ema20;
    let emaNote;
    if (bandLo - 0.5 * atr <= ema && ema <= bandHi + 0.5 * atr) {
      const nb = band(Math.min(bandLo, ema), Math.max(bandHi, ema));
      bandLo = nb[0]; bandHi = nb[1];
      emaNote = 'EMA20 ' + fmtPrice(ema) + ' 落在带内';
    } else {
      const gap = ema < bandLo ? bandLo - ema : ema - bandHi;
      emaNote = 'EMA20 ' + fmtPrice(ema) + ' 距带 ' + (gap / atr).toFixed(2) + '×ATR';
    }

    const zoneHits = levels.zones.filter((z) => !(z.hi < bandLo || z.lo > bandHi)).sort((a, b) => b.strength - a.strength);
    let zoneNote;
    if (zoneHits.length) {
      const z = zoneHits[0];
      const nb = band(Math.min(bandLo, z.lo), Math.max(bandHi, z.hi));
      bandLo = nb[0]; bandHi = nb[1];
      zoneNote = '与' + (d === 1 ? '支撑' : '阻力') + '区 ' + fmtPrice(z.lo) + '-' + fmtPrice(z.hi) + ' 重叠（' + z.touches + ' 次触碰）';
    } else zoneNote = '附近无多次触碰的结构区';

    let inside;
    if (d === 1) {
      if (price < bandLo - 0.6 * atr) return null;
      inside = price >= bandLo && price <= bandHi;
    } else {
      if (price > bandHi + 0.6 * atr) return null;
      inside = price >= bandLo && price <= bandHi;
    }

    const entry = inside ? price : (d === 1 ? bandHi : bandLo);
    let stop = stopFromStructure(d, entry, origin, atr);
    if (Math.abs(entry - stop) > cfg.maxStopAtr * atr) stop = entry - d * 2.0 * atr;
    const status = inside ? 'READY' : 'PENDING';
    const retr = leg ? ((leg.to - price) / leg.size) * leg.dir : 0;
    const bits = [legNote, fibTxt, emaNote, zoneNote].filter(Boolean);
    return {
      type: '趋势回踩', dir: d, status, triggered: false,
      entry: r2(entry), entry_zone: [bandLo, bandHi], order: inside ? 'market' : 'limit',
      trigger: bits.join('；'), confluence: bits,
      stop: r2(stop),
      stop_reason: '结构' + (d === 1 ? '低' : '高') + '点 ' + fmtPrice(origin) + ' 外侧 0.25×ATR(' + atr.toFixed(2) + ')；止损距离 ' + Math.abs(entry - stop).toFixed(2) + ' = ' + (Math.abs(entry - stop) / atr).toFixed(2) + '×ATR',
      risk_ref: origin, retracement: leg ? Math.round(retr * 1000) / 1000 : null, inside,
    };
  }

  function rangeSetup(ctx, levels, price, atr) {
    const near = levels.near;
    const sup = near.support[0] || null, res = near.resistance[0] || null;
    if (!sup && !res) return null;
    const dSup = sup ? (price - sup.hi) / atr : 99;
    const dRes = res ? (res.lo - price) / atr : 99;
    if (sup && dSup <= 0.7 && sup.strength >= 4) {
      return {
        type: '区间低吸', dir: 1, status: 'READY', triggered: false,
        entry: r2(price), entry_zone: band(sup.lo, sup.hi), order: 'market',
        trigger: '价格 ' + fmtPrice(price) + ' 贴着支撑区 ' + fmtPrice(sup.lo) + '-' + fmtPrice(sup.hi) + '（强度 ' + sup.strength + '，距 ' + dSup.toFixed(2) + '×ATR）',
        confluence: ['支撑区 ' + fmtPrice(sup.lo) + '-' + fmtPrice(sup.hi), '强度 ' + sup.strength + '，' + sup.touches + ' 次触碰'],
        stop: r2(sup.lo - 0.5 * atr),
        stop_reason: '支撑区下沿 ' + fmtPrice(sup.lo) + ' 下方 0.5×ATR(' + atr.toFixed(2) + ')',
        risk_ref: sup.lo,
      };
    }
    if (res && dRes <= 0.7 && res.strength >= 4) {
      return {
        type: '区间高抛', dir: -1, status: 'READY', triggered: false,
        entry: r2(price), entry_zone: band(res.lo, res.hi), order: 'market',
        trigger: '价格 ' + fmtPrice(price) + ' 贴着阻力区 ' + fmtPrice(res.lo) + '-' + fmtPrice(res.hi) + '（强度 ' + res.strength + '，距 ' + dRes.toFixed(2) + '×ATR）',
        confluence: ['阻力区 ' + fmtPrice(res.lo) + '-' + fmtPrice(res.hi), '强度 ' + res.strength + '，' + res.touches + ' 次触碰'],
        stop: r2(res.hi + 0.5 * atr),
        stop_reason: '阻力区上沿 ' + fmtPrice(res.hi) + ' 上方 0.5×ATR(' + atr.toFixed(2) + ')',
        risk_ref: res.hi,
      };
    }
    return null;
  }

  /* ---------------------------------------------------------- both sides */
  function mergeZoneLists(a, b, atr) {
    const all = a.concat(b).sort((x, y) => x.mid - y.mid);
    const out = [];
    all.forEach((z) => {
      const m = out[out.length - 1];
      if (m && z.lo <= m.hi + 0.2 * atr) {
        m.hi = Math.max(m.hi, z.hi); m.lo = Math.min(m.lo, z.lo);
        m.mid = (m.lo + m.hi) / 2;
        m.strength = Math.max(m.strength, z.strength);
        m.touches = Math.max(m.touches, z.touches);
      } else out.push(Object.assign({}, z));
    });
    return out;
  }

  function rangeSide(d, lv, price, atr) {
    const z = d === 1 ? (lv.near.support[0] || null) : (lv.near.resistance[0] || null);
    if (!z || z.strength < 4) return null;
    const dist = d === 1 ? (price - z.hi) / atr : (z.lo - price) / atr;
    if (dist > 0.8 || dist < -0.25) return null;
    const stop = d === 1 ? z.lo - 0.5 * atr : z.hi + 0.5 * atr;
    return {
      type: d === 1 ? '区间低吸' : '区间高抛', dir: d, status: 'READY', order: 'market',
      entry: r2(price), entry_zone: band(z.lo, z.hi),
      trigger: '价格 ' + fmtPrice(price) + ' 贴着' + (d === 1 ? '支撑' : '阻力') + '区 ' + fmtPrice(z.lo) + '-' + fmtPrice(z.hi) + '（强度 ' + z.strength + '，距 ' + dist.toFixed(2) + '×ATR）',
      confluence: [(d === 1 ? '支撑区 ' : '阻力区 ') + fmtPrice(z.lo) + '-' + fmtPrice(z.hi), '强度 ' + z.strength + ' · ' + z.touches + ' 次触碰'],
      stop: r2(stop),
      stop_reason: (d === 1 ? '支撑区下沿 ' : '阻力区上沿 ') + fmtPrice(d === 1 ? z.lo : z.hi) + ' 外 0.5×ATR(' + atr.toFixed(2) + ')',
      risk_ref: d === 1 ? z.lo : z.hi,
    };
  }

  function waitingSide(d, c, cfg) {
    const anchor = d === 1 ? Math.min(c.ema20, c.ema50) - 0.2 * c.atr : Math.max(c.ema20, c.ema50) + 0.2 * c.atr;
    const stop = anchor - d * 1.2 * c.atr;
    return {
      type: '等待回踩', dir: d, status: 'WAIT', order: 'limit',
      entry: r2(anchor), entry_zone: band(anchor - 0.3 * c.atr, anchor + 0.3 * c.atr),
      trigger: '当前价格 ' + fmtPrice(c.price) + ' 不在' + (d === 1 ? '多头' : '空头') + '回踩带内，等回到 EMA20/50 附近再考虑',
      confluence: ['EMA20 ' + fmtPrice(c.ema20) + ' / EMA50 ' + fmtPrice(c.ema50)],
      stop: r2(stop), stop_reason: '回踩位下方 1.2×ATR(' + c.atr.toFixed(2) + ') 作为结构止损',
      risk_ref: anchor,
    };
  }

  function makeSide(d, c, lv, tlv, cfg, ctx, biasDir) {
    let plan = trendSetup(d, c, lv, cfg);
    if (!plan) plan = rangeSide(d, lv, c.price, c.atr);
    if (!plan) plan = waitingSide(d, c, cfg);

    const targets = buildTargets(d, plan.entry, plan.stop, c.atr, tlv, ctx);
    plan.targets = targets;
    plan.rr = targets.length >= 2 ? r2(targets[1].r) : 0;
    plan.size = positionSize(cfg, plan.entry, plan.stop);
    plan.aligned = biasDir === d;
    plan.dir = d;

    const recent = c.bars.slice(-30, -1);
    const ext = d === 1 ? Math.max.apply(null, recent.map((b) => b.h)) : Math.min.apply(null, recent.map((b) => b.l));
    if (plan.order === 'limit') {
      plan.alt = {
        type: d === 1 ? 'BUY_STOP' : 'SELL_STOP',
        price: r2(ext + d * 0.1 * c.atr),
        stop: r2(ext - d * 0.9 * c.atr),
        note: (d === 1 ? '站上 ' : '跌破 ') + fmtPrice(ext) + ' 确认后，用 ' + (d === 1 ? 'Buy Stop ' : 'Sell Stop ') + fmtPrice(ext + d * 0.1 * c.atr) + ' 追（含 0.1×ATR 缓冲）',
      };
    } else {
      const pull = d === 1 ? Math.min(c.ema20, c.ema50) : Math.max(c.ema20, c.ema50);
      plan.alt = {
        type: d === 1 ? 'BUY_LIMIT' : 'SELL_LIMIT',
        price: r2(pull),
        stop: r2(pull - d * 1.0 * c.atr),
        note: '等回踩 EMA20/50 ' + fmtPrice(pull) + ' 再接（限价单）',
      };
    }
    plan.mt5type = (d === 1 ? 'BUY' : 'SELL') + (plan.order === 'limit' ? '_LIMIT' : '');
    return plan;
  }

  function buildSides(ctx, cfg, bias) {
    const specs = [
      { key: 'short', label: '短线', tf: '15m', targetTf: '1h' },
      { key: 'long', label: '长线', tf: '4h', targetTf: '1d' },
    ];
    const out = {};
    specs.forEach((sp) => {
      const c = ctx[sp.tf], tgt = ctx[sp.targetTf];
      if (!c || !tgt) return;
      const lv = buildLevels(c, ctx['1d'], c.price);
      const zones = mergeZoneLists(lv.zones, buildZones(tgt.swings, tgt.atr, tgt.bars), c.atr);
      const tlv = Object.assign({}, lv, { zones });
      out[sp.key] = {
        key: sp.key, label: sp.label, tf: sp.tf.toUpperCase(),
        buy: makeSide(1, c, lv, tlv, cfg, ctx, bias.direction),
        sell: makeSide(-1, c, lv, tlv, cfg, ctx, bias.direction),
      };
    });
    return out;
  }

  /* ------------------------------------------------------ pro structure */
  function detectStructure(bars, swings) {
    const price = bars[bars.length - 1].c;
    const st = structureState(swings);
    const highs = swings.filter((s) => s.kind === 'H');
    const lows = swings.filter((s) => s.kind === 'L');
    const lastH = highs[highs.length - 1];
    const lastL = lows[lows.length - 1];
    if (!lastH || !lastL) return null;
    let event = '区间内', dir = 0, detail = '';
    if (price > lastH.price) {
      dir = 1;
      event = st.trend >= 0 ? 'BOS 向上突破' : 'CHoCH 转多';
      detail = 'H1 收盘 ' + fmtPrice(price) + ' 站上最近摆动高点 ' + fmtPrice(lastH.price) + '（' + fmtTs(lastH.t) + '）';
    } else if (price < lastL.price) {
      dir = -1;
      event = st.trend <= 0 ? 'BOS 向下突破' : 'CHoCH 转空';
      detail = 'H1 收盘 ' + fmtPrice(price) + ' 跌破最近摆动低点 ' + fmtPrice(lastL.price) + '（' + fmtTs(lastL.t) + '）';
    } else {
      detail = '价格仍在 ' + fmtPrice(lastL.price) + ' - ' + fmtPrice(lastH.price) + ' 之间，未出现结构突破';
    }
    return { event, dir, detail, lastHigh: r2(lastH.price), lastLow: r2(lastL.price) };
  }

  function orderBlock(bars, atr) {
    const price = bars[bars.length - 1].c;
    for (let i = bars.length - 2; i >= Math.max(2, bars.length - 80); i--) {
      const b = bars[i];
      if (Math.abs(b.c - b.o) < 1.3 * atr) continue;
      const up = b.c > b.o;
      for (let j = i - 1; j >= Math.max(0, i - 5); j--) {
        const o = bars[j];
        const opposite = up ? o.c < o.o : o.c > o.o;
        if (!opposite) continue;
        const lo = Math.min(o.o, o.c), hi = Math.max(o.o, o.c);
        const inside = price >= lo && price <= hi;
        const dist = inside ? 0 : (price > hi ? price - hi : lo - price);
        if (dist > 6 * atr) return null;
        return {
          type: up ? '看涨订单块' : '看跌订单块', dir: up ? 1 : -1,
          lo: r2(lo), hi: r2(hi), inside, dist: r2(dist),
          detail: (up ? '上涨' : '下跌') + '启动前的最后一根反向 K 线，区间 ' + fmtPrice(lo) + '-' + fmtPrice(hi) +
            (inside ? '，价格正在块内' : '，距现价 ' + dist.toFixed(2) + '（' + (dist / atr).toFixed(2) + '×ATR）'),
        };
      }
    }
    return null;
  }

  function fairValueGap(bars, atr) {
    const price = bars[bars.length - 1].c;
    const out = [];
    for (let i = Math.max(2, bars.length - 60); i < bars.length; i++) {
      const a = bars[i - 2], c = bars[i];
      if (a.h < c.l) {
        const lo = a.h, hi = c.l;
        if (price > hi) out.push({ dir: 1, lo, hi, i, t: c.t });
      } else if (a.l > c.h) {
        const lo = c.h, hi = a.l;
        if (price < lo) out.push({ dir: -1, lo, hi, i, t: c.t });
      }
    }
    if (!out.length) return null;
    out.sort((x, y) => Math.abs((x.lo + x.hi) / 2 - price) - Math.abs((y.lo + y.hi) / 2 - price));
    const g = out[0];
    const mid = (g.lo + g.hi) / 2;
    return {
      dir: g.dir, lo: r2(g.lo), hi: r2(g.hi), dist: r2(Math.abs(mid - price)),
      detail: (g.dir === 1 ? '看涨' : '看跌') + '失衡缺口 ' + fmtPrice(g.lo) + '-' + fmtPrice(g.hi) +
        '，形成于 ' + fmtTs(g.t) + '，现价距缺口 ' + (Math.abs(mid - price) / atr).toFixed(2) + '×ATR',
    };
  }

  function premiumDiscount(bars) {
    const win = bars.slice(-50);
    const hi = Math.max.apply(null, win.map((b) => b.h));
    const lo = Math.min.apply(null, win.map((b) => b.l));
    const price = bars[bars.length - 1].c;
    const pos = hi > lo ? (price - lo) / (hi - lo) : 0.5;
    let zone, dir = 0;
    if (pos >= 0.65) { zone = '溢价区'; dir = -1; }
    else if (pos <= 0.35) { zone = '折价区'; dir = 1; }
    else zone = '均衡区';
    return {
      dir, zone, pos: Math.round(pos * 100), hi: r2(hi), lo: r2(lo),
      detail: '近 50 根区间 ' + fmtPrice(lo) + '-' + fmtPrice(hi) + '，现价在 ' + Math.round(pos * 100) + '% 位置（' + zone + '）',
    };
  }

  function liquiditySweep(bars, atr) {
    const n = bars.length;
    for (let i = n - 2; i >= Math.max(20, n - 8); i--) {
      const b = bars[i];
      const prior = bars.slice(i - 20, i);
      const hi = Math.max.apply(null, prior.map((x) => x.h));
      const lo = Math.min.apply(null, prior.map((x) => x.l));
      if (b.h > hi && b.c < hi && b.h - hi > 0.15 * atr) {
        return { dir: -1, detail: '上影扫过前高 ' + fmtPrice(hi) + ' 后收回，属于流动性扫单（假突破）', level: r2(hi), t: b.t };
      }
      if (b.l < lo && b.c > lo && lo - b.l > 0.15 * atr) {
        return { dir: 1, detail: '下影扫过前低 ' + fmtPrice(lo) + ' 后收回，属于流动性扫单（假跌破）', level: r2(lo), t: b.t };
      }
    }
    return null;
  }

  function buildPro(ctx) {
    const c = ctx['1h'];
    if (!c) return null;
    const h4 = ctx['4h'];
    const st = detectStructure(c.bars, c.swings);
    const ob = orderBlock(c.bars, c.atr);
    const gap = fairValueGap(c.bars, c.atr);
    const pd = premiumDiscount(c.bars);
    const sweep = liquiditySweep(c.bars, c.atr);
    const items = [
      st && { key: '结构', title: '市场结构', value: st.event, dir: st.dir, rel: st.dir !== 0, detail: st.detail },
      ob && { key: 'OB', title: '订单块', value: ob.type + (ob.inside ? ' · 价格在块内' : ''), dir: ob.dir, rel: ob.dist <= 2 * c.atr, detail: ob.detail },
      gap && { key: 'FVG', title: '失衡缺口', value: gap.dir === 1 ? '看涨 FVG' : '看跌 FVG', dir: gap.dir, rel: gap.dist <= 2 * c.atr, detail: gap.detail },
      { key: 'PD', title: '溢价 / 折价', value: pd.zone + ' ' + pd.pos + '%', dir: pd.dir, rel: pd.dir !== 0, detail: pd.detail },
      sweep && { key: 'SWEEP', title: '流动性扫单', value: sweep.dir === 1 ? '扫低回收' : '扫高回落', dir: sweep.dir, rel: true, detail: sweep.detail + '（' + fmtTs(sweep.t) + '）' },
    ].filter(Boolean);
    const bull = items.filter((x) => x.rel && x.dir === 1).length;
    const bear = items.filter((x) => x.rel && x.dir === -1).length;
    const h4Trend = h4 ? h4.label : '—';
    return {
      items, bull, bear,
      h4Trend,
      summary: '支撑 ' + bull + ' 项 / 阻力 ' + bear + ' 项' + (st ? ' · ' + st.event : ''),
      glossary: [
        { t: 'BOS', d: 'Break of Structure，顺势突破前一个摆动高/低点，代表趋势延续。' },
        { t: 'CHoCH', d: 'Change of Character，逆势突破前一个摆动点，代表趋势可能转向。' },
        { t: '订单块 OB', d: '启动一波行情前最后一根反向 K 线，机构挂单密集区，常被回踩。' },
        { t: 'FVG', d: 'Fair Value Gap，三根 K 线之间的价格真空（失衡），价格常回来填补。' },
        { t: '溢价/折价', d: '把区间分成 0-100%，上半部（>65%）偏贵适合卖，下半部（<35%）偏便宜适合买。' },
        { t: '流动性扫单', d: '影线刺穿前高/前低后迅速收回，扫掉止损再反向走，通常是假突破。' },
      ],
    };
  }

  function buildPlan(bias, ctx, levels, cfg) {    const price = ctx['1h'].price, atr = ctx['1h'].atr;
    const d = bias.direction;
    let plan = null;
    if (d !== 0) plan = trendSetup(d, ctx['1h'], levels, cfg);
    if (!plan) plan = rangeSetup(ctx, levels, price, atr);
    if (!plan) {
      const near = levels.near;
      const resTxt = near.resistance.length ? '上方阻力 ' + fmtPrice(near.resistance[0].lo) + '（' + near.distResistanceAtr.toFixed(1) + '×ATR）' : '上方无明显阻力';
      const supTxt = near.support.length ? '下方支撑 ' + fmtPrice(near.support[0].hi) + '（' + near.distSupportAtr.toFixed(1) + '×ATR）' : '下方无明显支撑';
      return {
        type: '无有效形态', dir: d, status: 'WAIT', triggered: false,
        entry: null, entry_zone: null, order: null,
        trigger: '价格 ' + fmtPrice(price) + ' 位于结构中部：' + supTxt + '，' + resTxt,
        confluence: [], stop: null, stop_reason: '无入场即无止损', risk_ref: null,
      };
    }
    return plan;
  }

  function pctRank(values, window) {
    const v = values.filter((x) => isFinite(x));
    if (v.length < 10) return 50;
    const win = v.slice(-(window || 100));
    const last = win[win.length - 1];
    return (win.filter((x) => x <= last).length / win.length) * 100;
  }

  function scorePlan(plan, bias, ctx, levels, m15, cfg, dataOk) {
    const ev = [];
    const d = plan.dir || 0;
    const h1 = ctx['1h'], h4 = ctx['4h'], d1 = ctx['1d'];
    const add = (group, item, detail, points, max, pass) =>
      ev.push({ group, item, detail, points: r1(points), max, pass: !!pass });

    if (d !== 0) {
      if (!bias.legacy) {
        const al = bias.alignment || 0;
        add('趋势', '多周期一致性',
          (bias.aligned || 0) + '/' + bias.rows.length + ' 个周期同向（' + Math.round(al * 100) + '%）· ' +
          '多 ' + bias.counts.long + ' / 空 ' + bias.counts.short + ' / 中性 ' + bias.counts.neutral,
          Math.round(al * 10), 10, al >= 0.6);
      }
      let m = bias.legacy ? WEIGHTS.trend * 0.45 : 4;
      let align = !!(d1 && d1.score * d > 0.4), half = !!(d1 && d1.score * d > 0);
      add('趋势', 'D1 方向', d1 ? d1.label + '（评分 ' + d1.score.toFixed(2) + '）：' + d1.detail : '无 D1 数据', align ? m : half ? m * 0.5 : 0, r1(m), align);
      m = bias.legacy ? WEIGHTS.trend * 0.32 : 4;
      align = !!(h4 && h4.score * d > 0.3); half = !!(h4 && h4.score * d > 0);
      add('趋势', 'H4 方向', h4 ? h4.label + '（评分 ' + h4.score.toFixed(2) + '）：' + h4.detail : '无 H4 数据', align ? m : half ? m * 0.5 : 0, r1(m), align);
      m = bias.legacy ? WEIGHTS.trend * 0.23 : 4;
      const stack = (h1.ema20 - h1.ema50) * d > 0 && (h1.price - h1.ema200) * d > 0;
      add('趋势', 'H1 均线排列', 'EMA20 ' + fmtPrice(h1.ema20) + ' / EMA50 ' + fmtPrice(h1.ema50) + ' / EMA' + h1.emaLen + ' ' + fmtPrice(h1.ema200) + (h1.emaLen < 200 ? '（样本不足 200 根）' : ''), stack ? m : 0, r1(m), stack);
    } else {
      add('趋势', '方向一致性', 'D1/H4/H1 未形成多数同向，只做区间边缘', 0, 22, false);
    }

    if (plan.type === '趋势回踩' && plan.entry_zone) {
      const retr = plan.retracement || 0;
      const ideal = retr >= 0.25 && retr <= 0.65;
      add('位置', '回踩深度', '回撤 ' + Math.round(retr * 100) + '%（理想 25-65%），回踩带 ' + fmtPrice(plan.entry_zone[0]) + '-' + fmtPrice(plan.entry_zone[1]), ideal ? 8 : 4, 8, ideal);
      const zs = levels.zones.filter((z) => !(z.hi < plan.entry_zone[0] || z.lo > plan.entry_zone[1]));
      const strength = zs.length ? Math.max.apply(null, zs.map((z) => z.strength)) : 0;
      add('位置', '结构区支撑', '回踩带内结构区最高强度 ' + strength, Math.min(10, strength), 10, strength >= 5);
    } else if (plan.type === '区间低吸' || plan.type === '区间高抛') {
      const z = plan.dir === 1 ? levels.near.support[0] : levels.near.resistance[0];
      add('位置', '区间边缘', '贴着 ' + fmtPrice(z.lo) + '-' + fmtPrice(z.hi) + '，强度 ' + z.strength + '，' + z.touches + ' 次触碰', Math.min(18, z.strength * 2), 18, z.strength >= 5);
    } else {
      add('位置', '入场位置', plan.trigger || '', 10, 18, true);
    }

    if (plan.status === 'READY') {
      let ok, detail;
      if (plan.type === '突破跟进') { ok = true; detail = plan.trigger; }
      else { const r = m15Trigger(m15, d); ok = r[0]; detail = r[1]; }
      add('触发', '15m 确认', ok ? detail : detail + '（按市价/挂单执行）', ok ? 12 : 6, 12, ok);
      const chasing = Math.abs(h1.price - h1.ema20) > 2.2 * h1.atr;
      add('触发', '非追单', '价格距 EMA20 ' + (Math.abs(h1.price - h1.ema20) / h1.atr).toFixed(2) + '×ATR（>2.2 视为追单）', chasing ? 0 : 6, 6, !chasing);
    } else {
      add('触发', '等待触发', plan.status === 'PENDING' ? '价格 ' + fmtPrice(h1.price) + ' 未进入入场带，等待回踩' : '形态不成立，不挂单', 0, 12, false);
      add('触发', '入场方式', plan.status === 'PENDING' ? '价格未到入场带，挂限价单等待' : '形态不成立', plan.status === 'PENDING' ? 6 : 0, 6, plan.status === 'PENDING');
    }

    const rsi = h1.rsi;
    const okRsi = d === 1 ? (rsi >= 45 && rsi <= 72) : d === -1 ? (rsi >= 28 && rsi <= 55) : (rsi >= 40 && rsi <= 60);
    add('动量', 'RSI(14)', rsi.toFixed(1) + '（' + (d === 1 ? '偏多' : '偏空') + '健康区）', okRsi ? 6 : 3, 6, okRsi);
    const macdOk = d ? h1.macdHist * d > 0 : Math.abs(h1.macdHist) < 0.2 * h1.atr;
    add('动量', 'MACD 柱', (h1.macdHist >= 0 ? '+' : '') + h1.macdHist.toFixed(2), macdOk ? 3 : 1, 3, macdOk);
    add('动量', 'ADX(14)', h1.adx.toFixed(1) + '（>20 有趋势，>25 强趋势）', h1.adx >= 20 ? 3 : 0, 3, h1.adx >= 20);

    const targets = plan.targets || [];
    let room, roomSrc;
    if (targets.length && plan.entry) { room = Math.abs(targets[0].price - plan.entry) / h1.atr; roomSrc = '首目标 ' + fmtPrice(targets[0].price); }
    else {
      const n = levels.near;
      room = d === 1 ? n.distResistanceAtr : n.distSupportAtr;
      if (room == null) room = 3;
      roomSrc = '最近结构';
    }
    add('空间', '到首目标空间', room.toFixed(2) + '×ATR（' + roomSrc + '，≥1.5 视为空间充足）', room >= 1.5 ? 10 : room >= 1 ? 6 : 2, 10, room >= 1);

    const rr = plan.rr || 0;
    add('盈亏比', 'TP2 盈亏比', rr.toFixed(2) + 'R（最低要求 ' + cfg.minRr + 'R）', rr >= 2.5 ? 12 : rr >= 2 ? 9 : rr >= 1.5 ? 6 : 0, 12, rr >= cfg.minRr);
    add('数据', '数据完整性', dataOk ? '实时报价 + 对齐后的 K 线' : '数据滞后，信号仅供结构参考', dataOk ? 8 : 0, 8, dataOk);

    const conf = ev.reduce((a, e) => a + e.points, 0);
    return [ev, Math.round(Math.min(100, conf) * 10) / 10];
  }

  /* ------------------------------------------------------------------ main */
  function analyze(rawBundle, cfg) {
    const ctx = {};
    TF_LIST.forEach(({ key }) => {
      if (!rawBundle[key]) return;
      try { ctx[key] = tfContext(rawBundle[key].bars, key); } catch (e) { /* skip thin history */ }
    });
    if (!ctx['1h']) throw new Error('H1 数据不可用，无法生成信号');
    if (!ctx['1d']) throw new Error('D1 数据不可用，无法计算 PDH/PDL 与日线结构');

    const h1 = ctx['1h'];
    const spot = rawBundle.spot || {};
    const price = spot.mid || h1.price;
    const atr = h1.atr;
    const levels = buildLevels(h1, ctx['1d'], price);
    const bias = cfg.legacyBias ? legacyBias(ctx) : consensus(ctx);
    const plan = buildPlan(bias, ctx, levels, cfg);

    const targets = plan.entry ? buildTargets(plan.dir, plan.entry, plan.stop, atr, levels, ctx) : [];
    plan.targets = targets;
    plan.rr = targets.length >= 2 ? r2(targets[1].r) : 0;
    plan.triggered = false;
    plan.trigger_note = '';
    if (plan.dir && plan.status === 'READY') {
      if (plan.type === '突破跟进') { plan.triggered = true; plan.trigger_note = plan.trigger; }
      else { const t = m15Trigger(ctx['15m'], plan.dir); plan.triggered = t[0]; plan.trigger_note = t[1]; }
    }

    const dataOk = !rawBundle.stale;
    const scored = scorePlan(plan, bias, ctx, levels, ctx['15m'], cfg, dataOk);
    const evidence = scored[0], confidence = scored[1];

    const blockers = [];
    const htfScore = groupScore(bias.rows, ['MN', 'W1', 'D1']);
    const ltfScore = groupScore(bias.rows, ['H1', 'M30', 'M15', 'M5', 'M1']);
    if (plan.dir !== 0 && htfScore * ltfScore < 0 && Math.abs(htfScore) > 0.6 && Math.abs(ltfScore) > 0.6) {
      blockers.push('大周期（MN/W1/D1 ' + htfScore.toFixed(2) + '）与小周期（H1 以下 ' + ltfScore.toFixed(2) + '）方向相反，等同步再进');
    }
    if (plan.dir !== 0 && bias.alignment > 0 && bias.alignment < 0.4) {
      blockers.push('9 个周期只有 ' + bias.aligned + ' 个同向（一致性 ' + Math.round(bias.alignment * 100) + '%），方向不统一');
    }
    if (plan.entry && plan.stop) {
      const risk = Math.abs(plan.entry - plan.stop);
      if (risk > cfg.maxStopAtr * atr) blockers.push('止损距离 ' + risk.toFixed(2) + ' = ' + (risk / atr).toFixed(2) + '×ATR，超过上限 ' + cfg.maxStopAtr + '×ATR');
      if (plan.rr && plan.rr < cfg.minRr) blockers.push('TP2 盈亏比 ' + plan.rr.toFixed(2) + 'R 低于最低 ' + cfg.minRr + 'R');
      const over = Math.abs(price - h1.ema20) / atr;
      if (over > 2.5) blockers.push('价格偏离 EMA20 ' + over.toFixed(2) + '×ATR，追单性价比低，等回踩');
      if (plan.dir === 1 && levels.near.resistance.length) {
        const z = levels.near.resistance[0];
        if (z.lo - plan.entry < 0.5 * risk) blockers.push('入场价距上方阻力 ' + fmtPrice(z.lo) + ' 仅 ' + (z.lo - plan.entry).toFixed(2) + '，空间不足');
      }
      if (plan.dir === -1 && levels.near.support.length) {
        const z = levels.near.support[0];
        if (plan.entry - z.hi < 0.5 * risk) blockers.push('入场价距下方支撑 ' + fmtPrice(z.hi) + ' 仅 ' + (plan.entry - z.hi).toFixed(2) + '，空间不足');
      }
    }
    if (!dataOk) blockers.push('实时报价缺失或滞后，等数据恢复再执行');
    const atrRank = pctRank(h1.bars.map((b) => b.atr));
    if (atrRank < 8) blockers.push('ATR 处于近 100 根的第 ' + atrRank.toFixed(0) + ' 百分位，波动率过低');

    let action;
    if (plan.status === 'WAIT' || !plan.entry) action = 'WAIT';
    else if (blockers.length) action = 'WAIT';
    else if (plan.status === 'PENDING') action = plan.dir === 1 ? 'LIMIT_BUY' : 'LIMIT_SELL';
    else if (plan.triggered) action = plan.dir === 1 ? 'BUY' : 'SELL';
    else action = 'WAIT';

    const grade = confidence >= 78 ? 'A' : confidence >= 62 ? 'B' : confidence >= 45 ? 'C' : 'D';
    const actionCn = { BUY: '现价做多', SELL: '现价做空', LIMIT_BUY: '挂单做多', LIMIT_SELL: '挂单做空', WAIT: '观望' }[action];
    const narrative = buildNarrative(bias, plan, targets, h1, price, action, blockers);
    const barHours = { '15m': 0.25, '1h': 1, '4h': 4, '1d': 24 }[cfg.tf] || 1;

    if (targets.length) {
      management.push(
        'TP1 ' + fmtPrice(targets[0].price) + '（' + targets[0].r.toFixed(2) + 'R）平 40%，止损移到入场 ' + fmtPrice(plan.entry),
        'TP2 ' + fmtPrice(targets[1].price) + '（' + targets[1].r.toFixed(2) + 'R）再平 35%，剩余仓位用 1.5×ATR 跟踪',

    const invalidation = plan.stop

      : '';

          '止损 ' + plan.stop.toFixed(2) + '，止盈 ' + targets[0].price.toFixed(2) + '（先挂 TP1，成交后按下面的管理改）',
          '有效期：' + (pending ? 'GTC，' + fmtTs(valid.getTime()) + ' 前未成交就删单' : '市价即时成交'),
          '成交后：TP1 平 40% → 止损移到入场 ' + plan.entry.toFixed(2) + ' → TP2 平 35% → 余下 25% 看 TP3 ' + targets[2].price.toFixed(2),
        ],

        charts['1w'] = miniChart(chartCtx(groupBars(deep, (t) => Math.floor((t + 345600000) / 604800000)), '1w'), plan, false, 520);
        charts['1M'] = miniChart(chartCtx(groupBars(deep, (t) => {
          const d = new Date(t);
          return d.getUTCFullYear() * 12 + d.getUTCMonth();
        }), '1M'), plan, false, 260);
      }
    }

    const pro = buildPro(ctx);

    return {
      generated_at: new Date(now).toISOString(),
      generated_local: new Date(now).toLocaleString('sv-SE', { timeZone: 'Asia/Kuala_Lumpur' }),
      verdict: { action, label: actionCn, confidence, grade, status: plan.status, summary: narrative, blockers },
      market: {
        price: r2(price), bid: spot.bid, ask: spot.ask, spread: spot.spread,
        atr: r2(atr), atr_pct: Math.round((atr / price) * 10000) / 100,
        atr_rank: Math.round(atrRank),
        session: sessionOf(now),
        change: change != null ? r2(change) : null,
        change_pct: change != null ? Math.round((change / dayOpen) * 10000) / 100 : null,
        day_open: dayOpen ? r2(dayOpen) : null,

      bias,
      setup: {
        type: plan.type, dir: plan.dir, status: plan.status,
        entry: plan.entry, entry_zone: plan.entry_zone, order: plan.order,
        trigger: plan.trigger, trigger_note: plan.trigger_note,
        stop: plan.stop, stop_reason: plan.stop_reason,
        invalidation, retracement: plan.retracement,
      },
      risk: { stop: plan.stop, entry: plan.entry, targets, rr: plan.rr, size },
      management, ticket, mt5, evidence,
      sides, pro,
      levels: {
        support: levels.near.support.map((z) => ({ lo: r2(z.lo), hi: r2(z.hi), strength: z.strength, touches: z.touches, last_ts: fmtTs(z.lastT) })),
        resistance: levels.near.resistance.map((z) => ({ lo: r2(z.lo), hi: r2(z.hi), strength: z.strength, touches: z.touches, last_ts: fmtTs(z.lastT) })),
        pdh: r2(levels.pdh), pdl: r2(levels.pdl),
        round: levels.round.map(r2),
        liquidity: levels.liquidity.slice(0, 4).map((x) => ({ kind: x.kind, price: r2(x.price), detail: x.detail })),
      },
      scenarios,
      data: {
        source: rawBundle.source || 'Binance PAXGUSDT',
        spot_source: spot.source || null,
        basis: rawBundle.offset || 0,
        bars: { '1d': ctx['1d'].barsCount, '4h': ctx['4h'] ? ctx['4h'].barsCount : 0, '1h': ctx['1h'].barsCount, '15m': ctx['15m'] ? ctx['15m'].barsCount : 0 },
        last_ts: fmtTs(h1.bars[h1.bars.length - 1].t),
        stale: !dataOk,
        spot_ts: spot.ts ? fmtTs(spot.ts) : null,
        notes: rawBundle.notes || [],

  function buildNarrative(bias, plan, targets, h1, price, action, blockers) {
    const parts = ['大周期' + bias.label + '（加权 ' + (bias.score >= 0 ? '+' : '') + bias.score.toFixed(2) + '），H1 价格 ' + fmtPrice(price) + '，ATR ' + h1.atr.toFixed(2) + '。'];
    if (plan.entry && plan.stop && targets.length) {
      const d = plan.dir;
      const band = plan.entry_zone || [plan.entry, plan.entry];
      parts.push('计划' + (plan.status === 'PENDING' ? '挂限价' : '市价') + (d === 1 ? '多' : '空') +
        '：入场 ' + fmtPrice(plan.entry) + '（区间 ' + fmtPrice(band[0]) + '-' + fmtPrice(band[1]) + '），止损 ' + fmtPrice(plan.stop) +
        '（' + (Math.abs(plan.entry - plan.stop) / h1.atr).toFixed(2) + '×ATR），目标 ' + fmtPrice(targets[0].price) + ' / ' +
        fmtPrice(targets[1].price) + ' / ' + fmtPrice(targets[2].price) + '，TP2 ' + plan.rr.toFixed(2) + 'R。');
      if (plan.confluence && plan.confluence.length) parts.push('入场依据：' + plan.confluence.slice(0, 3).join('；') + '。');
    } else if (plan.trigger) parts.push(plan.trigger + '。');
    if (blockers.length) parts.push('不执行原因：' + blockers.join('；') + '。');

  function buildScenarios(plan, levels, h1, d) {
    const price = h1.price, atr = h1.atr;
    const res = levels.near.resistance.length ? levels.near.resistance[0].lo : price + 2 * atr;
    const sup = levels.near.support.length ? levels.near.support[0].hi : price - 2 * atr;
    return {
      bull: 'H1 收盘站上 ' + fmtPrice(res) + ' 且回踩不破 → 多头延续，下一目标 ' + fmtPrice(res + 1.5 * atr),
      bear: 'H1 收盘跌破 ' + fmtPrice(sup) + ' → 结构转弱，下方看 ' + fmtPrice(sup - 1.5 * atr),
      neutral: '价格留在 ' + fmtPrice(sup) + '-' + fmtPrice(res) + ' 之间则维持区间，只做边缘',

  }

  /* ------------------------------------------------ deep history (2018+) */
  function groupBars(bars, keyFn) {
    const out = [];
    let cur = null, key = null;
    bars.forEach((b) => {
      const k = keyFn(b.t);
      if (k !== key) {
        if (cur) out.push(cur);
        cur = { t: b.t, o: b.o, h: b.h, l: b.l, c: b.c, v: 0 };
        key = k;
      } else {
        cur.h = Math.max(cur.h, b.h);
        cur.l = Math.min(cur.l, b.l);
        cur.c = b.c;
      }
    });
    if (cur) out.push(cur);
    return out;
  }

  function chartCtx(bars, tf) {

    const last = b[b.length - 1];
    return {
      tf, bars: b, price: last.c, atr: last.atr || 1,
      swings: cleanSwings(findSwings(b, 2)),
    };
  }

    if (!history || history.length < 30 || !liveBars.length) return null;
    const firstLive = liveBars[0];
    const hist = history.filter((b) => b.t < firstLive.t);
    if (hist.length < 30) return null;
    const delta = firstLive.o - hist[hist.length - 1].c;   // rebase so the seam is continuous
    const shifted = hist.map((b) => ({ t: b.t, o: b.o + delta, h: b.h + delta, l: b.l + delta, c: b.c + delta, v: 0 }));
    return shifted.concat(liveBars);
  }

    const bars = c.bars.slice(-n);
    const startI = c.bars.length - bars.length;
    const zones = buildZones(c.swings, c.atr, c.bars).slice(0, 5);
    return {
      tf: c.tf,
      total: bars.length,
      candles: bars.map((b) => ({ t: new Date(b.t).toISOString(), o: r2(b.o), h: r2(b.h), l: r2(b.l), c: r2(b.c) })),
      ema20: bars.map((b) => r2(b.ema20)),
      ema50: bars.map((b) => r2(b.ema50)),
      swings: c.swings.filter((s) => s.i >= startI).slice(-40).map((s) => ({ t: new Date(s.t).toISOString(), i: s.i - startI, price: r2(s.price), kind: s.kind })),
      zones: zones.map((z) => ({ lo: r2(z.lo), hi: r2(z.hi), strength: z.strength, touches: z.touches })),
      levels: { pdh: null, pdl: null },
      plan: isExec && plan
        ? { dir: plan.dir, status: plan.status, entry: plan.entry, stop: plan.stop, targets: (plan.targets || []).map((t) => t.price) }
        : { dir: 0, status: null, entry: null, stop: null, targets: [] },
      price: r2(c.price), atr: r2(c.atr),

      ema20: bars.map((b) => r2(b.ema20)),
      ema50: bars.map((b) => r2(b.ema50)),
      swings: h1.swings.filter((s) => s.i >= startI).slice(-14).map((s) => ({ t: new Date(s.t).toISOString(), i: s.i - startI, price: r2(s.price), kind: s.kind })),
      zones: levels.zones.slice(0, 6).map((z) => ({ lo: r2(z.lo), hi: r2(z.hi), strength: z.strength, touches: z.touches })),

(function (global) {
  'use strict';

  const HOSTS = [
    'https://data-api.binance.vision',
    'https://api.binance.com',
    'https://api1.binance.com',
  ];
  const TF_MS = {
    '1m': 60000, '5m': 300000, '15m': 900000, '30m': 1800000,
    '1h': 3600000, '4h': 14400000, '1d': 86400000, '1w': 604800000, '1M': 0,
  };
  const LIMITS = { '1m': 1000, '5m': 1000, '15m': 1000, '30m': 1000, '1h': 1000, '4h': 1000, '1d': 1000, '1w': 500, '1M': 500 };
  const TFS = ['1m', '5m', '15m', '30m', '1h', '4h', '1d', '1w', '1M'];

  async function getJson(path, timeoutMs) {
    let lastErr;
    for (const host of HOSTS) {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs || 12000);
        const res = await fetch(host + path, { signal: ctrl.signal, cache: 'no-store' });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('网络不可用');
  }

  function barClosed(t, interval) {
    const now = Date.now();
    if (interval === '1M') {
      const d = new Date(t);
      const next = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1);
      return now >= next;
    }
    return t + TF_MS[interval] <= now;
  }

  async function fetchKlines(symbol, interval, limit) {
    const data = await getJson('/api/v3/klines?symbol=' + symbol + '&interval=' + interval + '&limit=' + limit);
    const bars = [];
    for (const k of data) {
      const t = Number(k[0]);
      if (!barClosed(t, interval)) continue;   // drop the still-forming candle
      bars.push({ t, o: +k[1], h: +k[2], l: +k[3], c: +k[4], v: +k[5] });
    }
    return bars;
  }

  async function fetchTick(symbol) {
    try {
      const d = await getJson('/api/v3/ticker/bookTicker?symbol=' + symbol, 8000);
      const bid = +d.bidPrice, ask = +d.askPrice;
      return { bid, ask, mid: (bid + ask) / 2, spread: +(ask - bid).toFixed(3), ts: Date.now() };
    } catch (e) {
      return null;
    }
  }

  function shift(bars, offset) {
    if (!offset) return bars;
    return bars.map((b) => ({ t: b.t, o: b.o + offset, h: b.h + offset, l: b.l + offset, c: b.c + offset, v: b.v }));
  }

  async function loadMarket(cfg) {
    const symbol = cfg.dataSymbol || 'PAXGUSDT';
    const results = await Promise.all(TFS.map((tf) => fetchKlines(symbol, tf, LIMITS[tf]).catch(() => [])));
    const h1 = results[TFS.indexOf('1h')];
    if (!h1.length) throw new Error('行情为空');
    const tick = await fetchTick(symbol);
    const offset = Number(cfg.offset) || 0;
    const spotMid = tick ? tick.mid : h1[h1.length - 1].c;

    const bundle = {};
    TFS.forEach((tf, i) => {
      const bars = results[i];
      if (bars.length) bundle[tf] = { bars: shift(bars, offset) };
    });
    bundle.spot = tick
      ? { mid: spotMid + offset, bid: +(tick.bid + offset).toFixed(3), ask: +(tick.ask + offset).toFixed(3), spread: tick.spread, ts: tick.ts, source: 'Binance ' + symbol }
      : { mid: spotMid + offset, source: 'Binance ' + symbol };
    bundle.source = 'Binance ' + symbol;
    bundle.offset = offset;
    bundle.stale = false;
    bundle.notes = [];
    bundle.fetched_at = Date.now();
    if (typeof window !== 'undefined' && window.GOLD_HISTORY_DAILY) {
      bundle.history = window.GOLD_HISTORY_DAILY.map((a) => (
        Array.isArray(a) ? { t: a[0], o: a[1], h: a[2], l: a[3], c: a[4] } : a
      ));
    }
    return bundle;
  }

  global.GoldData = { loadMarket, fetchKlines, fetchTick, barClosed };
  if (typeof module !== 'undefined' && module.exports) module.exports = global.GoldData;
})(typeof window !== 'undefined' ? window : globalThis);

/* GOLD SPOT dashboard - vanilla JS, no build step. */
'use strict';

const $ = (id) => document.getElementById(id);
const MONO = 'ui-monospace, Consolas, monospace';
const REFRESH_SEC = 60;

const S = { p: null, left: REFRESH_SEC, loading: false, geo: null, hover: -1, offline: false, lastLoad: 0, chartTf: '1h', view: { count: 120, offset: 0 } };
const TF_LABEL = { '1m': 'M1', '5m': 'M5', '15m': 'M15', '30m': 'M30', '1h': 'H1', '4h': 'H4', '1d': 'D1', '1w': 'W1', '1M': 'MN' };
const TF_ORDER = ['1M', '1w', '1d', '4h', '1h', '30m', '15m', '5m', '1m'];
const CACHE_KEY = 'gold-last-payload-v2';

function readCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function writeCache(p) {
  try {
    const slim = Object.assign({}, p);
    slim.charts = p.charts && p.charts['1h'] ? { '1h': p.charts['1h'] } : null;
    localStorage.setItem(CACHE_KEY, JSON.stringify(slim));
  } catch (e) { /* quota */ }
}

const fmt2 = (x) => (x === null || x === undefined || Number.isNaN(Number(x)))
  ? '--' : Number(x).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtN = (x, d = 0) => (x === null || x === undefined)
  ? '--' : Number(x).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = (s) => String(s === null || s === undefined ? '' : s)
  .replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const fmtTime = (t) => new Date(t).toLocaleTimeString('zh-CN',
  { timeZone: 'Asia/Kuala_Lumpur', hour: '2-digit', minute: '2-digit', hour12: false });
const axisFmt = new Intl.DateTimeFormat('en-GB', {
  timeZone: 'Asia/Kuala_Lumpur', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false,
});
const fmtAxis = (t) => {
  const parts = Object.fromEntries(axisFmt.formatToParts(new Date(t)).map((x) => [x.type, x.value]));
  return parts.month + '-' + parts.day + ' ' + parts.hour + ':' + parts.minute;
};
const fmtDT = (t) => new Date(t).toLocaleString('zh-CN',
  { timeZone: 'Asia/Kuala_Lumpur', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });

const ACTION_CLASS = { BUY: 'buy', SELL: 'sell', LIMIT_BUY: 'limit', LIMIT_SELL: 'limit', WAIT: 'wait' };
const STATUS_CN = { READY: '可执行', PENDING: '等价格到位', WAIT: '不成立' };

function showError(msg) {
  const el = $('error');
  el.textContent = '数据加载失败：' + msg;
  el.classList.remove('hidden');
  $('live-dot').className = 'dot down';
}
function hideError() { $('error').classList.add('hidden'); }

function apiUrl(force) {
  const src = new URLSearchParams(window.location.search);
  const q = new URLSearchParams();
  if (src.get('account')) q.set('account', src.get('account'));
  if (src.get('risk')) q.set('risk', src.get('risk'));
  if (force) q.set('force', '1');
  const s = q.toString();
  return '/api/plan' + (s ? '?' + s : '');
}

const SETTINGS_KEY = 'gold-settings-v1';

function readSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); } catch (e) { return {}; }
}
function writeSettings(obj) {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(obj)); } catch (e) { /* ignore */ }
}
function engineCfg() {
  const s = readSettings();
  const q = new URLSearchParams(window.location.search);
  return {
    account: Number(q.get('account') || s.account) || 10000,
    riskPct: Number(q.get('risk') || s.risk) || 0.5,
    minRr: 1.5, maxStopAtr: 2.4, tf: '1h',
    symbol: s.symbol || 'XAUUSD',
    magic: 20261124, deviation: 30, chartBars: 180,
    offset: Number(s.offset) || 0,
    dataSymbol: 'PAXGUSDT',
  };
}

async function load(force) {
  if (S.loading) return;
  S.loading = true;
  try {
    const cfg = engineCfg();
    const bundle = await GoldData.loadMarket(cfg);
    const p = GoldEngine.analyze(bundle, cfg);
    S.p = p;
    S.offline = false;
    S.lastLoad = Date.now();
    render(p);
    writeCache(p);
    hideError();
    S.left = REFRESH_SEC;
  } catch (e) {
    S.offline = true;
    if (S.p) {
      updateClock();
      $('live-dot').className = 'dot stale';
    } else {
      showError(e.message || String(e));
    }
    S.left = 20;
  } finally {
    S.loading = false;
    updateClock();
  }
}

function actionClass(a) { return ACTION_CLASS[a] || 'wait'; }

function render(p) {
  renderHeader(p);
  renderHero(p);
  renderTfTabs(p);
  renderPlan(p);
  renderSides(p);
  renderMtf(p);
  renderPro(p);
  renderEvidence(p);
  renderLevels(p);
  renderManage(p);
  renderScenarios(p);
  renderFoot(p);
  drawChart();
}

function renderHeader(p) {
  const m = p.market;
  const priceEl = $('price');
  priceEl.textContent = fmt2(m.price);
  priceEl.className = 'price ' + ((m.change || 0) >= 0 ? 'up' : 'down');
  const chg = (m.change >= 0 ? '+' : '') + fmt2(m.change) + ' (' + (m.change_pct >= 0 ? '+' : '') + Number(m.change_pct).toFixed(2) + '%)';
  $('quote-sub').textContent = '买 ' + fmt2(m.bid) + ' / 卖 ' + fmt2(m.ask) + ' · 点差 ' +
    (m.spread == null ? '--' : Number(m.spread).toFixed(2)) + ' · ' + m.session + ' · 今日 ' + chg;
  $('live-dot').className = 'dot' + (p.data.stale ? ' stale' : '');
}

function updateClock() {
  if (!S.p) return;
  const head = S.offline ? '离线 · 缓存快照\n' : '';
  $('clock').textContent = head + S.p.generated_local + ' MYT\n下次刷新 ' + Math.max(0, S.left) + 's';
}

function renderHero(p) {
  const v = p.verdict, m = p.market, s = p.setup;
  const conf = Math.round(v.confidence);
  const color = conf >= 78 ? '#0e9f6e' : conf >= 62 ? '#b07d12' : conf >= 45 ? '#d97706' : '#667085';
  const R = 52, C = 2 * Math.PI * R;
  const tags = [
    s.type ? '策略 ' + s.type : '',
    '状态 ' + (STATUS_CN[s.status] || s.status),
    'TP2 ' + Number(p.risk.rr || 0).toFixed(2) + 'R',
    'ATR ' + fmt2(m.atr) + ' (' + Number(m.atr_pct).toFixed(2) + '%)',
    p.bias ? '周期 ' + p.bias.counts.long + '多/' + p.bias.counts.short + '空' : '',
    p.bias ? '一致性 ' + Math.round((p.bias.alignment || 0) * 100) + '%' : '',
  ].filter(Boolean);
  const blockers = (v.blockers || []).map((b) => '<div class="blocker">⛔ ' + esc(b) + '</div>').join('');
  $('hero').innerHTML =
    '<div class="badge ' + actionClass(v.action) + '">' + esc(v.label) + '</div>' +
    '<div class="hero-mid">' +
      '<div class="summary">' + esc(v.summary) + '</div>' +
      '<div class="tags">' + tags.map((t) => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' +
      (blockers ? '<div class="blockers">' + blockers + '</div>' : '') +
    '</div>' +
    '<div class="gauge">' +
      '<div class="ring">' +
        '<svg width="112" height="112" viewBox="0 0 120 120">' +
          '<circle class="ring-bg" cx="60" cy="60" r="' + R + '"></circle>' +
          '<circle class="ring-fg" cx="60" cy="60" r="' + R + '" stroke="' + color + '" ' +
            'stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - conf / 100)) + '"></circle>' +
        '</svg>' +
        '<div class="num">' + conf + '</div>' +
      '</div>' +
      '<div class="gauge-label">信心 ' + conf + '/100 · ' + esc(v.grade) + '</div>' +
    '</div>';
}

function renderTfTabs(p) {
  const box = $('tf-tabs');
  if (!box) return;
  const keys = TF_ORDER.filter((k) => p.charts && p.charts[k]);
  if (keys.length && !p.charts[S.chartTf]) S.chartTf = keys.indexOf('1h') >= 0 ? '1h' : keys[0];
  box.innerHTML = keys.map((k) =>
    '<button class="tf-tab' + (k === S.chartTf ? ' active' : '') + '" data-tf="' + k + '">' + TF_LABEL[k] + '</button>'
  ).join('');
}

function shortStruct(s) {
  if (!s) return '-';
  if (s.indexOf('上升') >= 0) return 'HH+HL';
  if (s.indexOf('下降') >= 0) return 'LH+LL';
  if (s.indexOf('扩张') >= 0) return '扩张';
  if (s.indexOf('偏多') >= 0) return '偏多';
  if (s.indexOf('偏空') >= 0) return '偏空';
  return '区间';
}

function renderMtf(p) {
  const box = $('mtf');
  if (!box || !p.bias || !p.bias.rows) return;
  const rows = p.bias.rows;
  const c = p.bias.counts;
  const head = '多 ' + c.long + ' / 空 ' + c.short + ' / 中性 ' + c.neutral +
    ' · 一致性 ' + Math.round((p.bias.alignment || 0) * 100) + '% · 加权 ' +
    (p.bias.score >= 0 ? '+' : '') + p.bias.score.toFixed(2);
  const sum = $('mtf-summary');
  if (sum) sum.textContent = head;

  const body = rows.map((r) => {
    const dirCls = r.score >= 0.5 ? 'up' : r.score <= -0.5 ? 'down' : 'flat';
    return '<tr>' +
      '<td class="tf">' + r.tf + '</td>' +
      '<td class="dir ' + dirCls + '">' + (r.score >= 0 ? '+' : '') + r.score.toFixed(1) + ' <span>' + r.label + '</span></td>' +
      '<td class="st">' + shortStruct(r.structure) + '</td>' +
      '<td class="num">' + r.rsi.toFixed(0) + '</td>' +
      '<td class="num">' + r.adx.toFixed(0) + '</td>' +
      '<td class="num">' + r.atr.toFixed(1) + '</td>' +
      '<td class="num">' + (r.emaLen || '—') + '</td>' +
      '</tr>';
  }).join('');
  box.innerHTML =
    '<div class="mtf-wrap"><table class="mtf-table">' +
    '<thead><tr><th>周期</th><th>方向</th><th>结构</th><th>RSI</th><th>ADX</th><th>ATR</th><th>长均线</th></tr></thead>' +
    '<tbody>' + body + '</tbody></table></div>' +
    '<div class="mtf-legend">HH+HL 上升结构 · LH+LL 下降结构 · 扩张 高低点同时外扩/内收 · 长均线 为该周期可用的最长 EMA（不足 200 根时退回 100/50）</div>';
}

function sideCell(k, v) {
  return '<div><i>' + k + '</i><b>' + v + '</b></div>';
}

function sideCard(s) {
  if (!s) return '<div class="side empty">该方向暂无方案</div>';
  const st = s.status === 'READY' ? '可执行' : s.status === 'PENDING' ? '挂单等' : s.status === 'WAIT' ? '等待' : s.status;
  const tp = (i) => (s.targets[i] ? fmt2(s.targets[i].price) : '--');
  return '<div class="side ' + (s.dir === 1 ? 'buy' : 'sell') + (s.aligned ? ' aligned' : '') + '">' +
    '<div class="side-h">' +
      '<span class="side-t">' + (s.dir === 1 ? '做多 BUY' : '做空 SELL') + '</span>' +
      '<span class="tag ' + (s.aligned ? 'hot' : '') + '">' + (s.aligned ? '顺势' : '逆势') + '</span>' +
      '<span class="ord">' + (s.order === 'limit' ? '限价' : '市价') + ' · ' + st + '</span>' +
    '</div>' +
    '<div class="side-grid">' +
      sideCell('入场', fmt2(s.entry)) + sideCell('止损', fmt2(s.stop)) +
      sideCell('TP1', tp(0)) + sideCell('TP2', tp(1)) + sideCell('TP3', tp(2)) +
      sideCell('盈亏比', Number(s.rr || 0).toFixed(2) + 'R') +
    '</div>' +
    '<div class="side-foot">' + (s.size ? s.size.lots : '--') + ' 手 · MT5 ' + s.mt5type +
      ' · 备选 ' + String(s.alt.type).replace('_', ' ') + ' ' + fmt2(s.alt.price) + '</div>' +
    '<div class="side-note">' + esc(s.alt.note) + '</div>' +
    '</div>';
}

function renderSides(p) {
  const box = $('sides');
  if (!box || !p.sides) return;
  const parts = [];
  ['short', 'long'].forEach((k) => {
    const m = p.sides[k];
    if (!m) return;
    parts.push('<div class="sides-block"><div class="sides-title">' + m.label + ' · ' + m.tf +
      '<span>' + (m.buy && m.buy.aligned ? '偏多' : m.sell && m.sell.aligned ? '偏空' : '中性') + '</span></div>' +
      sideCard(m.buy) + sideCard(m.sell) + '</div>');
  });
  box.innerHTML = parts.join('');
  const sum = $('sides-summary');
  if (sum) {
    const bits = [];
    ['short', 'long'].forEach((k) => {
      const m = p.sides[k];
      if (!m) return;
      const side = m.buy && m.buy.aligned ? '做多' : m.sell && m.sell.aligned ? '做空' : '中性';
      bits.push(m.label + ' ' + m.tf + ' ' + side);
    });
    sum.textContent = bits.join(' · ');
  }
}

function renderPro(p) {
  const box = $('pro');
  if (!box || !p.pro) return;
  const rows = p.pro.items.map((it) => {
    const cls = it.dir === 1 ? 'up' : it.dir === -1 ? 'down' : 'flat';
    return '<div class="pro-row ' + cls + '">' +
      '<div class="pro-k">' + esc(it.title) + '<span>' + esc(it.key) + '</span></div>' +
      '<div class="pro-v">' + esc(it.value) + '</div>' +
      '<div class="pro-d">' + esc(it.detail) + '</div>' +
      '</div>';
  }).join('');
  const gl = p.pro.glossary.map((g) => '<div class="gl-row"><b>' + esc(g.t) + '</b><span>' + esc(g.d) + '</span></div>').join('');
  box.innerHTML = rows + '<details class="gloss"><summary>术语解释：BOS / CHoCH / OB / FVG / 溢价折价 / 流动性</summary>' + gl + '</details>';
  const sum = $('pro-summary');
  if (sum) sum.textContent = p.pro.summary + ' · H4 ' + p.pro.h4Trend;
}

function planRow(k, cls, val, sub) {
  return '<div class="plan-row"><div><div class="k">' + k + '</div>' +
    (sub ? '<div class="why">' + esc(sub) + '</div>' : '') + '</div>' +
    '<div class="v ' + cls + '">' + val + '</div></div>';
}

function renderPlan(p) {
  const s = p.setup, r = p.risk, m = p.market;
  const box = $('plan');
  if (!s.entry || !s.stop) {
    box.innerHTML = '<div class="empty-note">当前没有可执行的入场结构。<br><br>' + esc(s.trigger || '') + '</div>';
    return;
  }
  const zone = s.entry_zone ? '区间 ' + fmt2(s.entry_zone[0]) + ' – ' + fmt2(s.entry_zone[1]) : '';
  const order = s.order === 'limit' ? '限价' : '市价';
  let html = '';
  html += planRow('入场 · ' + order, 'entry', fmt2(s.entry), zone);
  html += planRow('止损', 'stop', fmt2(s.stop), s.stop_reason);
  (r.targets || []).forEach((t, i) => {
    html += planRow('TP' + (i + 1) + ' · 平 ' + t.close_pct + '%', 'tp',
      fmt2(t.price) + '<span class="v r">' + Number(t.r).toFixed(2) + 'R</span>', t.reason);
  });

  const z = r.size || {};
  html += '<div class="size-box">' +
    '<div><div class="k">手数</div><div class="v">' + (z.lots == null ? '--' : z.lots) + ' 手</div></div>' +
    '<div><div class="k">风险 / 账户</div><div class="v">$' + fmtN(z.actual_risk, 0) + ' / ' + fmtN(z.account, 0) + '</div></div>' +
    '<div><div class="k">名义价值</div><div class="v">$' + fmtN(z.notional, 0) + '</div></div>' +
    '<div><div class="k">盈亏比</div><div class="v">' + Number(r.rr).toFixed(2) + 'R</div></div>' +
    '</div>';
  if (z.warning) html += '<div class="warn">⚠ ' + esc(z.warning) + '</div>';
  if (p.mt5) {
    const m = p.mt5;
    const TYPE_CN = { BUY_LIMIT: 'Buy Limit 买入限价', SELL_LIMIT: 'Sell Limit 卖出限价', BUY: 'Buy 市价买入', SELL: 'Sell 市价卖出' };
    const line = m.type + ' ' + m.symbol + ' ' + Number(m.volume).toFixed(2) + ' @ ' + fmt2(m.price) +
      ' SL ' + fmt2(m.sl) + ' TP ' + fmt2(m.tp);
    const row = (k, v) => '<div><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
    html += '<div class="mt5">' +
      '<div class="mt5-head"><span>MT5 下单</span><em>' + esc(m.symbol) + '</em>' +
        '<button data-copy="mt5-line">复制参数</button></div>' +
      '<div class="mt5-grid">' +
        row('类型', esc(TYPE_CN[m.type] || m.type)) +
        row('手数', Number(m.volume).toFixed(2)) +
        row('价格', fmt2(m.price)) +
        row('止损', fmt2(m.sl)) +
        row('止盈 TP1', fmt2(m.tp)) +
        row('滑点', m.deviation + ' 点') +
      '</div>' +
      '<div class="mt5-line" id="mt5-line">' + esc(line) + '</div>' +
      '<ol class="mt5-steps">' + (m.steps || []).map((s) => '<li>' + esc(s) + '</li>').join('') + '</ol>' +
      '</div>';
  }
  if (s.trigger_note) html += '<div class="warn">触发确认：' + esc(s.trigger_note) + '</div>';
  box.innerHTML = html;
}

function renderEvidence(p) {
  const rows = p.evidence || [];
  let total = 0;
  const body = rows.map((e) => {
    total += e.points;
    const w = Math.max(0, Math.min(100, (e.points / e.max) * 100));
    return '<tr>' +
