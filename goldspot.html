<style>
:root {
  --bg: #f2f4f7;
  --panel: #ffffff;
  --panel-2: #f8fafc;
  --line: #e4e7ec;
  --text: #101828;
  --muted: #667085;
  --gold: #b07d12;
  --gold-soft: rgba(176,125,18,.12);
  --green: #0e9f6e;
  --red: #e5484d;
  --amber: #d97706;
  --blue: #2563eb;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: radial-gradient(1200px 600px at 80% -10%, #ffffff 0%, var(--bg) 55%) fixed;
  color: var(--text);
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 14px;
}

body { min-height: 100vh; padding-bottom: 40px; }

.top {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 16px 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,.9);
  backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 20;
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { margin: 0; font-size: 18px; letter-spacing: .14em; font-weight: 700; }
.brand p { margin: 2px 0 0; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
.dot.stale { background: var(--amber); box-shadow: 0 0 12px var(--amber); }
.dot.down { background: var(--red); box-shadow: 0 0 12px var(--red); }

.quote { display: flex; flex-direction: column; }
.price { font-family: var(--mono); font-size: 30px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
.price.up { color: var(--green); }
.price.down { color: var(--red); }
.quote .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; font-family: var(--mono); }

.toolbar { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.clock { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-align: right; line-height: 1.5; }
button {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 14px; font-size: 12.5px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
button:hover { border-color: var(--gold); background: #f2f4f7; }
button.primary { border-color: rgba(176,125,18,.45); color: var(--gold); }

main { max-width: 1500px; margin: 0 auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

.card {
  background: linear-gradient(180deg, var(--panel) 0%, #ffffff 100%);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  display: flex; flex-direction: column;
}
.card-head {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.card-head h2 { margin: 0; font-size: 13px; letter-spacing: .06em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.card-body { padding: 14px 16px; }

/* verdict */
.hero { display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; padding: 18px 22px; }
.badge {
  font-size: 22px; font-weight: 800; letter-spacing: .04em; padding: 12px 22px; border-radius: 12px;
  border: 1px solid; white-space: nowrap;
}
.badge.buy { color: var(--green); border-color: rgba(14,159,110,.45); background: rgba(14,159,110,.08); }
.badge.sell { color: var(--red); border-color: rgba(229,72,77,.4); background: rgba(229,72,77,.08); }
.badge.limit { color: var(--amber); border-color: rgba(217,119,6,.45); background: rgba(217,119,6,.08); }
.badge.wait { color: var(--muted); border-color: var(--line); background: rgba(102,112,133,.06); }

.hero-mid .summary { font-size: 13.5px; line-height: 1.65; color: #1d2939; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tag {
  font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); font-family: var(--mono);
}
.tag.hot { color: var(--gold); border-color: rgba(176,125,18,.4); }
.blockers { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.blocker { font-size: 12px; color: var(--amber); }
.gauge { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.gauge .ring { position: relative; width: 112px; height: 112px; }
.gauge svg { display: block; transform: rotate(-90deg); }
.gauge .num {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 32px; font-weight: 700; letter-spacing: -.03em;
}
.gauge .ring-bg { fill: none; stroke: #eaecf0; stroke-width: 9; }
.gauge .ring-fg { fill: none; stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .6s; }
.gauge-label { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* layout */
.row { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.9fr) minmax(320px, 1fr); }
.row-secondary { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); }
@media (max-width: 1080px) {
  .row, .row-secondary { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; }
  .gauge { flex-direction: row; gap: 12px; }
}

/* chart */
.canvas-wrap { position: relative; flex: 1 1 auto; min-height: 380px; padding: 6px 4px 0; }
canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
.tip {
  position: absolute; pointer-events: none; display: none; z-index: 5;
  background: rgba(255,255,255,.98); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 10px; font-family: var(--mono); font-size: 11px; line-height: 1.55;
  color: #1d2939; box-shadow: 0 10px 24px rgba(16,24,40,.12); white-space: pre;
}
.legend { margin-left: auto; display: flex; gap: 14px; font-size: 11px; color: var(--muted); font-family: var(--mono); }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }

/* plan */
.plan-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px dashed #e4e7ec; }
.plan-row:last-child { border-bottom: none; }
.plan-row .k { color: var(--muted); font-size: 12px; }
.plan-row .v { font-family: var(--mono); font-size: 16px; font-weight: 600; }
.plan-row .why { font-size: 11px; color: #8a94a6; margin-top: 2px; text-align: right; max-width: 62%; }
.v.entry { color: var(--blue); }
.v.stop { color: var(--red); }
.v.tp { color: var(--green); }
.v.r { font-size: 11.5px; color: var(--muted); margin-left: 6px; }
.empty-note { color: var(--muted); font-size: 12.5px; line-height: 1.6; }

.ticket {
  margin-top: 12px; background: #f5f7fb; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; color: #344054;
  display: flex; gap: 10px; align-items: center;
}
.ticket code { flex: 1; overflow-wrap: anywhere; word-break: normal; line-height: 1.5; }
.ticket button { padding: 5px 9px; font-size: 11px; }

.size-box { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.size-box div { background: #f9fafb; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.size-box .k { font-size: 10.5px; color: var(--muted); letter-spacing: .04em; }
.size-box .v { font-family: var(--mono); font-size: 13px; margin-top: 2px; }
.warn { margin-top: 10px; font-size: 11.5px; color: var(--amber); line-height: 1.5; }

/* evidence */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 10.5px; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 0 8px 8px; text-transform: uppercase; }
td { padding: 8px; border-top: 1px solid #eaecf0; font-size: 12.5px; vertical-align: top; }
td.grp { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
td.item { white-space: nowrap; font-weight: 600; }
td.detail { color: #667085; font-size: 11.5px; line-height: 1.5; }
td.score { text-align: right; font-family: var(--mono); white-space: nowrap; }
.mark { display: inline-block; width: 15px; text-align: center; margin-right: 4px; font-weight: 700; }
.mark.ok { color: var(--green); }
.mark.no { color: #98a2b3; }
.bar { height: 3px; background: #eaecf0; border-radius: 2px; margin-top: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #f0d9a8, var(--gold)); }

/* levels */
.lv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.lv-col h3 { margin: 6px 0 8px; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.lv-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 8px; background: #f9fafb; border: 1px solid var(--line); margin-bottom: 6px; font-family: var(--mono); font-size: 12px; }
.lv-row.res { border-left: 3px solid rgba(229,72,77,.65); }
.lv-row.sup { border-left: 3px solid rgba(14,159,110,.65); }
.lv-row .meta { color: var(--muted); font-size: 10.5px; font-family: "Segoe UI", sans-serif; }
.mini { font-size: 11.5px; color: var(--muted); line-height: 1.7; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip {
  font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 6px;
  background: #f9fafb; border: 1px solid var(--line); color: #475467;
}
.chip.res { border-color: rgba(229,72,77,.3); color: #c0262c; }
.chip.sup { border-color: rgba(14,159,110,.3); color: #087f5b; }
ul.clean { margin: 0; padding-left: 16px; color: #344054; font-size: 12.5px; line-height: 1.75; }
ul.clean li { margin-bottom: 5px; }
.scen { display: flex; flex-direction: column; gap: 7px; font-size: 12px; line-height: 1.55; color: #344054; }
.scen b { color: var(--text); font-weight: 600; }

footer { max-width: 1500px; margin: 6px auto 0; padding: 0 24px; color: #7c8798; font-size: 11px; line-height: 1.7; }
footer .src { font-family: var(--mono); }
.err { background: rgba(229,72,77,.08); border: 1px solid rgba(229,72,77,.35); color: #b42318; padding: 12px 16px; border-radius: 10px; font-size: 12.5px; }
.hidden { display: none !important; }

/* ---------------------------------------------------------------- mobile */
html { -webkit-text-size-adjust: 100%; }
.clock { white-space: pre-line; }
body { overscroll-behavior-y: contain; }

@media (max-width: 760px) {
  body { padding-bottom: calc(26px + env(safe-area-inset-bottom)); }
  .top { padding: calc(10px + env(safe-area-inset-top)) 14px 10px; gap: 6px 14px; }
  .brand { gap: 9px; }
  .brand h1 { font-size: 15px; letter-spacing: .1em; }
  .brand p { font-size: 9.5px; }
  .price { font-size: 25px; }
  .quote .sub { font-size: 10px; }
  .toolbar { gap: 8px; }
  .clock { font-size: 9.5px; }
  button { padding: 7px 11px; font-size: 12px; }
  main { padding: 12px; gap: 12px; }
  .hero { grid-template-columns: 1fr; gap: 12px; padding: 14px; }
  .badge { font-size: 19px; padding: 9px 15px; justify-self: start; }
  .hero-mid .summary { font-size: 12.5px; line-height: 1.62; }
  .gauge { flex-direction: row; align-items: center; gap: 12px; }
  .gauge .ring, .gauge svg { width: 82px; height: 82px; }
  .gauge .num { font-size: 23px; }
  .canvas-wrap { min-height: 300px; }
  .legend { display: none; }
  .card-head { padding: 10px 13px; }
  .card-head h2 { font-size: 11.5px; }
  .card-body { padding: 12px 13px; }
  .plan-row .v { font-size: 15px; }
  .plan-row .why { max-width: 55%; font-size: 10.5px; line-height: 1.45; }
  .size-box { gap: 6px; }
  .size-box .v { font-size: 12px; }
  .size-box .k { font-size: 9.5px; }
  .ticket { font-size: 10.5px; padding: 8px 10px; }
  .lv-grid { grid-template-columns: 1fr; gap: 10px; }
  .lv-row { padding: 6px 8px; font-size: 11px; }
  .lv-row .meta { font-size: 9.5px; }
  .scen { font-size: 11.5px; }
  ul.clean { font-size: 12px; }
  #evidence table, #evidence thead, #evidence tbody, #evidence tr, #evidence td { display: block; }
  #evidence thead { display: none; }
  #evidence tr { position: relative; padding: 8px 62px 8px 0; border-top: 1px solid #eaecf0; }
  #evidence tr:first-child { border-top: none; }
  #evidence td { border: none; padding: 1px 0; }
  #evidence td.grp { display: inline; font-size: 10.5px; }
  #evidence td.item { display: inline; font-size: 12px; margin-left: 6px; }
  #evidence td.detail { font-size: 11px; margin-top: 3px; color: #667085; }
  #evidence td.score { position: absolute; top: 7px; right: 0; font-size: 11px; }
  footer { padding: 0 14px; font-size: 10px; }
}

/* MT5 order ticket */
.mt5 { margin-top: 14px; border: 1px solid rgba(176,125,18,.3); background: rgba(176,125,18,.05); border-radius: 10px; padding: 12px; }
.mt5-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.mt5-head span { font-size: 12px; font-weight: 700; color: var(--gold); letter-spacing: .04em; }
.mt5-head em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.mt5-head button { margin-left: auto; padding: 4px 9px; font-size: 11px; }
.mt5-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.mt5-grid .k { font-size: 10px; color: var(--muted); }
.mt5-grid .v { font-family: var(--mono); font-size: 12.5px; color: #101828; }
.mt5-line { margin-top: 10px; padding: 7px 9px; border-radius: 7px; background: #f5f7fb; border: 1px solid var(--line);
  font-family: var(--mono); font-size: 10.5px; color: #344054; overflow-wrap: anywhere; }
.mt5-steps { margin: 10px 0 0; padding-left: 16px; color: #667085; font-size: 11px; line-height: 1.6; }
.mt5-steps li { margin-bottom: 3px; }

/* add-to-home-screen hint (iOS Safari) */
.hint {
  display: flex; align-items: center; gap: 10px;
  background: rgba(176,125,18,.08); border: 1px solid rgba(176,125,18,.35);
  color: #7a5a12; border-radius: 10px; padding: 9px 12px; font-size: 12px; line-height: 1.5;
}
.hint b { color: var(--gold); font-weight: 600; }
.hint button {
  margin-left: auto; background: transparent; border: none; color: #8a6d2f;
  font-size: 18px; line-height: 1; padding: 2px 6px; cursor: pointer;
}

/* settings panel */
.settings {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
.settings label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
.settings input {
  background: #f5f7fb; border: 1px solid var(--line); border-radius: 8px; color: var(--text);
  padding: 8px 10px; font-family: var(--mono); font-size: 13px; width: 100%;
}
.settings-actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
.settings-actions .mini { flex: 1; }
.settings-actions button { white-space: nowrap; }

/* timeframe tabs */
.tf-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px 0; scrollbar-width: none; }
.tf-tabs::-webkit-scrollbar { display: none; }
.tf-tab {
  flex: 0 0 auto; padding: 6px 9px; font-size: 11px; font-family: var(--mono);
  background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px;
}
.tf-tab.active { color: #f2f4f7; background: var(--gold); border-color: var(--gold); font-weight: 700; }

/* multi-timeframe matrix */
.mtf-wrap { overflow-x: auto; }
.mtf-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.mtf-table th {
  text-align: left; font-size: 9px; letter-spacing: .04em; color: var(--muted);
  font-weight: 600; padding: 0 4px 6px; text-transform: uppercase; white-space: nowrap;
}
.mtf-table td { padding: 6px 4px; border-top: 1px solid #eaecf0; white-space: nowrap; }
.mtf-table td.tf { font-family: var(--mono); font-weight: 700; color: #1d2939; }
.mtf-table td.dir { font-family: var(--mono); }
.mtf-table td.dir span { font-family: "Segoe UI", sans-serif; font-size: 10px; margin-left: 2px; }
.mtf-table td.dir.up { color: var(--green); }
.mtf-table td.dir.down { color: var(--red); }
.mtf-table td.dir.flat { color: var(--muted); }
.mtf-table td.st { color: #667085; font-size: 11.5px; }
.mtf-table td.num { text-align: right; font-family: var(--mono); color: #344054; }


.mtf-legend { margin-top: 9px; font-size: 10.5px; line-height: 1.6; color: #7c8798; }

/* two-sided plans */
.sides-block { margin-bottom: 16px; }
.sides-block:last-child { margin-bottom: 0; }
.sides-title {
  font-size: 12px; font-weight: 700; color: var(--gold); letter-spacing: .04em;
  margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
}
.sides-title span { font-weight: 400; color: var(--muted); font-size: 11px; }
.side {
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  background: #f9fafb;
}
.side.buy { border-left: 3px solid rgba(14,159,110,.75); }
.side.sell { border-left: 3px solid rgba(229,72,77,.75); }
.side.aligned { background: #f0f6ff; }
.side.empty { color: var(--muted); font-size: 12px; }
.side-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.side-t { font-size: 13px; font-weight: 700; }
.side.buy .side-t { color: var(--green); }
.side.sell .side-t { color: var(--red); }
.side-h .ord { margin-left: auto; font-size: 10.5px; color: var(--muted); font-family: var(--mono); }
.side-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 8px; }
.side-grid i { font-style: normal; display: block; font-size: 9.5px; color: var(--muted); }
.side-grid b { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
.side-foot { margin-top: 8px; font-size: 10.5px; color: #667085; font-family: var(--mono); }
.side-note { margin-top: 3px; font-size: 10.5px; color: #8a94a6; }

/* chart pan / zoom */
canvas { touch-action: none; }
.chart-reset {
  position: absolute; right: 10px; top: 8px; z-index: 6;
  padding: 4px 10px; font-size: 11px; border-radius: 6px;
  background: #fff; border: 1px solid var(--line); color: var(--text);
  box-shadow: 0 2px 6px rgba(16,24,40,.1);
}
.chart-hint { padding: 0 14px 10px; font-size: 10.5px; color: var(--muted); }

/* chart toolbar */
.chart-bar { display: flex; align-items: center; gap: 8px; padding: 6px 14px 0; }
.chip-btn {
  padding: 4px 10px; font-size: 11px; border-radius: 6px;
  background: #fff; border: 1px solid var(--line); color: var(--text);
}
.chip-btn:disabled { opacity: .4; }
.chart-bar .mini { margin-left: auto; font-family: var(--mono); }

/* pro analysis */
.pro-row { padding: 10px 0; border-top: 1px solid #eaecf0; }
.pro-row:first-child { border-top: none; }
.pro-k { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.pro-k span { font-size: 9.5px; color: #98a2b3; font-family: var(--mono); border: 1px solid #eaecf0; padding: 1px 5px; border-radius: 4px; }
.pro-v { font-size: 13px; font-weight: 700; margin-top: 3px; }
.pro-row.up .pro-v { color: var(--green); }
.pro-row.down .pro-v { color: var(--red); }
.pro-row.flat .pro-v { color: var(--muted); }
.pro-d { font-size: 11px; color: #667085; line-height: 1.55; margin-top: 3px; }
.gloss { margin-top: 12px; border-top: 1px dashed #eaecf0; padding-top: 10px; }
.gloss summary { font-size: 11.5px; color: var(--gold); cursor: pointer; }
.gl-row { display: flex; gap: 8px; margin-top: 7px; font-size: 11px; line-height: 1.55; }
.gl-row b { flex: 0 0 68px; color: #344054; font-weight: 600; }
.gl-row span { color: #667085; }

.lang-btn { padding: 6px 10px; font-size: 11px; font-family: var(--mono); }

.settings label span { display: block; }
.chart-bar .chip-btn { white-space: nowrap; }

/* settings: keep the select from squeezing its grid column */
.settings label, .settings select, .settings input { min-width: 0; }
.settings select {
  width: 100%; background: #f5f7fb; border: 1px solid var(--line); border-radius: 8px;
  color: var(--text); padding: 8px 10px; font-size: 12.5px;
}

/* macro & news */
.macro-quotes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.macro-q { background: #f9fafb; border: 1px solid #eaecf0; border-radius: 8px; padding: 8px 10px; display: flex; align-items: baseline; gap: 6px; }
.macro-q span { font-size: 10.5px; color: #667085; }
.macro-q b { font-family: var(--mono); font-size: 15px; }
.macro-q i { font-style: normal; font-size: 10.5px; font-family: var(--mono); }
.macro-q i.up { color: var(--green); }
.macro-q i.down { color: var(--red); }
.macro-risk { background: rgba(217,119,6,.08); border: 1px solid rgba(217,119,6,.35); color: #92400e; border-radius: 8px; padding: 8px 10px; font-size: 11.5px; margin-bottom: 8px; }
.macro-ev { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; border-top: 1px solid #f2f4f7; }
.macro-ev:first-of-type { border-top: none; }
.macro-ev .imp { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px; background: #98a2b3; margin-top: 5px; }
.macro-ev.high .imp { background: var(--red); }
.macro-ev .tm { font-family: var(--mono); font-size: 11px; color: #667085; flex: 0 0 34px; }
.macro-ev .nm { flex: 1; font-size: 12px; color: #1d2939; }
.macro-ev .nm em { font-style: normal; font-size: 9px; color: #98a2b3; margin-left: 5px; border: 1px solid #eaecf0; border-radius: 3px; padding: 0 3px; }
.macro-ev .fc { display: block; font-size: 10px; color: #98a2b3; margin-top: 1px; }
.macro-ev .cd { font-size: 10px; color: #667085; font-family: var(--mono); flex: 0 0 auto; }

/* trade journal */
.log-btn { margin-top: 10px; width: 100%; padding: 8px; border-color: rgba(176,125,18,.5); color: #8a6d2f; }
.j-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 8px; }
.j-stats i { display: block; font-style: normal; font-size: 9.5px; color: #98a2b3; }
.j-stats b { font-family: var(--mono); font-size: 14px; }
.j-periods { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 10.5px; color: #667085; }
.j-periods b { font-family: var(--mono); font-size: 12px; }
.j-periods .muted { margin-left: auto; color: #98a2b3; }
.j-title { margin-top: 12px; font-size: 10.5px; color: #98a2b3; letter-spacing: .04em; }
.j-row { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px solid #f2f4f7; font-size: 11.5px; }
.j-row .d { font-family: var(--mono); font-size: 10px; font-weight: 700; width: 34px; }
.j-row .d.up { color: var(--green); } .j-row .d.down { color: var(--red); }
.j-row .m { flex: 1; color: #475467; font-family: var(--mono); font-size: 10.5px; }
.j-row .r { font-family: var(--mono); font-weight: 700; font-size: 11.5px; }
.j-row .r em { font-style: normal; font-size: 9.5px; color: #98a2b3; margin-left: 3px; }
.j-row .r.up { color: var(--green); } .j-row .r.down { color: var(--red); }
.j-exit { width: 64px; padding: 3px 5px; font-size: 11px; border: 1px solid #eaecf0; border-radius: 5px; }
.j-actions { display: flex; gap: 8px; margin-top: 12px; }
.j-actions .chip-btn { flex: 1; }
.j-warn { margin-top: 8px; padding: 7px 9px; border-radius: 7px; background: rgba(229,72,77,.07); border: 1px solid rgba(229,72,77,.3); color: #b42318; font-size: 11px; }

/* data status strip + disclaimer */
.status-strip {
  font-size: 10.5px; padding: 6px 16px; letter-spacing: .01em;
  border-bottom: 1px solid #eaecf0; background: #f9fafb; color: #475467;
  font-family: var(--mono); white-space: normal; line-height: 1.5;
}
.status-strip.ok { color: #067647; background: #f0fdf9; border-bottom-color: #d1fadf; }

      if (i < n - 1) { up.push(NaN); mid.push(NaN); dn.push(NaN); continue; }
      const win = c.slice(i - n + 1, i + 1);
      const m = win.reduce((a, b) => a + b, 0) / n;
      const sd = Math.sqrt(win.reduce((a, b) => a + (b - m) * (b - m), 0) / n);
      mid.push(m); up.push(m + k * sd); dn.push(m - k * sd);
    }
    return { up, mid, dn };
  }

  function addIndicators(bars) {
    const c = bars.map((b) => b.c), v = bars.map((b) => b.v || 0);
    const e20 = ema(c, 20), e50 = ema(c, 50), e100 = ema(c, 100), e200 = ema(c, 200);
    const atr = atrArr(bars, 14);
    const rsi = rsiArr(c, 14);
    const macd = macdArr(c);
    const adx = adxArr(bars, 14);
    const bb = bollinger(c, 20, 2);
    const relVol = v.map((x, i) => {
      if (i < 19) return 1;
      const avg = v.slice(i - 19, i + 1).reduce((a, b) => a + b, 0) / 20;
      return avg > 0 ? x / avg : 1;
    });
    return bars.map((b, i) => ({
      t: b.t, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v,
      ema20: e20[i], ema50: e50[i], ema100: e100[i], ema200: e200[i], atr: atr[i], rsi: rsi[i],
      adx: adx.adx[i], diPlus: adx.plus[i], diMinus: adx.minus[i],
      macdHist: macd.hist[i], bbUp: bb.up[i], bbMid: bb.mid[i], bbDn: bb.dn[i],
      relVol: relVol[i],
    }));
  }

  /* ------------------------------------------------------------------ structure */
  function findSwings(bars, k) {
    k = k || 2;
    const out = [];
    for (let i = k; i < bars.length - k; i++) {
      let hi = -Infinity, lo = Infinity;
      for (let j = i - k; j <= i + k; j++) {
        if (bars[j].h > hi) hi = bars[j].h;
        if (bars[j].l < lo) lo = bars[j].l;
      }
      if (bars[i].h === hi && bars[i].h > bars[i - 1].h && bars[i].h >= bars[i + 1].h) {
        out.push({ i, price: bars[i].h, kind: 'H', t: bars[i].t });
      } else if (bars[i].l === lo && bars[i].l < bars[i - 1].l && bars[i].l <= bars[i + 1].l) {
        out.push({ i, price: bars[i].l, kind: 'L', t: bars[i].t });
      }
    }
    return out;
  }
  function cleanSwings(swings) {
    const out = [];
    swings.forEach((s) => {
      if (out.length && out[out.length - 1].kind === s.kind) {
        const keep = s.kind === 'H' ? s.price > out[out.length - 1].price : s.price < out[out.length - 1].price;
        if (keep) out[out.length - 1] = s;
      } else out.push(s);
    });
    return out;
  }
  function structureState(swings) {
    const s = swings.slice(-6);
    const highs = s.filter((x) => x.kind === 'H');
    const lows = s.filter((x) => x.kind === 'L');
    const detail = [];
    let hh = 0, hl = 0, lh = 0, ll = 0;
    if (highs.length >= 2) {
      if (highs[highs.length - 1].price > highs[highs.length - 2].price) {
        hh = 1; detail.push('高点抬高 HH ' + fmtPrice(highs[highs.length - 2].price) + ' → ' + fmtPrice(highs[highs.length - 1].price));
      } else {
        lh = 1; detail.push('高点降低 LH ' + fmtPrice(highs[highs.length - 2].price) + ' → ' + fmtPrice(highs[highs.length - 1].price));
      }
    }
    if (lows.length >= 2) {
      if (lows[lows.length - 1].price > lows[lows.length - 2].price) {
        hl = 1; detail.push('低点抬高 HL ' + fmtPrice(lows[lows.length - 2].price) + ' → ' + fmtPrice(lows[lows.length - 1].price));
      } else {
        ll = 1; detail.push('低点降低 LL ' + fmtPrice(lows[lows.length - 2].price) + ' → ' + fmtPrice(lows[lows.length - 1].price));
      }
    }
    let trend, label;
    if (hh && hl) { trend = 1; label = '上升结构 (HH + HL)'; }
    else if (lh && ll) { trend = -1; label = '下降结构 (LH + LL)'; }
    else if ((hh && ll) || (lh && hl)) { trend = 0; label = '扩张结构 (高低点同时外扩/内收)'; }
    else if (hh || hl) { trend = 0.5; label = '偏多但结构不完整'; }
    else if (lh || ll) { trend = -0.5; label = '偏空但结构不完整'; }
    else { trend = 0; label = '区间 / 数据不足'; }
    return {
      trend, label,
      detail: detail.length ? label + '：' + detail.join('；') : label,
      lastHigh: highs.length ? highs[highs.length - 1] : null,
      lastLow: lows.length ? lows[lows.length - 1] : null,
    };
  }
  function zigzag(swings, atr, minAtr) {
    minAtr = minAtr || 1;
    if (swings.length < 2 || !(atr > 0)) return [];
    const pivots = [swings[0]];
    for (let i = 1; i < swings.length; i++) {
      const s = swings[i], last = pivots[pivots.length - 1];
      if (s.kind === last.kind) {
        const more = s.kind === 'H' ? s.price > last.price : s.price < last.price;
        if (more) pivots[pivots.length - 1] = s;
        continue;
      }
      if (Math.abs(s.price - last.price) >= minAtr * atr) pivots.push(s);
    }
    const legs = [];
    for (let i = 0; i + 1 < pivots.length; i++) {
      const a = pivots[i], b = pivots[i + 1];
      legs.push({
        fromI: a.i, toI: b.i, from: a.price, to: b.price,
        dir: b.price > a.price ? 1 : -1,
        size: Math.abs(b.price - a.price),
        sizeAtr: Math.abs(b.price - a.price) / atr,
      });
    }
    return legs;
  }
  function fibLevels(leg) {
    const rng = leg.to - leg.from;
    return FIB_RATIOS.map((r) => ({ ratio: r, price: leg.to - rng * r, dir: leg.dir }));
  }
  function buildZones(swings, atr, bars, lookback, tolAtr, maxZones) {
    lookback = lookback || 240; tolAtr = tolAtr || 0.35; maxZones = maxZones || 8;
    const lastI = bars.length - 1;
    const recent = swings.filter((s) => s.i >= lastI - lookback);
    if (!recent.length || !(atr > 0)) return [];
    const tol = tolAtr * atr;
    const ordered = recent.slice().sort((a, b) => a.price - b.price);
    const clusters = [];
    ordered.forEach((s) => {
      const last = clusters[clusters.length - 1];
      if (last && s.price - last[last.length - 1].price <= tol) last.push(s);
      else clusters.push([s]);
    });
    let zones = clusters.map((cl) => {
      const prices = cl.map((x) => x.price);
      const lo = Math.min.apply(null, prices), hi = Math.max.apply(null, prices);
      let last = cl[0];
      cl.forEach((x) => { if (x.i > last.i) last = x; });
      return { lo, hi, mid: (lo + hi) / 2, touches: cl.length, lastI: last.i, lastT: bars[last.i].t, kinds: cl.map((x) => x.kind) };
    });
    const merged = [];
    zones.sort((a, b) => a.mid - b.mid).forEach((z) => {
      const m = merged[merged.length - 1];
      if (m && z.lo <= m.hi + tol * 0.5) {
        m.hi = Math.max(m.hi, z.hi); m.lo = Math.min(m.lo, z.lo);
        m.mid = (m.lo + m.hi) / 2; m.touches += z.touches;
        m.lastI = Math.max(m.lastI, z.lastI);
      } else merged.push(Object.assign({}, z));
    });
    merged.forEach((z) => {
      const recency = 1 - Math.min(1, (lastI - z.lastI) / Math.max(lookback, 1));
      z.strength = r1(Math.min(10, z.touches * 1.6 + recency * 3));
      z.width = z.hi - z.lo;
    });
    merged.sort((a, b) => b.strength - a.strength);
    return merged.slice(0, maxZones);
  }
  function nearestZones(price, zones, atr, count) {
    count = count || 4;
    const below = zones.filter((z) => z.hi < price).sort((a, b) => (price - a.hi) - (price - b.hi));
    const above = zones.filter((z) => z.lo > price).sort((a, b) => (a.lo - price) - (b.lo - price));
    const inside = zones.filter((z) => z.lo <= price && price <= z.hi);
    return {
      support: below.slice(0, count), resistance: above.slice(0, count), inside,
      distSupportAtr: below.length && atr ? (price - below[0].hi) / atr : null,
      distResistanceAtr: above.length && atr ? (above[0].lo - price) / atr : null,
    };
  }
  function candlePatterns(bars, atr, lookback) {
    lookback = lookback || 3;
    const out = [];
    const n = bars.length;
    for (let i = Math.max(1, n - lookback); i < n; i++) {
      const b = bars[i], p = bars[i - 1];
      const body = Math.abs(b.c - b.o), rng = b.h - b.l;
      if (rng <= 0) continue;
      const upper = b.h - Math.max(b.o, b.c), lower = Math.min(b.o, b.c) - b.l;
      const prevBody = Math.abs(p.c - p.o);
      const bull = b.c > b.o;
      if (bull && p.c < p.o && b.c >= p.o && b.o <= p.c && body > prevBody) {
        out.push({ i, name: '看涨吞没', dir: 1, detail: '实体 ' + r2(body) + ' 覆盖前一根 ' + r2(prevBody) });
      }
      if (!bull && p.c > p.o && b.c <= p.o && b.o >= p.c && body > prevBody) {
        out.push({ i, name: '看跌吞没', dir: -1, detail: '实体 ' + r2(body) + ' 覆盖前一根 ' + r2(prevBody) });
      }
      if (lower >= 2 * body && lower / rng >= 0.55 && b.c >= b.l + 0.6 * rng) {
        out.push({ i, name: '下影拒绝 (Pin)', dir: 1, detail: '下影 ' + r2(lower) + ' = 实体 ' + r2(body) + ' 的 ' + (lower / Math.max(body, 1e-9)).toFixed(1) + ' 倍' });
      }
      if (upper >= 2 * body && upper / rng >= 0.55 && b.c <= b.h - 0.6 * rng) {
        out.push({ i, name: '上影拒绝 (Pin)', dir: -1, detail: '上影 ' + r2(upper) + ' = 实体 ' + r2(body) + ' 的 ' + (upper / Math.max(body, 1e-9)).toFixed(1) + ' 倍' });
      }
      if (b.h <= p.h && b.l >= p.l) out.push({ i, name: '内包线 (Inside)', dir: 0, detail: '区间 ' + r2(b.l) + '-' + r2(b.h) + ' 位于前一根 ' + r2(p.l) + '-' + r2(p.h) + ' 内' });
      if (body / rng < 0.12 && rng > 0.6 * atr) out.push({ i, name: '十字星 (Doji)', dir: 0, detail: '实体仅占区间 ' + Math.round((body / rng) * 100) + '%' });
    }
    return out;
  }
  function roundLevels(price, atr, spanAtr, step) {
    spanAtr = spanAtr || 4; step = step || 10;
    if (!(atr > 0)) return [];
    const lo = price - spanAtr * atr, hi = price + spanAtr * atr;
    const out = [];
    let v = Math.ceil(lo / step) * step;
    while (v <= hi) { if (Math.abs(v - price) > 1e-9) out.push(v); v += step; }
    return out;
  }
  function liquidityPools(swings, atr, tolAtr) {
    tolAtr = tolAtr || 0.15;
    const out = [];
    ['H', 'L'].forEach((kind) => {
      const pts = swings.filter((s) => s.kind === kind).slice(-6);
      for (let i = 0; i + 1 < pts.length; i++) {
        const a = pts[i], b = pts[i + 1];
        if (Math.abs(a.price - b.price) <= tolAtr * atr && b.i - a.i > 3) {
          out.push({ kind, price: (a.price + b.price) / 2, detail: (kind === 'H' ? '等高' : '等低') + ' ' + fmtPrice(a.price) + ' / ' + fmtPrice(b.price) });
        }
      }
    });
    return out;
  }

  /* ------------------------------------------------------------------ context */
  function tfContext(rawBars, label) {
    const bars = addIndicators(rawBars);
    if (bars.length < 60) throw new Error(label + ' 数据不足 (' + bars.length + ' 根)');
    const last = bars[bars.length - 1];
    let atr = last.atr;
    if (!isFinite(atr) || atr <= 0) {
      const tail = bars.slice(-20);
      atr = tail.reduce((a, b) => a + (b.h - b.l), 0) / tail.length;
    }
    const swings = cleanSwings(findSwings(bars, 2));
    const state = structureState(swings);
    const price = last.c;
    // use the longest EMA the sample supports, so MN/W1 still get a trend read
    const emaLen = bars.length >= 200 ? 200 : bars.length >= 100 ? 100 : 50;
    const emaLong = emaLen === 200 ? last.ema200 : emaLen === 100 ? last.ema100 : last.ema50;
    const sEma = last.ema20 > last.ema50 + 0.05 * atr ? 1 : last.ema20 < last.ema50 - 0.05 * atr ? -1 : 0;
    const sPx = price > emaLong + 0.1 * atr ? 1 : price < emaLong - 0.1 * atr ? -1 : 0;
    const score = r2(sEma + sPx + state.trend);
    let labelTxt;
    if (score >= 1.5) labelTxt = '强多头';
    else if (score >= 0.5) labelTxt = '偏多';
    else if (score <= -1.5) labelTxt = '强空头';
    else if (score <= -0.5) labelTxt = '偏空';
    else labelTxt = '中性';
    return {
      tf: label, bars, price, atr,
      ema20: last.ema20, ema50: last.ema50, ema200: emaLong, emaLen, ema200Ok: emaLen === 200,
      rsi: last.rsi, adx: last.adx, diPlus: last.diPlus, diMinus: last.diMinus,
      macdHist: last.macdHist, relVol: isFinite(last.relVol) ? last.relVol : 1,
      swings, state, score, label: labelTxt, detail: state.detail,
      t: last.t, barsCount: bars.length,
    };
  }

  function consensus(ctx) {
    let total = 0, used = 0;
    const rows = [];
    let longs = 0, shorts = 0, neutral = 0;
    TF_LIST.forEach(({ key, label, weight }) => {
      const c = ctx[key];
      if (!c) return;
      total += c.score * weight; used += weight;
      if (c.score >= 0.5) longs++; else if (c.score <= -0.5) shorts++; else neutral++;
      rows.push({
        tf: label, key, score: c.score, label: c.label,
        structure: c.state.label, detail: c.detail,
        rsi: r1(c.rsi), adx: r1(c.adx), atr: r2(c.atr), atrPct: r2((c.atr / c.price) * 100),
        bars: c.barsCount, emaOk: c.ema200Ok, emaLen: c.emaLen,
        ema20: r2(c.ema20), ema50: r2(c.ema50), ema200: r2(c.ema200),
        macdHist: r2(c.macdHist), price: r2(c.price), t: c.t,
      });
    });
    const score = used ? r2(total / used) : 0;
    let direction = 0, label = '中性';
    if (score >= 0.6) { direction = 1; label = '偏多'; }
    else if (score <= -0.6) { direction = -1; label = '偏空'; }
    const aligned = direction === 0 ? 0 : rows.filter((r) => r.score * direction > 0.4).length;
    return {
      direction, score, label, rows, alignment: rows.length ? aligned / rows.length : 0,
      aligned, counts: { long: longs, short: shorts, neutral },
    };
  }

  function legacyBias(ctx) {
    const weights = { '1d': 0.5, '4h': 0.3, '1h': 0.2 };
    const rows = [];
    let total = 0, used = 0;
    Object.keys(weights).forEach((tf) => {
      const c = ctx[tf];
      if (!c) return;
      total += c.score * weights[tf]; used += weights[tf];
      rows.push({ tf: tf.toUpperCase(), score: c.score, label: c.label, structure: c.state.label, detail: c.detail });
    });
    const score = used ? r2(total / used) : 0;
    let direction = 0, label = '中性';
    if (score >= 0.6) { direction = 1; label = '偏多'; }
    else if (score <= -0.6) { direction = -1; label = '偏空'; }
    return { direction, score, label, rows, alignment: 0, aligned: 0, counts: { long: 0, short: 0, neutral: 0 }, legacy: true };
  }

  function groupScore(rows, labels) {
    const sel = rows.filter((r) => labels.indexOf(r.tf) >= 0);
    if (!sel.length) return 0;
    return sel.reduce((a, r) => a + r.score, 0) / sel.length;
  }

  function buildLevels(h1, d1, price) {
    const atr = h1.atr;
    const zones = buildZones(h1.swings, atr, h1.bars);
    const near = nearestZones(price, zones, atr);
    const d = d1.bars;
    const today = new Date(); today.setUTCHours(0, 0, 0, 0);
    const lastDay = new Date(d[d.length - 1].t); lastDay.setUTCHours(0, 0, 0, 0);
    const prevIdx = lastDay.getTime() === today.getTime() ? d.length - 2 : d.length - 1;
    const pdh = d[Math.max(0, prevIdx)].h, pdl = d[Math.max(0, prevIdx)].l;
    const todayBars = h1.bars.filter((b) => {
      const x = new Date(b.t); x.setUTCHours(0, 0, 0, 0);
      return x.getTime() === today.getTime();
    });
    const dayOpen = todayBars.length ? todayBars[0].o : d[d.length - 1].c;
    return {
      zones, near, pdh, pdl, dayOpen,
      round: roundLevels(price, atr),
      liquidity: liquidityPools(h1.swings, atr),

    };
  }

  function m15Trigger(m15, d) {
    if (!m15) return [false, '15m 数据缺失'];
    const bars = m15.bars;
    const pats = candlePatterns(bars, m15.atr, 3).filter((p) => p.dir === d);
    const last = bars[bars.length - 1], prev = bars[bars.length - 2];
    if (d === 1 && last.c > prev.h && (last.c - last.o) > 0.2 * m15.atr) return [true, '15m 收盘 ' + fmtPrice(last.c) + ' 上破前高 ' + fmtPrice(prev.h)];
    if (d === -1 && last.c < prev.l && (last.o - last.c) > 0.2 * m15.atr) return [true, '15m 收盘 ' + fmtPrice(last.c) + ' 下破前低 ' + fmtPrice(prev.l)];
    if (pats.length) return [true, '15m ' + pats[pats.length - 1].name + '：' + pats[pats.length - 1].detail];
    return [false, '15m 尚无同向确认（无吞没 / 无突破前根高低点）'];

  function cleanCandidates(cands, atr) {
    const sorted = cands.slice().sort((a, b) => a[0] - b[0]);
    const out = [];
    sorted.forEach((c) => {
      if (out.length && Math.abs(c[0] - out[out.length - 1][0]) < 0.2 * atr) return;
      out.push(c);
    });
    return out;
  }

  function buildTargets(d, entry, stop, atr, levels, ctx) {
    const risk = Math.abs(entry - stop);
    if (!(risk > 0)) return [];
    let cands = [];
    levels.zones.forEach((z) => {
      if (d === 1 && z.lo > entry + 0.4 * risk) cands.push([z.lo, '阻力区 ' + fmtPrice(z.lo) + '-' + fmtPrice(z.hi) + '（' + z.touches + ' 次触碰，强度 ' + z.strength + '）']);
      if (d === -1 && z.hi < entry - 0.4 * risk) cands.push([z.hi, '支撑区 ' + fmtPrice(z.lo) + '-' + fmtPrice(z.hi) + '（' + z.touches + ' 次触碰，强度 ' + z.strength + '）']);
    });
    if (d === 1 && levels.pdh > entry + 0.4 * risk) cands.push([levels.pdh, '昨日高点 PDH ' + fmtPrice(levels.pdh)]);
    if (d === -1 && levels.pdl < entry - 0.4 * risk) cands.push([levels.pdl, '昨日低点 PDL ' + fmtPrice(levels.pdl)]);
    levels.round.forEach((r) => {
      if (r % 25 !== 0) return;
      if (d === 1 && r > entry + 0.4 * risk) cands.push([r, '整数关口 ' + r.toLocaleString('en-US')]);
      if (d === -1 && r < entry - 0.4 * risk) cands.push([r, '整数关口 ' + r.toLocaleString('en-US')]);
    });
    const far = d === 1 ? (ctx['1d'] && ctx['1d'].state.lastHigh) : (ctx['1d'] && ctx['1d'].state.lastLow);
    if (far && ((d === 1 && far.price > entry + 1.5 * risk) || (d === -1 && far.price < entry - 1.5 * risk))) {
      cands.push([far.price, 'D1 摆动' + (d === 1 ? '高' : '低') + '点 ' + fmtPrice(far.price) + '（' + fmtTs(far.t) + '）']);
    }
    cands = cleanCandidates(cands, atr);
    const scored = cands.map((c) => [(c[0] - entry) / risk * d, c[0], c[1]]).sort((a, b) => a[0] - b[0]);
    const pick = (minR, afterR) => {
      for (let i = 0; i < scored.length; i++) {
        const s = scored[i];
        if (s[0] < minR) continue;
        if (afterR !== undefined && s[0] <= afterR + 0.25) continue;
        return s;
      }
      return null;
    };
    const fallback = (minR) => [minR, entry + d * minR * risk, minR + 'R 目标（前方无结构位）'];
    const tp1 = pick(0.9) || fallback(1.5);
    const tp2 = pick(1.8, tp1[0]) || fallback(Math.max(2.0, tp1[0] + 0.8));
    const tp3 = pick(2.6, tp2[0]) || fallback(Math.max(3.0, tp2[0] + 0.8));
    const portions = tp1[0] < 1.0 ? [0.2, 0.45, 0.35] : [0.4, 0.35, 0.25];
    return [tp1, tp2, tp3].map((tp, i) => ({ price: r2(tp[1]), r: r2(tp[0]), reason: tp[2], close_pct: Math.round(portions[i] * 100) }));
  }

  function positionSize(cfg, entry, stop) {
    const riskPerUnit = Math.abs(entry - stop);
    const riskAmount = (cfg.account * cfg.riskPct) / 100;
    let units = riskPerUnit > 0 ? riskAmount / riskPerUnit : 0;
    let lots = Math.round((units / 100) * 100) / 100;
    let warning = null;
    if (lots < 0.01) {
      lots = 0.01;
      warning = '按 ' + cfg.riskPct + '% 风险只够 ' + units.toFixed(2) + ' oz，低于最小 0.01 手（1 oz），实际风险会高于目标，需加大账户或等更近的入场';
    }
    units = lots * 100;
    const actualRisk = units * riskPerUnit;
    if (!warning && actualRisk > riskAmount * 1.25) warning = '最小手数取整后实际风险 $' + actualRisk.toFixed(2) + '，高于目标 $' + riskAmount.toFixed(2);
    return {
      risk_amount: r2(riskAmount), risk_per_unit: r2(riskPerUnit), lots,
      ounces: r2(units), notional: r2(units * entry), actual_risk: r2(actualRisk),
      risk_pct: cfg.riskPct, account: cfg.account, warning,
    };
  }

  function band(a, b) { return [r2(Math.min(a, b)), r2(Math.max(a, b))]; }

  function stopFromStructure(d, entry, structure, atr) {
    const buf = 0.25 * atr;
    let stop = structure - d * buf;
    let dist = Math.abs(entry - stop);
    if (dist > 2.4 * atr) stop = entry - d * 2.0 * atr;
    if (dist < 0.45 * atr) stop = entry - d * 0.6 * atr;
    return stop;
  }

  function trendSetup(d, c, levels, cfg) {
    const h1 = c;
    const bars = h1.bars, atr = h1.atr, price = h1.price;
    const legs = zigzag(h1.swings, atr, 1);
    let leg = null;
    for (let i = legs.length - 1; i >= 0; i--) {
      if (legs[i].dir === d && legs[i].sizeAtr >= 1) { leg = legs[i]; break; }
    }
    const recent = bars.slice(-30, -1);
    const recentExt = d === 1 ? Math.max.apply(null, recent.map((b) => b.h)) : Math.min.apply(null, recent.map((b) => b.l));

    const broke = d === 1 ? price > recentExt + 0.05 * atr : price < recentExt - 0.05 * atr;
    if (broke && h1.relVol >= 1.0) {
      const level = recentExt;
      const entry = price;
      const stop = stopFromStructure(d, entry, level - d * 0.7 * atr, atr);
      return {
        type: '突破跟进', dir: d, status: 'READY', triggered: true,
        entry: r2(entry), entry_zone: band(entry - 0.25 * atr, entry + 0.25 * atr), order: 'market',
        trigger: 'H1 收盘 ' + fmtPrice(price) + (d === 1 ? ' 上破' : ' 下破') + '近 30 根' + (d === 1 ? '高点' : '低点') + ' ' + fmtPrice(level) + '，量比 ' + h1.relVol.toFixed(2),
        confluence: ['突破位 ' + fmtPrice(level), '量比 ' + h1.relVol.toFixed(2) + '（>1 表示放量）'],
        stop: r2(stop),
        stop_reason: (d === 1 ? '突破位' : '跌破位') + ' ' + fmtPrice(level) + ' 反向 0.7×ATR(' + atr.toFixed(2) + ') 作为失败突破止损',
        risk_ref: level,
      };
    }

    let bandLo, bandHi, origin, legNote, fibTxt;
    if (!leg) {
      const anchor = d === 1 ? Math.min(h1.ema20, h1.ema50) : Math.max(h1.ema20, h1.ema50);
      [bandLo, bandHi] = band(anchor - d * 0.4 * atr, anchor + d * 0.2 * atr);
      legNote = '无有效推动浪，使用 EMA20/50 区域作为回踩位';
      const tail = bars.slice(-20);
      origin = d === 1 ? Math.min.apply(null, tail.map((b) => b.l)) : Math.max.apply(null, tail.map((b) => b.h));
      fibTxt = '';
    } else {
      const fibs = {};
      fibLevels(leg).forEach((f) => { fibs[f.ratio] = f.price; });
      [bandLo, bandHi] = band(fibs[0.618], fibs[0.382]);
      origin = leg.from;
      legNote = '最近' + (d === 1 ? '上涨' : '下跌') + '推动浪 ' + fmtPrice(leg.from) + ' → ' + fmtPrice(leg.to) + '（' + leg.sizeAtr.toFixed(1) + '×ATR）';
      fibTxt = '斐波那契 0.382-0.618 回踩带 ' + fmtPrice(bandLo) + '-' + fmtPrice(bandHi);
    }

    const ema = h1.ema20;
    let emaNote;
    if (bandLo - 0.5 * atr <= ema && ema <= bandHi + 0.5 * atr) {
      const nb = band(Math.min(bandLo, ema), Math.max(bandHi, ema));
      bandLo = nb[0]; bandHi = nb[1];
      emaNote = 'EMA20 ' + fmtPrice(ema) + ' 落在带内';
    } else {
      const gap = ema < bandLo ? bandLo - ema : ema - bandHi;
      emaNote = 'EMA20 ' + fmtPrice(ema) + ' 距带 ' + (gap / atr).toFixed(2) + '×ATR';
    }

    const zoneHits = levels.zones.filter((z) => !(z.hi < bandLo || z.lo > bandHi)).sort((a, b) => b.strength - a.strength);
    let zoneNote;
    if (zoneHits.length) {
      const z = zoneHits[0];
      const nb = band(Math.min(bandLo, z.lo), Math.max(bandHi, z.hi));
      bandLo = nb[0]; bandHi = nb[1];
      zoneNote = '与' + (d === 1 ? '支撑' : '阻力') + '区 ' + fmtPrice(z.lo) + '-' + fmtPrice(z.hi) + ' 重叠（' + z.touches + ' 次触碰）';
    } else zoneNote = '附近无多次触碰的结构区';

    let inside;
    if (d === 1) {
      if (price < bandLo - 0.6 * atr) return null;
      inside = price >= bandLo && price <= bandHi;
    } else {
      if (price > bandHi + 0.6 * atr) return null;
      inside = price >= bandLo && price <= bandHi;
    }

    const entry = inside ? price : (d === 1 ? bandHi : bandLo);
    let stop = stopFromStructure(d, entry, origin, atr);
    const clamped = Math.abs((origin - d * 0.25 * atr) - stop) > 0.01;
    if (Math.abs(entry - stop) > cfg.maxStopAtr * atr) stop = entry - d * 2.0 * atr;
    const status = inside ? 'READY' : 'PENDING';
    const retr = leg ? ((leg.to - price) / leg.size) * leg.dir : 0;
    const bits = [legNote, fibTxt, emaNote, zoneNote].filter(Boolean);
    return {
      type: '趋势回踩', dir: d, status, triggered: false,
      entry: r2(entry), entry_zone: [bandLo, bandHi], order: inside ? 'market' : 'limit',
      trigger: bits.join('；'), confluence: bits,
      stop: r2(stop),
      stop_reason: (clamped
        ? '结构' + (d === 1 ? '低' : '高') + '点 ' + fmtPrice(origin) + ' 太远，按上限 2.0×ATR 收紧；'
        : '结构' + (d === 1 ? '低' : '高') + '点 ' + fmtPrice(origin) + ' 外侧 0.25×ATR(' + atr.toFixed(2) + ')；') +
        '止损距离 ' + Math.abs(entry - stop).toFixed(2) + ' = ' + (Math.abs(entry - stop) / atr).toFixed(2) + '×ATR',
      risk_ref: origin, retracement: leg ? Math.round(retr * 1000) / 1000 : null, inside,
    };
  }

  function rangeSetup(ctx, levels, price, atr) {
    const near = levels.near;
    const sup = near.support[0] || null, res = near.resistance[0] || null;
    if (!sup && !res) return null;
    const dSup = sup ? (price - sup.hi) / atr : 99;
    const dRes = res ? (res.lo - price) / atr : 99;
    if (sup && dSup <= 0.7 && sup.strength >= 4) {
      return {
        type: '区间低吸', dir: 1, status: 'READY', triggered: false,
        entry: r2(price), entry_zone: band(sup.lo, sup.hi), order: 'market',
        trigger: '价格 ' + fmtPrice(price) + ' 贴着支撑区 ' + fmtPrice(sup.lo) + '-' + fmtPrice(sup.hi) + '（强度 ' + sup.strength + '，距 ' + dSup.toFixed(2) + '×ATR）',
        confluence: ['支撑区 ' + fmtPrice(sup.lo) + '-' + fmtPrice(sup.hi), '强度 ' + sup.strength + '，' + sup.touches + ' 次触碰'],
        stop: r2(sup.lo - 0.5 * atr),
        stop_reason: '支撑区下沿 ' + fmtPrice(sup.lo) + ' 下方 0.5×ATR(' + atr.toFixed(2) + ')',
        risk_ref: sup.lo,
      };
    }
    if (res && dRes <= 0.7 && res.strength >= 4) {
      return {
        type: '区间高抛', dir: -1, status: 'READY', triggered: false,
        entry: r2(price), entry_zone: band(res.lo, res.hi), order: 'market',
        trigger: '价格 ' + fmtPrice(price) + ' 贴着阻力区 ' + fmtPrice(res.lo) + '-' + fmtPrice(res.hi) + '（强度 ' + res.strength + '，距 ' + dRes.toFixed(2) + '×ATR）',
        confluence: ['阻力区 ' + fmtPrice(res.lo) + '-' + fmtPrice(res.hi), '强度 ' + res.strength + '，' + res.touches + ' 次触碰'],
        stop: r2(res.hi + 0.5 * atr),
        stop_reason: '阻力区上沿 ' + fmtPrice(res.hi) + ' 上方 0.5×ATR(' + atr.toFixed(2) + ')',
        risk_ref: res.hi,
      };
    }
    return null;
  }

  /* ---------------------------------------------------------- both sides */
  function mergeZoneLists(a, b, atr) {
    const all = a.concat(b).sort((x, y) => x.mid - y.mid);
    const out = [];
    all.forEach((z) => {
      const m = out[out.length - 1];
      if (m && z.lo <= m.hi + 0.2 * atr) {
        m.hi = Math.max(m.hi, z.hi); m.lo = Math.min(m.lo, z.lo);
        m.mid = (m.lo + m.hi) / 2;
        m.strength = Math.max(m.strength, z.strength);
        m.touches = Math.max(m.touches, z.touches);
      } else out.push(Object.assign({}, z));
    });
    return out;
  }

  function rangeSide(d, lv, price, atr) {
    const z = d === 1 ? (lv.near.support[0] || null) : (lv.near.resistance[0] || null);
    if (!z || z.strength < 4) return null;
    const dist = d === 1 ? (price - z.hi) / atr : (z.lo - price) / atr;
    if (dist > 0.8 || dist < -0.25) return null;
    const stop = d === 1 ? z.lo - 0.5 * atr : z.hi + 0.5 * atr;
    return {
      type: d === 1 ? '区间低吸' : '区间高抛', dir: d, status: 'READY', order: 'market',
      entry: r2(price), entry_zone: band(z.lo, z.hi),
      trigger: '价格 ' + fmtPrice(price) + ' 贴着' + (d === 1 ? '支撑' : '阻力') + '区 ' + fmtPrice(z.lo) + '-' + fmtPrice(z.hi) + '（强度 ' + z.strength + '，距 ' + dist.toFixed(2) + '×ATR）',
      confluence: [(d === 1 ? '支撑区 ' : '阻力区 ') + fmtPrice(z.lo) + '-' + fmtPrice(z.hi), '强度 ' + z.strength + ' · ' + z.touches + ' 次触碰'],
      stop: r2(stop),
      stop_reason: (d === 1 ? '支撑区下沿 ' : '阻力区上沿 ') + fmtPrice(d === 1 ? z.lo : z.hi) + ' 外 0.5×ATR(' + atr.toFixed(2) + ')',
      risk_ref: d === 1 ? z.lo : z.hi,
    };
  }

  function waitingSide(d, c, cfg) {
    const anchor = d === 1 ? Math.min(c.ema20, c.ema50) - 0.2 * c.atr : Math.max(c.ema20, c.ema50) + 0.2 * c.atr;
    const stop = anchor - d * 1.2 * c.atr;
    return {
      type: '等待回踩', dir: d, status: 'WAIT', order: 'limit',
      entry: r2(anchor), entry_zone: band(anchor - 0.3 * c.atr, anchor + 0.3 * c.atr),
      trigger: '当前价格 ' + fmtPrice(c.price) + ' 不在' + (d === 1 ? '多头' : '空头') + '回踩带内，等回到 EMA20/50 附近再考虑',
      confluence: ['EMA20 ' + fmtPrice(c.ema20) + ' / EMA50 ' + fmtPrice(c.ema50)],
      stop: r2(stop), stop_reason: '回踩位下方 1.2×ATR(' + c.atr.toFixed(2) + ') 作为结构止损',
      risk_ref: anchor,
    };
  }

  function makeSide(d, c, lv, tlv, cfg, ctx, biasDir) {
    let plan = trendSetup(d, c, lv, cfg);
    if (!plan) plan = rangeSide(d, lv, c.price, c.atr);
    if (!plan) plan = waitingSide(d, c, cfg);

    const targets = buildTargets(d, plan.entry, plan.stop, c.atr, tlv, ctx);
    plan.targets = targets;
    plan.rr = targets.length >= 2 ? r2(targets[1].r) : 0;
    plan.size = positionSize(cfg, plan.entry, plan.stop);
    plan.aligned = biasDir === d;
    plan.dir = d;

    const recent = c.bars.slice(-30, -1);
    const ext = d === 1 ? Math.max.apply(null, recent.map((b) => b.h)) : Math.min.apply(null, recent.map((b) => b.l));
    if (plan.order === 'limit') {
      plan.alt = {
        type: d === 1 ? 'BUY_STOP' : 'SELL_STOP',
        price: r2(ext + d * 0.1 * c.atr),
        stop: r2(ext - d * 0.9 * c.atr),
        note: (d === 1 ? '站上 ' : '跌破 ') + fmtPrice(ext) + ' 确认后，用 ' + (d === 1 ? 'Buy Stop ' : 'Sell Stop ') + fmtPrice(ext + d * 0.1 * c.atr) + ' 追（含 0.1×ATR 缓冲）',
      };
    } else {
      const pull = d === 1 ? Math.min(c.ema20, c.ema50) : Math.max(c.ema20, c.ema50);
      plan.alt = {
        type: d === 1 ? 'BUY_LIMIT' : 'SELL_LIMIT',
        price: r2(pull),
        stop: r2(pull - d * 1.0 * c.atr),
        note: '等回踩 EMA20/50 ' + fmtPrice(pull) + ' 再接（限价单）',
      };
    }
    plan.mt5type = (d === 1 ? 'BUY' : 'SELL') + (plan.order === 'limit' ? '_LIMIT' : '');
    return plan;
  }

  function buildSides(ctx, cfg, bias) {
    const specs = [
      { key: 'short', label: '短线', tf: '15m', targetTf: '1h' },
      { key: 'long', label: '长线', tf: '4h', targetTf: '1d' },
    ];
    const out = {};
    specs.forEach((sp) => {
      const c = ctx[sp.tf], tgt = ctx[sp.targetTf];
      if (!c || !tgt) return;
      const lv = buildLevels(c, ctx['1d'], c.price);
      const zones = mergeZoneLists(lv.zones, buildZones(tgt.swings, tgt.atr, tgt.bars), c.atr);
      const tlv = Object.assign({}, lv, { zones });
      out[sp.key] = {
        key: sp.key, label: sp.label, tf: sp.tf.toUpperCase(),
        buy: makeSide(1, c, lv, tlv, cfg, ctx, bias.direction),
        sell: makeSide(-1, c, lv, tlv, cfg, ctx, bias.direction),
      };
    });
    return out;
  }

  /* ------------------------------------------------------ pro structure */
  function detectStructure(bars, swings) {
    const price = bars[bars.length - 1].c;
    const st = structureState(swings);
    const highs = swings.filter((s) => s.kind === 'H');
    const lows = swings.filter((s) => s.kind === 'L');
    const lastH = highs[highs.length - 1];
    const lastL = lows[lows.length - 1];
    if (!lastH || !lastL) return null;
    let event = '区间内', dir = 0, detail = '', eventEn = 'Inside range', detailEn = '';
    if (price > lastH.price) {
      dir = 1;
      event = st.trend >= 0 ? 'BOS 向上突破' : 'CHoCH 转多';
      eventEn = st.trend >= 0 ? 'BOS up' : 'CHoCH up';
      detail = 'H1 收盘 ' + fmtPrice(price) + ' 站上最近摆动高点 ' + fmtPrice(lastH.price) + '（' + fmtTs(lastH.t) + '）';
      detailEn = 'H1 close ' + fmtPrice(price) + ' above swing high ' + fmtPrice(lastH.price) + ' (' + fmtTs(lastH.t) + ')';
    } else if (price < lastL.price) {
      dir = -1;
      event = st.trend <= 0 ? 'BOS 向下突破' : 'CHoCH 转空';
      eventEn = st.trend <= 0 ? 'BOS down' : 'CHoCH down';
      detail = 'H1 收盘 ' + fmtPrice(price) + ' 跌破最近摆动低点 ' + fmtPrice(lastL.price) + '（' + fmtTs(lastL.t) + '）';
      detailEn = 'H1 close ' + fmtPrice(price) + ' below swing low ' + fmtPrice(lastL.price) + ' (' + fmtTs(lastL.t) + ')';
    } else {
      detail = '价格仍在 ' + fmtPrice(lastL.price) + ' - ' + fmtPrice(lastH.price) + ' 之间，未出现结构突破';
      detailEn = 'Price is still between ' + fmtPrice(lastL.price) + ' and ' + fmtPrice(lastH.price) + '; no structure break yet';
    }
    return { event, eventEn, dir, detail, detailEn, lastHigh: r2(lastH.price), lastLow: r2(lastL.price) };
  }

  function orderBlock(bars, atr) {
    const price = bars[bars.length - 1].c;
    for (let i = bars.length - 2; i >= Math.max(2, bars.length - 80); i--) {
      const b = bars[i];
      if (Math.abs(b.c - b.o) < 1.3 * atr) continue;
      const up = b.c > b.o;
      for (let j = i - 1; j >= Math.max(0, i - 5); j--) {
        const o = bars[j];
        const opposite = up ? o.c < o.o : o.c > o.o;
        if (!opposite) continue;
        const lo = Math.min(o.o, o.c), hi = Math.max(o.o, o.c);
        const inside = price >= lo && price <= hi;
        const dist = inside ? 0 : (price > hi ? price - hi : lo - price);
        if (dist > 6 * atr) return null;
        return {
          type: up ? '看涨订单块' : '看跌订单块', typeEn: up ? 'Bullish OB' : 'Bearish OB', dir: up ? 1 : -1,
          lo: r2(lo), hi: r2(hi), inside, dist: r2(dist),
          detail: (up ? '上涨' : '下跌') + '启动前的最后一根反向 K 线，区间 ' + fmtPrice(lo) + '-' + fmtPrice(hi) +
            (inside ? '，价格正在块内' : '，距现价 ' + dist.toFixed(2) + '（' + (dist / atr).toFixed(2) + '×ATR）'),
          detailEn: 'Last opposite candle before the ' + (up ? 'up' : 'down') + ' move, zone ' + fmtPrice(lo) + '-' + fmtPrice(hi) +
            (inside ? ', price is inside' : ', ' + dist.toFixed(2) + ' away (' + (dist / atr).toFixed(2) + 'xATR)'),
        };
      }
    }
    return null;
  }

  function fairValueGap(bars, atr) {
    const price = bars[bars.length - 1].c;
    const out = [];
    for (let i = Math.max(2, bars.length - 60); i < bars.length; i++) {
      const a = bars[i - 2], c = bars[i];
      if (a.h < c.l) {
        const lo = a.h, hi = c.l;
        if (price > hi) out.push({ dir: 1, lo, hi, i, t: c.t });
      } else if (a.l > c.h) {
        const lo = c.h, hi = a.l;
        if (price < lo) out.push({ dir: -1, lo, hi, i, t: c.t });
      }
    }
    if (!out.length) return null;
    out.sort((x, y) => Math.abs((x.lo + x.hi) / 2 - price) - Math.abs((y.lo + y.hi) / 2 - price));
    const g = out[0];
    const mid = (g.lo + g.hi) / 2;
    return {
      dir: g.dir, lo: r2(g.lo), hi: r2(g.hi), dist: r2(Math.abs(mid - price)),
      detail: (g.dir === 1 ? '看涨' : '看跌') + '失衡缺口 ' + fmtPrice(g.lo) + '-' + fmtPrice(g.hi) +
        '，形成于 ' + fmtTs(g.t) + '，现价距缺口 ' + (Math.abs(mid - price) / atr).toFixed(2) + '×ATR',
      detailEn: (g.dir === 1 ? 'Bullish' : 'Bearish') + ' FVG ' + fmtPrice(g.lo) + '-' + fmtPrice(g.hi) +
        ' formed ' + fmtTs(g.t) + ', ' + (Math.abs(mid - price) / atr).toFixed(2) + 'xATR away',
    };
  }

  function premiumDiscount(bars) {
    const win = bars.slice(-50);
    const hi = Math.max.apply(null, win.map((b) => b.h));
    const lo = Math.min.apply(null, win.map((b) => b.l));
    const price = bars[bars.length - 1].c;
    const pos = hi > lo ? (price - lo) / (hi - lo) : 0.5;
    let zone, zoneEn, dir = 0;
    if (pos >= 0.65) { zone = '溢价区'; zoneEn = 'Premium'; dir = -1; }
    else if (pos <= 0.35) { zone = '折价区'; zoneEn = 'Discount'; dir = 1; }
    else { zone = '均衡区'; zoneEn = 'Equilibrium'; }
    return {
      dir, zone, zoneEn, pos: Math.round(pos * 100), hi: r2(hi), lo: r2(lo),
      detail: '近 50 根区间 ' + fmtPrice(lo) + '-' + fmtPrice(hi) + '，现价在 ' + Math.round(pos * 100) + '% 位置（' + zone + '）',
      detailEn: '50-bar range ' + fmtPrice(lo) + '-' + fmtPrice(hi) + ', price at ' + Math.round(pos * 100) + '% (' + zoneEn + ')',
    };
  }

  function liquiditySweep(bars, atr) {
    const n = bars.length;
    for (let i = n - 2; i >= Math.max(20, n - 8); i--) {
      const b = bars[i];
      const prior = bars.slice(i - 20, i);
      const hi = Math.max.apply(null, prior.map((x) => x.h));
      const lo = Math.min.apply(null, prior.map((x) => x.l));
      if (b.h > hi && b.c < hi && b.h - hi > 0.15 * atr) {
        return { dir: -1, detail: '上影扫过前高 ' + fmtPrice(hi) + ' 后收回，属于流动性扫单（假突破）',
          detailEn: 'Wick swept above ' + fmtPrice(hi) + ' and closed back inside (liquidity sweep)', level: r2(hi), t: b.t };
      }
      if (b.l < lo && b.c > lo && lo - b.l > 0.15 * atr) {
        return { dir: 1, detail: '下影扫过前低 ' + fmtPrice(lo) + ' 后收回，属于流动性扫单（假跌破）',
          detailEn: 'Wick swept below ' + fmtPrice(lo) + ' and closed back inside (liquidity sweep)', level: r2(lo), t: b.t };
      }
    }
    return null;
  }

  function buildPro(ctx) {
    const c = ctx['1h'];
    if (!c) return null;
    const h4 = ctx['4h'];
    const st = detectStructure(c.bars, c.swings);
    const ob = orderBlock(c.bars, c.atr);
    const gap = fairValueGap(c.bars, c.atr);
    const pd = premiumDiscount(c.bars);
    const sweep = liquiditySweep(c.bars, c.atr);
    const items = [
      st && { key: '结构', title: '市场结构', titleEn: 'Market structure', value: st.event, valueEn: st.eventEn, dir: st.dir, rel: st.dir !== 0, detail: st.detail, detailEn: st.detailEn },
      ob && { key: 'OB', title: '订单块', titleEn: 'Order block', value: ob.type + (ob.inside ? ' · 价格在块内' : ''), valueEn: ob.typeEn + (ob.inside ? ' · price inside' : ''), dir: ob.dir, rel: ob.dist <= 2 * c.atr, detail: ob.detail, detailEn: ob.detailEn },
      gap && { key: 'FVG', title: '失衡缺口', titleEn: 'Fair value gap', value: gap.dir === 1 ? '看涨 FVG' : '看跌 FVG', valueEn: (gap.dir === 1 ? 'Bullish' : 'Bearish') + ' FVG', dir: gap.dir, rel: gap.dist <= 2 * c.atr, detail: gap.detail, detailEn: gap.detailEn },
      { key: 'PD', title: '溢价 / 折价', titleEn: 'Premium / discount', value: pd.zone + ' ' + pd.pos + '%', valueEn: pd.zoneEn + ' ' + pd.pos + '%', dir: pd.dir, rel: pd.dir !== 0, detail: pd.detail, detailEn: pd.detailEn },
      sweep && { key: 'SWEEP', title: '流动性扫单', titleEn: 'Liquidity sweep', value: sweep.dir === 1 ? '扫低回收' : '扫高回落', valueEn: sweep.dir === 1 ? 'Swept lows' : 'Swept highs', dir: sweep.dir, rel: true, detail: sweep.detail + '（' + fmtTs(sweep.t) + '）', detailEn: sweep.detailEn + ' (' + fmtTs(sweep.t) + ')' },
    ].filter(Boolean);
    const bull = items.filter((x) => x.rel && x.dir === 1).length;
    const bear = items.filter((x) => x.rel && x.dir === -1).length;
    const h4Trend = h4 ? h4.label : '—';
    return {
      items, bull, bear,
      h4Trend,
      summary: '支撑 ' + bull + ' 项 / 阻力 ' + bear + ' 项' + (st ? ' · ' + st.event : ''),
      summaryEn: bull + ' support / ' + bear + ' resistance' + (st ? ' · ' + st.eventEn : ''),
      glossary: [
        { t: 'BOS', d: 'Break of Structure，顺势突破前一个摆动高/低点，代表趋势延续。', dEn: 'Break of Structure: price breaks the prior swing in the trend direction (continuation).' },
        { t: 'CHoCH', d: 'Change of Character，逆势突破前一个摆动点，代表趋势可能转向。', dEn: 'Change of Character: price breaks the prior swing against the trend (possible reversal).' },
        { t: '订单块 OB', d: '启动一波行情前最后一根反向 K 线，机构挂单密集区，常被回踩。', dEn: 'Order block: the last opposite candle before an impulsive move; often revisited.' },
        { t: 'FVG', d: 'Fair Value Gap，三根 K 线之间的价格真空（失衡），价格常回来填补。', dEn: 'Fair value gap: a three-candle imbalance that price often comes back to fill.' },
        { t: '溢价/折价', d: '把区间分成 0-100%，上半部（>65%）偏贵适合卖，下半部（<35%）偏便宜适合买。', dEn: 'Premium/discount: position inside the range; above 65% is expensive, below 35% is cheap.' },
        { t: '流动性扫单', d: '影线刺穿前高/前低后迅速收回，扫掉止损再反向走，通常是假突破。', dEn: 'Liquidity sweep: a wick through a prior high/low that closes back inside (stop hunt).' },
      ],
    };
  }

  function buildPlan(bias, ctx, levels, cfg) {    const price = ctx['1h'].price, atr = ctx['1h'].atr;
    const d = bias.direction;
    let plan = null;
    if (d !== 0) plan = trendSetup(d, ctx['1h'], levels, cfg);
    if (!plan) plan = rangeSetup(ctx, levels, price, atr);
    if (!plan) {
      const near = levels.near;
      const resTxt = near.resistance.length ? '上方阻力 ' + fmtPrice(near.resistance[0].lo) + '（' + near.distResistanceAtr.toFixed(1) + '×ATR）' : '上方无明显阻力';
      const supTxt = near.support.length ? '下方支撑 ' + fmtPrice(near.support[0].hi) + '（' + near.distSupportAtr.toFixed(1) + '×ATR）' : '下方无明显支撑';
      return {
        type: '无有效形态', dir: d, status: 'WAIT', triggered: false,
        entry: null, entry_zone: null, order: null,
        trigger: '价格 ' + fmtPrice(price) + ' 位于结构中部：' + supTxt + '，' + resTxt,
        confluence: [], stop: null, stop_reason: '无入场即无止损', risk_ref: null,
      };
    }
    return plan;
  }

  function pctRank(values, window) {
    const v = values.filter((x) => isFinite(x));
    if (v.length < 10) return 50;
    const win = v.slice(-(window || 100));
    const last = win[win.length - 1];
    return (win.filter((x) => x <= last).length / win.length) * 100;
  }

  function scorePlan(plan, bias, ctx, levels, m15, cfg, dataOk) {
    const ev = [];
    const d = plan.dir || 0;
    const h1 = ctx['1h'], h4 = ctx['4h'], d1 = ctx['1d'];
    const add = (group, item, detail, points, max, pass) =>
      ev.push({ group, item, detail, points: r1(points), max, pass: !!pass });

    if (d !== 0) {
      if (!bias.legacy) {
        const al = bias.alignment || 0;
        add('趋势', '多周期一致性',
          (bias.aligned || 0) + '/' + bias.rows.length + ' 个周期同向（' + Math.round(al * 100) + '%）· ' +
          '多 ' + bias.counts.long + ' / 空 ' + bias.counts.short + ' / 中性 ' + bias.counts.neutral,
          Math.round(al * 10), 10, al >= 0.6);
      }
      let m = bias.legacy ? WEIGHTS.trend * 0.45 : 4;
      let align = !!(d1 && d1.score * d > 0.4), half = !!(d1 && d1.score * d > 0);
      add('趋势', 'D1 方向', d1 ? d1.label + '（评分 ' + d1.score.toFixed(2) + '）：' + d1.detail : '无 D1 数据', align ? m : half ? m * 0.5 : 0, r1(m), align);
      m = bias.legacy ? WEIGHTS.trend * 0.32 : 4;
      align = !!(h4 && h4.score * d > 0.3); half = !!(h4 && h4.score * d > 0);
      add('趋势', 'H4 方向', h4 ? h4.label + '（评分 ' + h4.score.toFixed(2) + '）：' + h4.detail : '无 H4 数据', align ? m : half ? m * 0.5 : 0, r1(m), align);
      m = bias.legacy ? WEIGHTS.trend * 0.23 : 4;
      const stack = (h1.ema20 - h1.ema50) * d > 0 && (h1.price - h1.ema200) * d > 0;
      add('趋势', 'H1 均线排列', 'EMA20 ' + fmtPrice(h1.ema20) + ' / EMA50 ' + fmtPrice(h1.ema50) + ' / EMA' + h1.emaLen + ' ' + fmtPrice(h1.ema200) + (h1.emaLen < 200 ? '（样本不足 200 根）' : ''), stack ? m : 0, r1(m), stack);
    } else {
      add('趋势', '方向一致性', 'D1/H4/H1 未形成多数同向，只做区间边缘', 0, 22, false);
    }

    if (plan.type === '趋势回踩' && plan.entry_zone) {
      const retr = plan.retracement || 0;
      const ideal = retr >= 0.25 && retr <= 0.65;
      add('位置', '回踩深度', '回撤 ' + Math.round(retr * 100) + '%（理想 25-65%），回踩带 ' + fmtPrice(plan.entry_zone[0]) + '-' + fmtPrice(plan.entry_zone[1]), ideal ? 8 : 4, 8, ideal);
      const zs = levels.zones.filter((z) => !(z.hi < plan.entry_zone[0] || z.lo > plan.entry_zone[1]));
      const strength = zs.length ? Math.max.apply(null, zs.map((z) => z.strength)) : 0;
      add('位置', '结构区支撑', '回踩带内结构区最高强度 ' + strength, Math.min(10, strength), 10, strength >= 5);
    } else if (plan.type === '区间低吸' || plan.type === '区间高抛') {
      const z = plan.dir === 1 ? levels.near.support[0] : levels.near.resistance[0];
      add('位置', '区间边缘', '贴着 ' + fmtPrice(z.lo) + '-' + fmtPrice(z.hi) + '，强度 ' + z.strength + '，' + z.touches + ' 次触碰', Math.min(18, z.strength * 2), 18, z.strength >= 5);
    } else {
      add('位置', '入场位置', plan.trigger || '', 10, 18, true);
    }

    if (plan.status === 'READY') {
      let ok, detail;
      if (plan.type === '突破跟进') { ok = true; detail = plan.trigger; }
      else { const r = m15Trigger(m15, d); ok = r[0]; detail = r[1]; }
      add('触发', '15m 确认', ok ? detail : detail + '（按市价/挂单执行）', ok ? 12 : 6, 12, ok);
      const chasing = Math.abs(h1.price - h1.ema20) > 2.2 * h1.atr;
      add('触发', '非追单', '价格距 EMA20 ' + (Math.abs(h1.price - h1.ema20) / h1.atr).toFixed(2) + '×ATR（>2.2 视为追单）', chasing ? 0 : 6, 6, !chasing);
    } else {
      add('触发', '等待触发', plan.status === 'PENDING' ? '价格 ' + fmtPrice(h1.price) + ' 未进入入场带，等待回踩' : '形态不成立，不挂单', 0, 12, false);
      add('触发', '入场方式', plan.status === 'PENDING' ? '价格未到入场带，挂限价单等待' : '形态不成立', plan.status === 'PENDING' ? 6 : 0, 6, plan.status === 'PENDING');
    }

    const rsi = h1.rsi;
    const okRsi = d === 1 ? (rsi >= 45 && rsi <= 72) : d === -1 ? (rsi >= 28 && rsi <= 55) : (rsi >= 40 && rsi <= 60);
    add('动量', 'RSI(14)', rsi.toFixed(1) + '（' + (d === 1 ? '偏多' : '偏空') + '健康区）', okRsi ? 6 : 3, 6, okRsi);
    const macdOk = d ? h1.macdHist * d > 0 : Math.abs(h1.macdHist) < 0.2 * h1.atr;
    add('动量', 'MACD 柱', (h1.macdHist >= 0 ? '+' : '') + h1.macdHist.toFixed(2), macdOk ? 3 : 1, 3, macdOk);
    add('动量', 'ADX(14)', h1.adx.toFixed(1) + '（>20 有趋势，>25 强趋势）', h1.adx >= 20 ? 3 : 0, 3, h1.adx >= 20);

    const targets = plan.targets || [];
    let room, roomSrc;
    if (targets.length && plan.entry) { room = Math.abs(targets[0].price - plan.entry) / h1.atr; roomSrc = '首目标 ' + fmtPrice(targets[0].price); }
    else {
      const n = levels.near;
      room = d === 1 ? n.distResistanceAtr : n.distSupportAtr;
      if (room == null) room = 3;
      roomSrc = '最近结构';
    }
    add('空间', '到首目标空间', room.toFixed(2) + '×ATR（' + roomSrc + '，≥1.5 视为空间充足）', room >= 1.5 ? 10 : room >= 1 ? 6 : 2, 10, room >= 1);

    const rr = plan.rr || 0;
    add('盈亏比', 'TP2 盈亏比', rr.toFixed(2) + 'R（最低要求 ' + cfg.minRr + 'R）', rr >= 2.5 ? 12 : rr >= 2 ? 9 : rr >= 1.5 ? 6 : 0, 12, rr >= cfg.minRr);
    add('数据', '数据完整性', dataOk ? '实时报价 + 对齐后的 K 线' : '数据滞后，信号仅供结构参考', dataOk ? 8 : 0, 8, dataOk);

    const conf = ev.reduce((a, e) => a + e.points, 0);
    return [ev, Math.round(Math.min(100, conf) * 10) / 10];
  }

  /* ------------------------------------------------------------------ main */
  function adjustStopForLiquidity(plan, ctx, atr, spot, cfg) {
    const d = plan.dir;
    const bars = (ctx['1h'] && ctx['1h'].bars) || [];
    if (!d || !bars.length) return;
    const spread = spot && spot.bid && spot.ask ? Math.max(0, spot.ask - spot.bid) : 0;
    const buf = 0.1 * atr + 0.5 * spread;
    const maxStop = (cfg.maxStopAtr || 2.4) * atr;
    const entry = plan.entry, base = plan.stop;
    plan.stop_reason = String(plan.stop_reason || '').replace(/；止损距离 [0-9.]+ = [0-9.]+×ATR/, '');
    let ref = null;
    const recent = bars.slice(-120);
    if (d === 1) {
      recent.forEach((b) => {
        if (b.l <= base + 0.25 * atr && b.l >= base - 0.35 * atr && (ref === null || b.l < ref)) ref = b.l;
      });
      if (ref !== null) {
        const cand = ref - buf;
        if (cand < base && entry - cand <= maxStop) {
          plan.stop = r2(cand);
          plan.stop_reason += '；避让最近摆动低点 ' + fmtPrice(ref) + '，缓冲 ' + buf.toFixed(2) +
            '，调整后 ' + Math.abs(entry - plan.stop).toFixed(2) + ' = ' + (Math.abs(entry - plan.stop) / atr).toFixed(2) + '×ATR';
          return;
        }
      }
    } else {
      recent.forEach((b) => {
        if (b.h >= base - 0.25 * atr && b.h <= base + 0.35 * atr && (ref === null || b.h > ref)) ref = b.h;
      });
      if (ref !== null) {
        const cand = ref + buf;
        if (cand > base && cand - entry <= maxStop) {
          plan.stop = r2(cand);
          plan.stop_reason += '；避让最近摆动高点 ' + fmtPrice(ref) + '，缓冲 ' + buf.toFixed(2) +
            '，调整后 ' + Math.abs(entry - plan.stop).toFixed(2) + ' = ' + (Math.abs(entry - plan.stop) / atr).toFixed(2) + '×ATR';
          return;
        }
      }
    }
    if (spread > 0) {
      const cand = d === 1 ? base - 0.5 * spread : base + 0.5 * spread;
      if (Math.abs(entry - cand) <= maxStop) {
        plan.stop = r2(cand);
        plan.stop_reason += '；加点差缓冲 ' + (0.5 * spread).toFixed(2);
      }
    }
  }

  function analyze(rawBundle, cfg) {
    const ctx = {};
    TF_LIST.forEach(({ key }) => {
      if (!rawBundle[key]) return;
      try { ctx[key] = tfContext(rawBundle[key].bars, key); } catch (e) { /* skip thin history */ }
    });
    if (!ctx['1h']) throw new Error('H1 数据不可用，无法生成信号');
    if (!ctx['1d']) throw new Error('D1 数据不可用，无法计算 PDH/PDL 与日线结构');

    const h1 = ctx['1h'];
    const spot = rawBundle.spot || {};
    const price = spot.mid || h1.price;
    const atr = h1.atr;
    const levels = buildLevels(h1, ctx['1d'], price);
    const bias = cfg.legacyBias ? legacyBias(ctx) : consensus(ctx);
    const plan = buildPlan(bias, ctx, levels, cfg);
    if (plan.entry && plan.stop) adjustStopForLiquidity(plan, ctx, atr, spot, cfg);

    const targets = plan.entry ? buildTargets(plan.dir, plan.entry, plan.stop, atr, levels, ctx) : [];
    plan.targets = targets;
    plan.rr = targets.length >= 2 ? r2(targets[1].r) : 0;
    plan.triggered = false;
    plan.trigger_note = '';
    if (plan.dir && plan.status === 'READY') {
      if (plan.type === '突破跟进') { plan.triggered = true; plan.trigger_note = plan.trigger; }
      else { const t = m15Trigger(ctx['15m'], plan.dir); plan.triggered = t[0]; plan.trigger_note = t[1]; }
    }

    const dataOk = !rawBundle.stale;
    const scored = scorePlan(plan, bias, ctx, levels, ctx['15m'], cfg, dataOk);
    const evidence = scored[0], confidence = scored[1];

    const blockers = [];
    const htfScore = groupScore(bias.rows, ['MN', 'W1', 'D1']);
    const ltfScore = groupScore(bias.rows, ['H1', 'M30', 'M15', 'M5', 'M1']);
    if (plan.dir !== 0 && htfScore * ltfScore < 0 && Math.abs(htfScore) > 0.6 && Math.abs(ltfScore) > 0.6) {
      blockers.push('大周期（MN/W1/D1 ' + htfScore.toFixed(2) + '）与小周期（H1 以下 ' + ltfScore.toFixed(2) + '）方向相反，等同步再进');
    }
    if (plan.dir !== 0 && bias.alignment > 0 && bias.alignment < 0.4) {
      blockers.push('9 个周期只有 ' + bias.aligned + ' 个同向（一致性 ' + Math.round(bias.alignment * 100) + '%），方向不统一');
    }
    if (plan.entry && plan.stop) {
      const risk = Math.abs(plan.entry - plan.stop);
      if (risk > cfg.maxStopAtr * atr) blockers.push('止损距离 ' + risk.toFixed(2) + ' = ' + (risk / atr).toFixed(2) + '×ATR，超过上限 ' + cfg.maxStopAtr + '×ATR');
      if (plan.rr && plan.rr < cfg.minRr) blockers.push('TP2 盈亏比 ' + plan.rr.toFixed(2) + 'R 低于最低 ' + cfg.minRr + 'R');
      const over = Math.abs(price - h1.ema20) / atr;
      if (over > 2.5) blockers.push('价格偏离 EMA20 ' + over.toFixed(2) + '×ATR，追单性价比低，等回踩');
      if (plan.dir === 1 && levels.near.resistance.length) {
        const z = levels.near.resistance[0];
        if (z.lo - plan.entry < 0.48 * atr) blockers.push('入场价距上方阻力 ' + fmtPrice(z.lo) + ' 仅 ' + (z.lo - plan.entry).toFixed(2) + '（' + ((z.lo - plan.entry) / atr).toFixed(2) + '×ATR），空间不足');
      }
      if (plan.dir === -1 && levels.near.support.length) {
        const z = levels.near.support[0];
        if (plan.entry - z.hi < 0.48 * atr) blockers.push('入场价距下方支撑 ' + fmtPrice(z.hi) + ' 仅 ' + (plan.entry - z.hi).toFixed(2) + '（' + ((plan.entry - z.hi) / atr).toFixed(2) + '×ATR），空间不足');
      }
    }
    if (!dataOk) blockers.push('实时报价缺失或滞后，等数据恢复再执行');
    const atrRank = pctRank(h1.bars.map((b) => b.atr));
    if (atrRank < 8) blockers.push('ATR 处于近 100 根的第 ' + atrRank.toFixed(0) + ' 百分位，波动率过低');

    let action;
    if (plan.status === 'WAIT' || !plan.entry) action = 'WAIT';
    else if (blockers.length) action = 'WAIT';
    else if (plan.status === 'PENDING') action = plan.dir === 1 ? 'LIMIT_BUY' : 'LIMIT_SELL';
    else if (plan.triggered) action = plan.dir === 1 ? 'BUY' : 'SELL';
    else action = 'WAIT';

    const grade = confidence >= 78 ? 'A' : confidence >= 62 ? 'B' : confidence >= 45 ? 'C' : 'D';
    const actionCn = { BUY: '现价做多', SELL: '现价做空', LIMIT_BUY: '挂单做多', LIMIT_SELL: '挂单做空', WAIT: '观望' }[action];
    const narrative = buildNarrative(bias, plan, targets, h1, price, action, blockers);
    const barHours = { '15m': 0.25, '1h': 1, '4h': 4, '1d': 24 }[cfg.tf] || 1;

    const management = [];
    if (targets.length) {
      management.push(
        'TP1 ' + fmtPrice(targets[0].price) + '（' + targets[0].r.toFixed(2) + 'R）平 40%，止损移到入场 ' + fmtPrice(plan.entry),
        'TP2 ' + fmtPrice(targets[1].price) + '（' + targets[1].r.toFixed(2) + 'R）再平 35%，剩余仓位用 1.5×ATR 跟踪',
        'TP3 ' + fmtPrice(targets[2].price) + '（' + targets[2].r.toFixed(2) + 'R）清仓或留给 D1 结构',
        '时间止损：' + cfg.tf + ' 连续 12 根未走出 1R 则离场（约 ' + (12 * barHours) + ' 小时）'
      );
    }
    const invalidation = plan.stop
      ? 'H1 收盘价' + (plan.dir === 1 ? '跌破' : '站上') + ' ' + fmtPrice(plan.stop) + ' 则结构失效，立即离场；反手需等 D1 结构同步转向。'
      : '';
    const scenarios = buildScenarios(plan, levels, h1, plan.dir);
    const size = plan.entry && plan.stop ? positionSize(cfg, plan.entry, plan.stop) : null;
    const dayOpen = levels.dayOpen;
    const change = dayOpen ? price - dayOpen : null;

    const now = Date.now();
    const cancelIf = [];
    if (plan.entry && plan.stop && plan.status === 'PENDING' && targets.length) {
      const validAt = new Date(now + 8 * barHours * 3600 * 1000);
      cancelIf.push('价格先触及 TP1 ' + fmtPrice(targets[0].price) + '：行情已经走了，不追单');
      cancelIf.push('H1 收盘' + (plan.dir === 1 ? '跌破' : '站上') + ' ' + fmtPrice(plan.stop) + '：结构破坏');
      cancelIf.push('有效至 ' + fmtTs(validAt.getTime()) + '，未成交就删单');
    }
    let ticket = null, mt5 = null;
    if (plan.entry && plan.stop && targets.length && size) {
      const side = (plan.dir === 1 ? 'BUY' : 'SELL') + (plan.status === 'PENDING' ? ' LIMIT' : ' MARKET');
      const valid = new Date(now + 8 * barHours * 3600 * 1000);
      ticket = {
        side, entry: plan.entry, stop: plan.stop,
        tp1: targets[0].price, tp2: targets[1].price, tp3: targets[2].price,
        lots: size.lots, valid_until: fmtTs(valid.getTime()),
        text: side + ' ' + plan.entry.toFixed(2) + ' | SL ' + plan.stop.toFixed(2) + ' | TP ' + targets[0].price.toFixed(2) + ' / ' + targets[1].price.toFixed(2) + ' / ' + targets[2].price.toFixed(2) + ' | ' + size.lots + ' 手 | 有效至 ' + fmtTs(valid.getTime()),
      };
      const pending = plan.status === 'PENDING';
      const orderType = (plan.dir === 1 ? 'BUY' : 'SELL') + (pending ? '_LIMIT' : '');
      mt5 = {
        symbol: cfg.symbol, type: orderType, volume: size.lots,
        price: r2(plan.entry), sl: r2(plan.stop), tp: targets[0].price,
        tp2: targets[1].price, tp3: targets[2].price,
        deviation: cfg.deviation, magic: cfg.magic, comment: 'GOLDSPOT', pending,
        steps: [
          'MT5 → 品种 ' + cfg.symbol + ' → 右键“新订单”',
          '类型：' + (orderType === 'BUY_LIMIT' ? '买入限价 Buy Limit' : orderType === 'SELL_LIMIT' ? '卖出限价 Sell Limit' : plan.dir === 1 ? '市价买入' : '市价卖出') + '，手数 ' + size.lots + '，价格 ' + plan.entry.toFixed(2),
