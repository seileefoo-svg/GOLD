const CACHE_KEY = 'gold-last-payload-v2';

function readCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function writeCache(p) {
  try {
    const slim = Object.assign({}, p);
    slim.charts = p.charts && p.charts['1h'] ? { '1h': p.charts['1h'] } : null;
    localStorage.setItem(CACHE_KEY, JSON.stringify(slim));
  } catch (e) { /* quota */ }
}

const fmt2 = (x) => (x === null || x === undefined || Number.isNaN(Number(x)))
  ? '--' : Number(x).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtN = (x, d = 0) => (x === null || x === undefined)
  ? '--' : Number(x).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = (s) => String(s === null || s === undefined ? '' : s)
  .replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const fmtTime = (t) => new Date(t).toLocaleTimeString('zh-CN',
  { timeZone: 'Asia/Kuala_Lumpur', hour: '2-digit', minute: '2-digit', hour12: false });
const axisFmt = new Intl.DateTimeFormat('en-GB', {
  timeZone: 'Asia/Kuala_Lumpur', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false,
});
const fmtAxis = (t) => {
  const parts = Object.fromEntries(axisFmt.formatToParts(new Date(t)).map((x) => [x.type, x.value]));
  return parts.month + '-' + parts.day + ' ' + parts.hour + ':' + parts.minute;
};
const fmtDT = (t) => new Date(t).toLocaleString('zh-CN',
  { timeZone: 'Asia/Kuala_Lumpur', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });

const ACTION_CLASS = { BUY: 'buy', SELL: 'sell', LIMIT_BUY: 'limit', LIMIT_SELL: 'limit', WAIT: 'wait' };
const STATUS_CN = { READY: '可执行', PENDING: '等价格到位', WAIT: '不成立' };

function showError(msg) {
  const el = $('error');
  el.textContent = '数据加载失败：' + msg;
  el.classList.remove('hidden');
  $('live-dot').className = 'dot down';
}
function hideError() { $('error').classList.add('hidden'); }

function apiUrl(force) {
  const src = new URLSearchParams(window.location.search);
  const q = new URLSearchParams();
  if (src.get('account')) q.set('account', src.get('account'));
  if (src.get('risk')) q.set('risk', src.get('risk'));
  if (force) q.set('force', '1');
  const s = q.toString();
  return '/api/plan' + (s ? '?' + s : '');
}

const SETTINGS_KEY = 'gold-settings-v1';

function readSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); } catch (e) { return {}; }
}
function writeSettings(obj) {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(obj)); } catch (e) { /* ignore */ }
}
function engineCfg() {
  const s = readSettings();
  const q = new URLSearchParams(window.location.search);
  return {
    account: Number(q.get('account') || s.account) || 10000,
    riskPct: Number(q.get('risk') || s.risk) || 0.5,
    minRr: 1.5, maxStopAtr: 2.4, tf: '1h',
    symbol: s.symbol || 'XAUUSD',
    magic: 20261124, deviation: 30, chartBars: 180,
    offset: Number(s.offset) || 0,
    dataSource: s.source || 'paxg',
    align: s.align || 'tv',
    apiKey: s.apiKey || '',
    dataSymbol: 'PAXGUSDT',
  };
}

async function load(force) {
  if (S.loading) return;
  S.loading = true;
  try {
    const cfg = engineCfg();
    const bundle = await GoldData.loadMarket(cfg);
    const p = GoldEngine.analyze(bundle, cfg);
    p.macro = GoldMacro.derive(bundle);
    S.p = p;
    S.offline = false;
    S.lastLoad = Date.now();
    render(p);
    writeCache(p);
    hideError();
    S.left = REFRESH_SEC;
  } catch (e) {
    S.offline = true;
    if (S.p) {
      updateClock();
      $('live-dot').className = 'dot stale';
    } else {
      showError(e.message || String(e));
    }
    S.left = 20;
  } finally {
    S.loading = false;
    updateClock();
  }
}

function actionClass(a) { return ACTION_CLASS[a] || 'wait'; }

function applyStaticLang() {
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const k = el.getAttribute('data-i18n');
    if (LANG === 'en') {
      if (!el.getAttribute('data-zh')) el.setAttribute('data-zh', el.textContent);
      el.textContent = STATIC_EN[k] || el.textContent;
    } else if (el.getAttribute('data-zh')) {
      el.textContent = el.getAttribute('data-zh');
    }
  });
  const b = document.getElementById('btn-lang');
  if (b) b.textContent = LANG === 'en' ? '中文' : 'EN';
}

function mt5Cell(k, v) {

function renderEn(p) {
  applyStaticLang();
  const m = p.market, v = p.verdict, s = p.setup, r = p.risk, b = p.bias;
  const num = (x, d = 2) => (x === null || x === undefined ? '--' : Number(x).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }));

  const priceEl = $('price');
  priceEl.textContent = num(m.price);
  priceEl.className = 'price ' + ((m.change || 0) >= 0 ? 'up' : 'down');
  $('quote-sub').textContent = 'Bid ' + num(m.bid) + ' / Ask ' + num(m.ask) + ' · Spread ' +
    (m.spread == null ? '--' : String(m.spread)) + ' · ' + (EN.session[m.session] || m.session) +
    ' · Today ' + (m.change >= 0 ? '+' : '') + num(m.change) + ' (' + (m.change_pct >= 0 ? '+' : '') + num(m.change_pct) + '%)';
  $('live-dot').className = 'dot' + (p.data.stale ? ' stale' : '');

  const color = conf >= 78 ? '#0e9f6e' : conf >= 62 ? '#b07d12' : conf >= 45 ? '#d97706' : '#667085';
  const R = 52, C = 2 * Math.PI * R;
  const dirWord = s.dir === 1 ? 'long' : s.dir === -1 ? 'short' : 'neutral';
  const summary = (EN.bias[b.label] || b.label) + ' across ' + b.rows.length + ' timeframes (score ' +
    (b.score >= 0 ? '+' : '') + b.score.toFixed(2) + '), H1 at ' + num(m.price) + ', ATR ' + num(m.atr) + '. ' +
    (s.entry
      ? (v.action === 'WAIT' ? 'Setup on hold' : (v.action.indexOf('LIMIT') === 0 ? 'Pending limit' : 'Market')) +
        ' ' + dirWord + ': entry ' + num(s.entry) + ' (zone ' + num(s.entry_zone[0]) + '-' + num(s.entry_zone[1]) + '), stop ' +
        num(s.stop) + ' (' + (Math.abs(s.entry - s.stop) / m.atr).toFixed(2) + 'xATR), targets ' +

  $('hero').innerHTML =
    '<div class="badge ' + actionClass(v.action) + '">' + (EN.action[v.action] || v.action) + '</div>' +

        '<span class="tag">TP2 ' + Number(r.rr || 0).toFixed(2) + 'R</span>' +
        '<span class="tag">ATR ' + num(m.atr) + '</span>' +
        '<span class="tag">' + b.counts.long + ' bull / ' + b.counts.short + ' bear</span>' +

      '<circle class="ring-fg" cx="60" cy="60" r="' + R + '" stroke="' + color + '" stroke-dasharray="' + C +

      '<div class="gauge-label">confidence ' + conf + '/100 · ' + v.grade + '</div></div>';

  const box = $('plan');

    html += '<div class="plan-row"><div><div class="k">Stop</div><div class="why">' +

  if (mg) {

  if (scb) {

    scb.innerHTML = '<div class="scen">' +
      '<div><b>Bull</b> break above ' + (res ? num(res.lo) : '--') + ' → continuation higher</div>' +
      '<div><b>Bear</b> break below ' + (sup ? num(sup.hi) : '--') + ' → continuation lower</div>' +
      '<div><b>Range</b> stay between ' + (sup ? num(sup.hi) : '--') + ' and ' + (res ? num(res.lo) : '--') + '</div></div>';
  }

  const fb = $('foot');
  if (fb) {
    fb.innerHTML = '<span class="src">Data ' + esc(p.data.source || '') + ' · MT5 offset ' +
      (p.data.basis >= 0 ? '+' : '') + Number(p.data.basis || 0).toFixed(2) + ' · last bar ' + esc(p.data.last_ts) +
      ' · generated ' + esc(p.generated_local) + ' MYT</span><br>Rule-based technical analysis, not investment advice.';
  }
}

function render(p) {
  if (LANG === 'en') { renderEn(p); renderMacro(p); renderDisclaimer(); updateStatus(); drawChart(); return; }
  applyStaticLang();

  renderHeader(p);
  renderHero(p);
  renderTfTabs(p);
  renderPlan(p);
  renderSides(p);
  renderMtf(p);
  renderPro(p);
  renderMacro(p);
  renderEvidence(p);
  renderLevels(p);
  renderManage(p);
  renderScenarios(p);
  renderFoot(p);
  renderDisclaimer();
  updateStatus();
  drawChart();
}

function renderHeader(p) {
  const m = p.market;
  const priceEl = $('price');
  priceEl.textContent = fmt2(m.price);
  priceEl.className = 'price ' + ((m.change || 0) >= 0 ? 'up' : 'down');
  const chg = (m.change >= 0 ? '+' : '') + fmt2(m.change) + ' (' + (m.change_pct >= 0 ? '+' : '') + Number(m.change_pct).toFixed(2) + '%)';
  $('quote-sub').textContent = '买 ' + fmt2(m.bid) + ' / 卖 ' + fmt2(m.ask) + ' · 点差 ' +
    (m.spread == null ? '--' : Number(m.spread).toFixed(2)) + ' · ' + m.session + ' · 今日 ' + chg;
  $('live-dot').className = 'dot' + (p.data.stale ? ' stale' : '');
}

function updateClock() {
  if (!S.p) return;
  const head = S.offline ? '离线 · 缓存快照\n' : '';
  const live = LANG === 'en' ? 'live 1s' : '实时 1s';
  const full = LANG === 'en' ? 'recalc ' : '重算 ';
  $('clock').textContent = head + S.p.generated_local + ' MYT\n' + live + ' · ' + full + Math.max(0, S.left) + 's';
  updateStatus();
}

function renderHero(p) {
  const v = p.verdict, m = p.market, s = p.setup;
  const conf = Math.round(v.confidence);
  const color = conf >= 78 ? '#0e9f6e' : conf >= 62 ? '#b07d12' : conf >= 45 ? '#d97706' : '#667085';
  const R = 52, C = 2 * Math.PI * R;
  const tags = [
    s.type ? '策略 ' + s.type : '',
    '状态 ' + (STATUS_CN[s.status] || s.status),
    'TP2 ' + Number(p.risk.rr || 0).toFixed(2) + 'R',
    'ATR ' + fmt2(m.atr) + ' (' + Number(m.atr_pct).toFixed(2) + '%)',
    p.bias ? '周期 ' + p.bias.counts.long + '多/' + p.bias.counts.short + '空' : '',
    p.bias ? '一致性 ' + Math.round((p.bias.alignment || 0) * 100) + '%' : '',
  ].filter(Boolean);
  const blockers = (v.blockers || []).map((b) => '<div class="blocker">⛔ ' + esc(b) + '</div>').join('');
  const b = p.bias || { score: 0, alignment: 0, label: '中性' };
  const trendCls = b.score <= -0.35 ? 'bear' : b.score >= 0.35 ? 'bull' : 'flat';
  const trendTxt = '趋势 ' + esc(b.label || '中性') + ' · 加权 ' + (b.score >= 0 ? '+' : '') + Number(b.score || 0).toFixed(2) +
    ' · 一致性 ' + Math.round((b.alignment || 0) * 100) + '%';
  $('hero').innerHTML =
    '<div class="badge ' + actionClass(v.action) + '">' + esc(v.label) + '</div>' +
    '<div class="hero-mid">' +
      '<div class="trend-line ' + trendCls + '">' + trendTxt + '</div>' +
      '<div class="summary">' + esc(v.summary) + '</div>' +
      '<div class="tags">' + tags.map((t) => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' +
      (blockers ? '<div class="blockers">' + blockers + '</div>' : '') +
    '</div>' +
    '<div class="gauge">' +
      '<div class="ring">' +
        '<svg width="112" height="112" viewBox="0 0 120 120">' +
          '<circle class="ring-bg" cx="60" cy="60" r="' + R + '"></circle>' +
          '<circle class="ring-fg" cx="60" cy="60" r="' + R + '" stroke="' + color + '" ' +
            'stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - conf / 100)) + '"></circle>' +
        '</svg>' +
        '<div class="num">' + conf + '</div>' +
      '</div>' +
      '<div class="gauge-label">信心 ' + conf + '/100 · ' + esc(v.grade) + '</div>' +
    '</div>';
}

function updateStatus() {
  const el = $('status-strip');
  if (!el || !S.p) return;
  const en = LANG === 'en';
  const age = S.lastTick ? Math.round((Date.now() - S.lastTick) / 1000) : null;
  const t = new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Kuala_Lumpur' });
  let cls = 'ok', txt;
  if (S.offline) {
    cls = 'bad';
    txt = (en ? 'Disconnected · showing cached snapshot ' : '断线 · 显示缓存快照 ') + (S.p.generated_local || '');
  } else if (age !== null && age > 30) {
    cls = 'warn';
    txt = (en ? 'Delayed · last tick ' + age + 's ago' : '延迟 · 上次报价 ' + age + ' 秒前');
  } else {
    txt = (en ? 'Live · quote Binance PAXG aligned to TradingView OANDA · tick ' : '实时 · 报价 Binance PAXG → 对齐 TradingView OANDA · 更新 ') +
      t + ' · ' + (en ? 'bar ' : 'K线 ') + (S.p.data.last_ts || '--');
  }
  el.className = 'status-strip ' + cls;
  el.textContent = txt;
}

function renderDisclaimer() {
  const el = $('disclaimer');
  if (!el) return;
  el.textContent = LANG === 'en'
    ? 'Rule-based technical analysis, for reference only — not investment advice. Always check prices with your broker before trading.'
    : '规则化技术分析，仅供参考，不构成投资建议；下单前请以你券商的实际报价为准。';
}

function renderTfTabs(p) {
  const box = $('tf-tabs');
  if (!box) return;
  const keys = TF_ORDER.filter((k) => p.charts && p.charts[k]);
  if (keys.length && !p.charts[S.chartTf]) S.chartTf = keys.indexOf('1h') >= 0 ? '1h' : keys[0];
  box.innerHTML = keys.map((k) =>
    '<button class="tf-tab' + (k === S.chartTf ? ' active' : '') + '" data-tf="' + k + '">' + TF_LABEL[k] + '</button>'
  ).join('');
}

function shortStruct(s) {
  if (!s) return '-';
  if (s.indexOf('上升') >= 0) return 'HH+HL';
  if (s.indexOf('下降') >= 0) return 'LH+LL';
  if (s.indexOf('扩张') >= 0) return '扩张';
  if (s.indexOf('偏多') >= 0) return '偏多';
  if (s.indexOf('偏空') >= 0) return '偏空';
  return '区间';
}

function renderMtf(p) {
  const box = $('mtf');
  if (!box || !p.bias || !p.bias.rows) return;
  const rows = p.bias.rows;
  const c = p.bias.counts;
  const head = '多 ' + c.long + ' / 空 ' + c.short + ' / 中性 ' + c.neutral +
    ' · 一致性 ' + Math.round((p.bias.alignment || 0) * 100) + '% · 加权 ' +
    (p.bias.score >= 0 ? '+' : '') + p.bias.score.toFixed(2);
  const sum = $('mtf-summary');
  if (sum) sum.textContent = head;

  const body = rows.map((r) => {
    const dirCls = r.score >= 0.5 ? 'up' : r.score <= -0.5 ? 'down' : 'flat';
    return '<tr>' +
      '<td class="tf">' + r.tf + '</td>' +
      '<td class="dir ' + dirCls + '">' + (r.score >= 0 ? '+' : '') + r.score.toFixed(1) + ' <span>' + r.label + '</span></td>' +
      '<td class="st">' + shortStruct(r.structure) + '</td>' +
      '<td class="num">' + r.rsi.toFixed(0) + '</td>' +
      '<td class="num">' + r.adx.toFixed(0) + '</td>' +
      '<td class="num">' + r.atr.toFixed(1) + '</td>' +
      '<td class="num">' + (r.emaLen || '—') + '</td>' +
      '</tr>';
  }).join('');
  box.innerHTML =
    '<div class="mtf-wrap"><table class="mtf-table">' +
    '<thead><tr><th>周期</th><th>方向</th><th>结构</th><th>RSI</th><th>ADX</th><th>ATR</th><th>长均线</th></tr></thead>' +
    '<tbody>' + body + '</tbody></table></div>' +
    '<div class="mtf-legend">HH+HL 上升结构 · LH+LL 下降结构 · 扩张 高低点同时外扩/内收 · 长均线 为该周期可用的最长 EMA（不足 200 根时退回 100/50）</div>';
}

function sideCell(k, v) {
  return '<div><i>' + k + '</i><b>' + v + '</b></div>';
}

function sideCard(s) {
  if (!s) return '<div class="side empty">该方向暂无方案</div>';
  const st = s.status === 'READY' ? '可执行' : s.status === 'PENDING' ? '挂单等' : s.status === 'WAIT' ? '等待' : s.status;
  const tp = (i) => (s.targets[i] ? fmt2(s.targets[i].price) : '--');
  return '<div class="side ' + (s.dir === 1 ? 'buy' : 'sell') + (s.aligned ? ' aligned' : '') + '">' +
    '<div class="side-h">' +
      '<span class="side-t">' + (s.dir === 1 ? '做多 BUY' : '做空 SELL') + '</span>' +
      '<span class="tag ' + (s.aligned ? 'hot' : '') + '">' + (s.aligned ? '顺势' : '逆势') + '</span>' +
      '<span class="ord">' + (s.order === 'limit' ? '限价' : '市价') + ' · ' + st + '</span>' +
    '</div>' +
    '<div class="side-grid">' +
      sideCell('入场', fmt2(s.entry)) + sideCell('止损', fmt2(s.stop)) +
      sideCell('TP1', tp(0)) + sideCell('TP2', tp(1)) + sideCell('TP3', tp(2)) +
      sideCell('盈亏比', Number(s.rr || 0).toFixed(2) + 'R') +
    '</div>' +
    '<div class="side-foot">' + (s.size ? s.size.lots : '--') + ' 手 · MT5 ' + s.mt5type +
      ' · 备选 ' + String(s.alt.type).replace('_', ' ') + ' ' + fmt2(s.alt.price) + '</div>' +
    '<div class="side-note">' + esc(s.alt.note) + '</div>' +
    '</div>';
}

function buildRisks(p) {
  const out = [];
  const m = p.market || {}, b = p.bias || {}, r = p.risk || {};
  if (p.macro && p.macro.risk) out.push('数据风险：' + p.macro.risk.title + ' 在 2 小时内公布');
  if ((b.alignment || 0) < 0.6) out.push('方向一致性只有 ' + Math.round((b.alignment || 0) * 100) + '%，9 个周期没有同向');
  if (m.atr_rank != null && m.atr_rank < 15) out.push('波动率偏低（ATR 第 ' + m.atr_rank + ' 百分位），突破容易假');
  if (m.atr_rank != null && m.atr_rank > 90) out.push('波动率偏高（ATR 第 ' + m.atr_rank + ' 百分位），止损容易被扫');
  if (r.rr && r.rr < 2) out.push('盈亏比 ' + Number(r.rr).toFixed(2) + 'R 偏低');
  if (p.verdict && p.verdict.blockers && p.verdict.blockers.length) {
    p.verdict.blockers.slice(0, 2).forEach((b) => out.push('执行限制：' + b));
  }
  return out.slice(0, 4);
}

function renderSides(p) {
  const box = $('sides');
  if (!box || !p.sides) return;
  const parts = [];
  ['short', 'long'].forEach((k) => {
    const m = p.sides[k];
    if (!m) return;
    parts.push('<div class="sides-block"><div class="sides-title">' + m.label + ' · ' + m.tf +
      '<span>' + (m.buy && m.buy.aligned ? '偏多' : m.sell && m.sell.aligned ? '偏空' : '中性') + '</span></div>' +
      sideCard(m.buy) + sideCard(m.sell) + '</div>');
  });
  box.innerHTML = '<div class="sides-note">同一时间只执行一笔：与趋势同向的是主方案，逆向的只是备选</div>' + parts.join('');
  const sum = $('sides-summary');
  if (sum) {
    const bits = [];
    ['short', 'long'].forEach((k) => {
      const m = p.sides[k];
      if (!m) return;
      const side = m.buy && m.buy.aligned ? '做多' : m.sell && m.sell.aligned ? '做空' : '中性';
      bits.push(m.label + ' ' + m.tf + ' ' + side);
    });
    sum.textContent = bits.join(' · ');
  }
}

function renderPro(p) {
  const box = $('pro');
  if (!box || !p.pro) return;
  const rows = p.pro.items.map((it) => {
    const cls = it.dir === 1 ? 'up' : it.dir === -1 ? 'down' : 'flat';
    return '<div class="pro-row ' + cls + '">' +
      '<div class="pro-k">' + esc(it.title) + '<span>' + esc(it.key) + '</span></div>' +
      '<div class="pro-v">' + esc(it.value) + '</div>' +
      '<div class="pro-d">' + esc(it.detail) + '</div>' +
      '</div>';
  }).join('');
  const gl = p.pro.glossary.map((g) => '<div class="gl-row"><b>' + esc(g.t) + '</b><span>' + esc(g.d) + '</span></div>').join('');
  box.innerHTML = rows + '<details class="gloss"><summary>术语解释：BOS / CHoCH / OB / FVG / 溢价折价 / 流动性</summary>' + gl + '</details>';
  const sum = $('pro-summary');
  if (sum) sum.textContent = p.pro.summary + ' · H4 ' + p.pro.h4Trend;
}

function renderMacro(p) {
  const box = $('macro');
  if (!box) return;
  const m = p.macro || {};
  const en = LANG === 'en';
  const fmtChg = (x) => (x >= 0 ? '+' : '') + Number(x).toFixed(2) + '%';
  const quote = (label, q, digits) => {
    if (!q) return '<div class="macro-q"><span>' + label + '</span><b>--</b></div>';
    const cls = q.change >= 0 ? 'up' : 'down';
    return '<div class="macro-q"><span>' + label + '</span><b>' + Number(q.price).toFixed(digits) +
      '</b><i class="' + cls + '">' + fmtChg(q.change) + '</i></div>';
  };
  const clock = (t) => {
    const d = new Date(t);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  };
  const countdown = (mins) => {
    if (mins <= 0) return en ? 'released' : '已公布';
    if (mins < 60) return en ? 'in ' + mins + 'm' : '+' + mins + ' 分';
    return en ? 'in ' + Math.round(mins / 60) + 'h' : '+' + Math.round(mins / 60) + ' 小时';
  };
  const events = (m.events || []).map((e) => {
    const cls = e.imp === 1 ? 'high' : 'mid';
    const extra = (e.forecast != null || e.previous != null)
      ? '<span class="fc">' + (en ? 'fc ' : '预期 ') + (e.forecast == null ? '--' : e.forecast) +
        ' · ' + (en ? 'prev ' : '前值 ') + (e.previous == null ? '--' : e.previous) + '</span>'
      : '';
    return '<div class="macro-ev ' + cls + '"><span class="imp"></span><span class="tm">' + clock(e.t) + '</span>' +
      '<span class="nm">' + esc(e.title) + '<em>' + esc(e.country) + '</em>' + extra + '</span>' +
      '<span class="cd">' + countdown(e.mins) + '</span></div>';
  }).join('');
  const risk = m.risk
    ? '<div class="macro-risk">⚠ ' + (en ? 'High-impact event in ' + Math.round(m.risk.mins) + ' min: '
      : '两小时内有重磅数据：') + esc(m.risk.title) + '（' + clock(m.risk.t) + '）</div>'
    : '';
  box.innerHTML = '<div class="macro-quotes">' + quote('DXY', m.dxy, 3) + quote('US10Y', m.us10y, 3) + '</div>' +
    risk + (events || '<div class="mini">' + (en ? 'no events in the window' : '暂无数据') + '</div>');
  const sum = $('macro-summary');
  if (sum) {
    const hi = (m.events || []).filter((e) => e.imp === 1).length;
    sum.textContent = en ? hi + ' high-impact upcoming' : '待公布高影响 ' + hi + ' 项';
  }
}

function planRow(k, cls, val, sub) {
  return '<div class="plan-row"><div><div class="k">' + k + '</div>' +
    (sub ? '<div class="why">' + esc(sub) + '</div>' : '') + '</div>' +
    '<div class="v ' + cls + '">' + val + '</div></div>';
}

function renderPlan(p) {
  const s = p.setup, r = p.risk, m = p.market;
  const box = $('plan');
  if (!s.entry || !s.stop) {
    box.innerHTML = '<div class="empty-note">当前没有可执行的入场结构。<br><br>' + esc(s.trigger || '') + '</div>';
    return;
  }
  const zone = s.entry_zone ? '区间 ' + fmt2(s.entry_zone[0]) + ' – ' + fmt2(s.entry_zone[1]) : '';
  const order = s.order === 'limit' ? '限价' : '市价';
  let html = '';
  html += planRow('入场 · ' + order, 'entry', fmt2(s.entry), zone);
  html += planRow('止损', 'stop', fmt2(s.stop), s.stop_reason);
  (r.targets || []).forEach((t, i) => {
    html += planRow('TP' + (i + 1) + ' · 平 ' + t.close_pct + '%', 'tp',
      fmt2(t.price) + '<span class="v r">' + Number(t.r).toFixed(2) + 'R</span>', t.reason);
  });

  if (p.verdict.action === 'WAIT' && p.verdict.blockers && p.verdict.blockers.length) {
    html = '<div class="plan-blocked">⛔ 暂不可执行：' + esc(p.verdict.blockers[0]) + '</div>' + html;
  }
  const z = r.size || {};
  html += '<div class="size-box">' +
    '<div><div class="k">手数</div><div class="v">' + (z.lots == null ? '--' : z.lots) + ' 手</div></div>' +
    '<div><div class="k">风险 / 账户</div><div class="v">$' + fmtN(z.actual_risk, 0) + ' / ' + fmtN(z.account, 0) + '</div></div>' +
    '<div><div class="k">名义价值</div><div class="v">$' + fmtN(z.notional, 0) + '</div></div>' +
    '<div><div class="k">盈亏比</div><div class="v">' + Number(r.rr).toFixed(2) + 'R</div></div>' +
    '</div>';
  if (z.warning) html += '<div class="warn">⚠ ' + esc(z.warning) + '</div>';
  if (r.breakeven_winrate) {
    html += '<div class="mini plan-ev">不亏所需胜率 <b>' + r.breakeven_winrate + '%</b>（按 TP2 ' +
      Number(r.rr).toFixed(2) + 'R 反推）</div>';
  }
  if (p.setup.cancel_if && p.setup.cancel_if.length) {
    html += '<div class="plan-cancel"><div class="k">撤单 / 失效条件</div><ul>' +
      p.setup.cancel_if.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
  }
  const risks = buildRisks(p);
  if (risks.length) {
    html += '<div class="plan-risks"><div class="k">潜在风险</div><ul>' + risks.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
  }
  if (p.macro && p.macro.risk) {
    const ev = p.macro.risk;
    html += '<div class="warn">⚠ 数据风险：' + esc(ev.title) + '（' + new Date(ev.t).toLocaleTimeString('en-GB', { timeZone: 'Asia/Kuala_Lumpur' }).slice(0, 5) +
      '）：数据前减半仓或把止损移到成本</div>';
  }
  if (p.mt5) {
    const m = p.mt5;
    const TYPE_CN = { BUY_LIMIT: 'Buy Limit 买入限价', SELL_LIMIT: 'Sell Limit 卖出限价', BUY: 'Buy 市价买入', SELL: 'Sell 市价卖出' };
    const line = m.type + ' ' + m.symbol + ' ' + Number(m.volume).toFixed(2) + ' @ ' + fmt2(m.price) +
      ' SL ' + fmt2(m.sl) + ' TP ' + fmt2(m.tp);
    const row = (k, v) => '<div><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
    html += '<div class="mt5">' +
      '<div class="mt5-head"><span>MT5 下单</span><em>' + esc(m.symbol) + '</em>' +
        '<button data-copy="mt5-line">复制参数</button></div>' +
      '<div class="mt5-grid">' +
        row('类型', esc(TYPE_CN[m.type] || m.type)) +
        row('手数', Number(m.volume).toFixed(2)) +
        row('价格', fmt2(m.price)) +
        row('止损', fmt2(m.sl)) +
        row('止盈 TP1', fmt2(m.tp)) +
        row('滑点', m.deviation + ' 点') +
      '</div>' +
      '<div class="mt5-line" id="mt5-line">' + esc(line) + '</div>' +
      '<ol class="mt5-steps">' + (m.steps || []).map((s) => '<li>' + esc(s) + '</li>').join('') + '</ol>' +
      '</div>';
  }
  if (s.trigger_note) html += '<div class="warn">触发确认：' + esc(s.trigger_note) + '</div>';
  box.innerHTML = html;
}

function renderEvidence(p) {
  const rows = p.evidence || [];
  let total = 0;
  const body = rows.map((e) => {
    total += e.points;
    const w = Math.max(0, Math.min(100, (e.points / e.max) * 100));
    return '<tr>' +
      '<td class="grp">' + esc(e.group) + '</td>' +
      '<td class="item"><span class="mark ' + (e.pass ? 'ok' : 'no') + '">' + (e.pass ? '✓' : '·') + '</span>' + esc(e.item) + '</td>' +
      '<td class="detail">' + esc(e.detail) + '<div class="bar"><i style="width:' + w + '%"></i></div></td>' +
      '<td class="score">' + Number(e.points).toFixed(1) + '<span style="color:#667085">/' + e.max + '</span></td>' +
      '</tr>';
  }).join('');
  $('evidence').innerHTML =
    '<table><thead><tr><th>组</th><th>检查项</th><th>明细</th><th style="text-align:right">得分</th></tr></thead>' +
    '<tbody>' + body + '</tbody></table>';
  $('score-total').textContent = '合计 ' + total.toFixed(0) + ' / 100';
}

function renderLevels(p) {
  const lv = p.levels || {};
  const res = (lv.resistance || []).map((z) =>

/* ---------------------------------------------------------------- chart */
function drawChart() {
  const c = $('chart');
  const p = S.p;
  if (!c || !p) return;
  const ch = (p.charts && p.charts[S.chartTf]) || p.chart;
  if (!ch) return;
  const rect = c.getBoundingClientRect();
  const W = Math.max(320, Math.round(rect.width));
  const H = Math.max(280, Math.round(rect.height));
  const dpr = window.devicePixelRatio || 1;
  c.width = W * dpr;
  c.height = H * dpr;
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const all = ch.candles || [];
  if (!all.length) return;

  // visible window: user can drag back through history and pinch to zoom
  const total = all.length;
  const maxCount = Math.min(total, 1200);
  let count = Math.min(Math.max(S.view.count, 20), maxCount);
  let offset = Math.min(Math.max(S.view.offset, 0), Math.max(0, total - count));
  S.view.count = count;
  S.view.offset = offset;
  const startI = total - count - offset;
  const bars = all.slice(startI, startI + count);
  const ema20 = (ch.ema20 || []).slice(startI, startI + count);
  const ema50 = (ch.ema50 || []).slice(startI, startI + count);
  const swingPts = (ch.swings || [])
    .filter((s) => s.i >= startI && s.i < startI + count)
    .map((s) => ({ t: s.t, i: s.i - startI, price: s.price, kind: s.kind }));
  const rb = $('chart-reset');
  if (rb) rb.classList.toggle('hidden', offset === 0 && count === 120);
  const rangeEl = $('chart-range');
  if (rangeEl) {
    const d0 = new Date(bars[0].t), d1 = new Date(bars[bars.length - 1].t);
    const f = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    rangeEl.textContent = f(d0) + ' → ' + f(d1) + (LANG === 'en'
      ? '  (' + count + ' / ' + total + ' bars)'
      : '（' + count + ' 根 / 共 ' + total + '）');
  }
  const firstBtn = $('chart-first'), lastBtn = $('chart-last');
  if (firstBtn) firstBtn.disabled = offset >= total - count;
  if (lastBtn) lastBtn.disabled = offset === 0;

  const pad = { l: 8, r: 82, t: 14, b: 26 };
  const compact = W < 560;
  if (compact) pad.r = 62;
  const pw = W - pad.l - pad.r;
  const ph = H - pad.t - pad.b;
  const atr = ch.atr || 0;

  let lo = Infinity, hi = -Infinity;
  bars.forEach((b) => { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h); });
  const near = (v) => v != null && v > lo - 4 * atr && v < hi + 4 * atr;
  const extra = [];
  if (near(ch.price)) extra.push(ch.price);
  if (near(ch.plan.entry)) extra.push(ch.plan.entry);
  if (near(ch.plan.stop)) extra.push(ch.plan.stop);
  (ch.plan.targets || []).forEach((t) => { if (near(t)) extra.push(t); });
  (ch.zones || []).forEach((z) => { if (near(z.lo) || near(z.hi)) extra.push(z.lo, z.hi); });
  extra.forEach((v) => { lo = Math.min(lo, v); hi = Math.max(hi, v); });
  const padY = Math.max(atr * 0.5, (hi - lo) * 0.04);
  lo -= padY; hi += padY;
  const span = hi - lo || 1;
  const y = (v) => pad.t + ((hi - v) / span) * ph;
  const cw = pw / bars.length;
  const x = (i) => pad.l + (i + 0.5) * cw;
  S.geo = { pad, pw, ph, cw, bars, lo, hi, span, W, H, total, count, offset, startI };

  // grid + price axis
  g.font = (compact ? 9 : 10) + 'px ' + MONO;
  g.textBaseline = 'middle';
  for (let k = 0; k <= 5; k++) {
    const v = lo + (span * k) / 5;
    const yy = Math.round(y(v)) + 0.5;
    g.strokeStyle = '#eaecf0';
    g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(pad.l + pw, yy); g.stroke();
    g.fillStyle = '#667085';
    g.textAlign = 'left';
    g.fillText(fmt2(v), pad.l + pw + 8, yy);
  }

  // time axis: step from the real label width so nothing overlaps on a phone
  g.font = '9.5px ' + MONO;
  const spanMs = new Date(bars[bars.length - 1].t) - new Date(bars[0].t);
  const sample = spanMs > 45 * 864e5 ? '0000-00' : '0000-00 00:00';
  const labelW = g.measureText(sample).width + 26;
  const labelStep = Math.max(1, Math.ceil(labelW / cw));
  const pad2 = (n) => String(n).padStart(2, '0');
  const axisText = (t) => {
    const d = new Date(t);
    const Y = d.getFullYear(), M = pad2(d.getMonth() + 1), D = pad2(d.getDate());
    if (spanMs > 45 * 864e5) return Y + '-' + M;              // long range: year-month
    if (spanMs > 2 * 864e5) return M + '-' + D;               // weeks: month-day
    return M + '-' + D + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  };
  g.textAlign = 'center';
  let lastLabelX = -1e9;
  for (let i = 0; i < bars.length; i += labelStep) {
    const xx = Math.min(Math.max(x(i), pad.l + labelW / 2), pad.l + pw - labelW / 2);
    if (xx - lastLabelX < labelW) continue;
    lastLabelX = xx;
    g.strokeStyle = '#f2f4f7';
    g.beginPath(); g.moveTo(xx, pad.t); g.lineTo(xx, pad.t + ph); g.stroke();
    g.fillStyle = '#667085';
    g.fillText(axisText(bars[i].t), xx, H - 10);
  }

  // zones
  (ch.zones || []).forEach((z) => {
    if (z.hi < lo || z.lo > hi) return;
    const y1 = y(Math.min(z.hi, hi)), y2 = y(Math.max(z.lo, lo));
    g.fillStyle = 'rgba(176,125,18,0.05)';
    g.fillRect(pad.l, y1, pw, Math.max(1, y2 - y1));
    g.strokeStyle = 'rgba(176,125,18,0.22)';
    g.setLineDash([3, 4]);
    g.beginPath(); g.moveTo(pad.l, y1 + 0.5); g.lineTo(pad.l + pw, y1 + 0.5); g.stroke();
    g.beginPath(); g.moveTo(pad.l, y2 - 0.5); g.lineTo(pad.l + pw, y2 - 0.5); g.stroke();
    g.setLineDash([]);
  });

  // candles
  const bodyW = Math.max(1, Math.min(12, cw * 0.62));
  bars.forEach((b, i) => {
    const up = b.c >= b.o;
    const col = up ? '#0e9f6e' : '#e5484d';
    const xx = x(i);
    g.strokeStyle = col;
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(xx, y(b.h)); g.lineTo(xx, y(b.l)); g.stroke();
    const yo = y(b.o), yc = y(b.c);
    const top = Math.min(yo, yc);
    const hgt = Math.max(1, Math.abs(yc - yo));
    g.fillStyle = up ? 'rgba(14,159,110,0.9)' : 'rgba(229,72,77,0.9)';
    g.fillRect(xx - bodyW / 2, top, bodyW, hgt);
  });

  // EMAs
  const line = (arr, color, width) => {
    g.strokeStyle = color; g.lineWidth = width; g.beginPath();
    let started = false;
    arr.forEach((v, i) => {
      if (v == null || !isFinite(v)) return;
      const xx = x(i), yy = y(v);
      if (!started) { g.moveTo(xx, yy); started = true; } else g.lineTo(xx, yy);
    });
    g.stroke();
  };
  line(ema20, '#c9971a', 1.2);
  line(ema50, '#3b82f6', 1.2);

  // plan levels (labels are nudged apart so they stay readable on a phone)
  const pl = ch.plan || {};
  const planLines = [];
  if (pl.entry != null) planLines.push({ v: pl.entry, color: '#2563eb', text: 'E ' + fmt2(pl.entry), dash: [] });
  if (pl.stop != null) planLines.push({ v: pl.stop, color: '#e5484d', text: 'SL ' + fmt2(pl.stop), dash: [5, 4] });
  (pl.targets || []).forEach((t, i) => planLines.push({ v: t, color: '#0e9f6e', text: 'TP' + (i + 1) + ' ' + fmt2(t), dash: [2, 4] }));
  planLines.sort((a, b) => b.v - a.v);
  g.font = (compact ? 9 : 10) + 'px ' + MONO;
  g.textBaseline = 'middle';
  let lastLabelY = -99;
  planLines.forEach((L) => {
    if (L.v < lo || L.v > hi) return;
    const yl = Math.round(y(L.v)) + 0.5;
    g.strokeStyle = L.color;
    g.lineWidth = 1;
    g.setLineDash(L.dash);
    g.beginPath(); g.moveTo(pad.l, yl); g.lineTo(pad.l + pw, yl); g.stroke();
    g.setLineDash([]);
    const tw = g.measureText(L.text).width + 8;
    let ly = Math.max(yl, lastLabelY + 12);
    if (ly > pad.t + ph - 7) ly = pad.t + ph - 7;
    lastLabelY = ly;
    const bx = pad.l + pw - tw - 2;
    g.fillStyle = 'rgba(255,255,255,0.92)';
    g.fillRect(bx, ly - 7, tw, 14);
    g.strokeStyle = L.color;
    g.strokeRect(bx + 0.5, ly - 6.5, tw - 1, 13);
    g.fillStyle = L.color;
    g.textAlign = 'center';
    g.fillText(L.text, bx + tw / 2, ly);
    g.textAlign = 'left';
  });

  // current price (live spot, not the last bar close)
  const last = bars[bars.length - 1];
  const spot = (ch.price == null) ? last.c : ch.price;
  const yy = Math.round(y(spot)) + 0.5;
  g.strokeStyle = 'rgba(16,24,40,0.3)';
  g.setLineDash([1, 3]);
  g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(pad.l + pw, yy); g.stroke();
  g.setLineDash([]);
  if (!compact) {
    g.fillStyle = '#101828';
    g.fillRect(pad.l + pw, yy - 8, 74, 16);
    g.fillStyle = '#ffffff';
    g.font = 'bold 10px ' + MONO;
    g.textAlign = 'left';
    g.fillText(fmt2(spot), pad.l + pw + 5, yy);
  } else {
    g.fillStyle = '#101828';
    g.fillRect(pad.l + pw, yy - 7, pad.r - 2, 14);
    g.fillStyle = '#ffffff';
    g.font = 'bold 9px ' + MONO;
    g.textAlign = 'left';
    g.fillText(fmt2(spot), pad.l + pw + 4, yy);
  }

  // swings
  swingPts.forEach((s) => {
    const i = s.i;
    if (i == null || i < 0 || i >= bars.length) return;
    const xx = x(i);
    const sy = y(s.price) + (s.kind === 'H' ? -12 : 12);
    g.fillStyle = s.kind === 'H' ? 'rgba(229,72,77,0.9)' : 'rgba(14,159,110,0.9)';
    g.beginPath();
    g.arc(xx, sy, 2.4, 0, Math.PI * 2);
    g.fill();
    g.font = '9px ' + MONO;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = 'rgba(229,72,77,0.75)';
    if (s.kind === 'H') g.fillText('H', xx, sy - 7);
    else { g.fillStyle = 'rgba(14,159,110,0.75)'; g.fillText('L', xx, sy + 7); }
  });
}

function onMove(ev) {
  const c = $('chart');
  const geo = S.geo;
  const tip = $('tip');
  if (!geo || !c) return;
  const rect = c.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const { pad, cw, bars } = geo;
  const i = Math.floor((mx - pad.l) / cw);
  if (i < 0 || i >= bars.length || my < pad.t || my > pad.t + geo.ph) { tip.style.display = 'none'; return; }
  const b = bars[i];
  tip.style.display = 'block';
  tip.innerHTML = fmtDT(b.t) + ' MYT\nO ' + fmt2(b.o) + '  H ' + fmt2(b.h) +
    '\nL ' + fmt2(b.l) + '  C ' + fmt2(b.c);
  const left = Math.min(rect.width - 150, mx + 14);
  tip.style.left = left + 'px';
  tip.style.top = Math.max(8, my - 10) + 'px';
}

function onLeave() { $('tip').style.display = 'none'; }

/* ------------------------------------------------------- pan / zoom chart */
const clampN = (v, a, b) => Math.min(b, Math.max(a, v));
const chartEl = $('chart');
const pointers = new Map();
let pan = null;
let pinch = null;

function resetView() {
  S.view.offset = 0;
  S.view.count = 120;
  drawChart();
}

chartEl.addEventListener('pointerdown', (e) => {
  try { chartEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    pan = { x: e.clientX, offset: S.view.offset };
    pinch = null;
  } else if (pointers.size === 2) {
    const pts = Array.from(pointers.values());
    pinch = { dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), count: S.view.count };
    pan = null;
  }
});

chartEl.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size >= 2 && pinch) {
    const pts = Array.from(pointers.values());
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    S.view.count = Math.round(clampN(pinch.count * (pinch.dist / Math.max(1, d)), 20, 400));
    drawChart();
    return;
  }
  if (pan && S.geo) {
    const dx = e.clientX - pan.x;
    const maxOffset = Math.max(0, S.geo.total - S.view.count);
    S.view.offset = Math.round(clampN(pan.offset + dx / (S.geo.cw || 3), 0, maxOffset));
    drawChart();
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    pan = null;
    pinch = null;
  } else if (pointers.size === 1) {
    const p = Array.from(pointers.values())[0];
    pan = { x: p.x, offset: S.view.offset };
    pinch = null;
  }
}
chartEl.addEventListener('pointerup', endPointer);
chartEl.addEventListener('pointercancel', endPointer);
chartEl.addEventListener('dblclick', resetView);
chartEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  S.view.count = Math.round(clampN(S.view.count * (e.deltaY > 0 ? 1.15 : 0.87), 20, 400));
  drawChart();
}, { passive: false });

function applyLivePrice(price) {
  const p = S.p;
  if (!p) return;
  const px = Math.round(price * 100) / 100;
  S.lastTick = Date.now();
  p.market.price = px;
  const el = $('price');
  if (el) el.textContent = fmt2(px);
  const ch = (p.charts && p.charts[S.chartTf]) || p.chart;
  if (ch && ch.candles && ch.candles.length) {
    const last = ch.candles[ch.candles.length - 1];
    last.c = px;
    last.h = Math.max(last.h, px);
    last.l = Math.min(last.l, px);
    ch.price = px;
  }
  drawChart();
}

let tickingLive = false;
async function liveTick() {
  if (!S.p || document.hidden || tickingLive) return;
  tickingLive = true;
  try {
    const q = await GoldData.quote(engineCfg());
    if (q && q.price > 0) {
      const basis = q.source === 'tv' ? 0 : (Number(S.p.data && S.p.data.basis) || 0);
      applyLivePrice(q.price + basis);
    }
  } catch (e) { /* ignore */ } finally { tickingLive = false; }
}
setInterval(liveTick, 1000);

setInterval(() => {
  S.left -= 1;
  updateClock();
  if (S.left <= 0) load(false);
}, 1000);

const cached = readCache();
if (cached) {
  S.p = cached;
  render(cached);
}
load(false);

/* iOS Safari: offer "add to home screen" once, hide in standalone mode */
(function () {
  const nav = (typeof window !== 'undefined' && window.navigator) || (typeof navigator !== 'undefined' ? navigator : null);
  const ua = (nav && nav.userAgent) || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const standalone = (nav && nav.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  const hint = $('install-hint');
  if (!hint || !isIOS || standalone) return;
  try { if (localStorage.getItem('gold-hint-closed')) return; } catch (e) { /* ignore */ }
  hint.classList.remove('hidden');
  const close = $('hint-close');
  if (close) {
    close.addEventListener('click', () => {
      hint.classList.add('hidden');
      try { localStorage.setItem('gold-hint-closed', '1'); } catch (e) { /* ignore */ }
    });
  }
})();

</script>
</body>
