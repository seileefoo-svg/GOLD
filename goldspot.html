/* ---------------------------------------------------------------- chart */
function drawChart() {
  const c = $('chart');
  const p = S.p;
  if (!c || !p) return;
  const ch = (p.charts && p.charts[S.chartTf]) || p.chart;
  if (!ch) return;
  const rect = c.getBoundingClientRect();
  const W = Math.max(320, Math.round(rect.width));
  const H = Math.max(280, Math.round(rect.height));
  const dpr = window.devicePixelRatio || 1;
  c.width = W * dpr;
  c.height = H * dpr;
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const all = ch.candles || [];
  if (!all.length) return;

  // visible window: user can drag back through history and pinch to zoom
  const total = all.length;
  const maxCount = Math.min(total, 1200);
  let count = Math.min(Math.max(S.view.count, 20), maxCount);
  let offset = Math.min(Math.max(S.view.offset, 0), Math.max(0, total - count));
  S.view.count = count;
  S.view.offset = offset;
  const startI = total - count - offset;
  const bars = all.slice(startI, startI + count);
  const ema20 = (ch.ema20 || []).slice(startI, startI + count);
  const ema50 = (ch.ema50 || []).slice(startI, startI + count);
  const swingPts = (ch.swings || [])
    .filter((s) => s.i >= startI && s.i < startI + count)
    .map((s) => ({ t: s.t, i: s.i - startI, price: s.price, kind: s.kind }));
  const rb = $('chart-reset');
  if (rb) rb.classList.toggle('hidden', offset === 0 && count === 120);
  const rangeEl = $('chart-range');
  if (rangeEl) {
    const d0 = new Date(bars[0].t), d1 = new Date(bars[bars.length - 1].t);
    const f = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    rangeEl.textContent = f(d0) + ' → ' + f(d1) + '（' + count + ' 根 / 共 ' + total + '）';
  }
  const firstBtn = $('chart-first'), lastBtn = $('chart-last');
  if (firstBtn) firstBtn.disabled = offset >= total - count;
  if (lastBtn) lastBtn.disabled = offset === 0;

  const pad = { l: 8, r: 82, t: 14, b: 26 };
  const compact = W < 560;
  if (compact) pad.r = 62;
  const pw = W - pad.l - pad.r;
  const ph = H - pad.t - pad.b;
  const atr = ch.atr || 0;

  let lo = Infinity, hi = -Infinity;
  bars.forEach((b) => { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h); });
  const near = (v) => v != null && v > lo - 4 * atr && v < hi + 4 * atr;
  const extra = [];
  if (near(ch.price)) extra.push(ch.price);
  if (near(ch.plan.entry)) extra.push(ch.plan.entry);
  if (near(ch.plan.stop)) extra.push(ch.plan.stop);
  (ch.plan.targets || []).forEach((t) => { if (near(t)) extra.push(t); });
  (ch.zones || []).forEach((z) => { if (near(z.lo) || near(z.hi)) extra.push(z.lo, z.hi); });
  extra.forEach((v) => { lo = Math.min(lo, v); hi = Math.max(hi, v); });
  const padY = Math.max(atr * 0.5, (hi - lo) * 0.04);
  lo -= padY; hi += padY;
  const span = hi - lo || 1;
  const y = (v) => pad.t + ((hi - v) / span) * ph;
  const cw = pw / bars.length;
  const x = (i) => pad.l + (i + 0.5) * cw;
  S.geo = { pad, pw, ph, cw, bars, lo, hi, span, W, H, total, count, offset, startI };

  // grid + price axis
  g.font = (compact ? 9 : 10) + 'px ' + MONO;
  g.textBaseline = 'middle';
  for (let k = 0; k <= 5; k++) {
    const v = lo + (span * k) / 5;
    const yy = Math.round(y(v)) + 0.5;
    g.strokeStyle = '#eaecf0';
    g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(pad.l + pw, yy); g.stroke();
    g.fillStyle = '#667085';
    g.textAlign = 'left';
    g.fillText(fmt2(v), pad.l + pw + 8, yy);
  }

  // time axis: step from the real label width so nothing overlaps on a phone
  g.font = '9.5px ' + MONO;
  const spanMs = new Date(bars[bars.length - 1].t) - new Date(bars[0].t);
  const sample = spanMs > 45 * 864e5 ? '0000-00' : '0000-00 00:00';
  const labelW = g.measureText(sample).width + 26;
  const labelStep = Math.max(1, Math.ceil(labelW / cw));
  const pad2 = (n) => String(n).padStart(2, '0');
  const axisText = (t) => {
    const d = new Date(t);
    const Y = d.getFullYear(), M = pad2(d.getMonth() + 1), D = pad2(d.getDate());
    if (spanMs > 45 * 864e5) return Y + '-' + M;              // long range: year-month
    if (spanMs > 2 * 864e5) return M + '-' + D;               // weeks: month-day
    return M + '-' + D + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  };
  g.textAlign = 'center';
  let lastLabelX = -1e9;
  for (let i = 0; i < bars.length; i += labelStep) {
    const xx = Math.min(Math.max(x(i), pad.l + labelW / 2), pad.l + pw - labelW / 2);
    if (xx - lastLabelX < labelW) continue;
    lastLabelX = xx;
    g.strokeStyle = '#f2f4f7';
    g.beginPath(); g.moveTo(xx, pad.t); g.lineTo(xx, pad.t + ph); g.stroke();
    g.fillStyle = '#667085';
    g.fillText(axisText(bars[i].t), xx, H - 10);
  }

  // zones
  (ch.zones || []).forEach((z) => {
    if (z.hi < lo || z.lo > hi) return;
    const y1 = y(Math.min(z.hi, hi)), y2 = y(Math.max(z.lo, lo));
    g.fillStyle = 'rgba(176,125,18,0.05)';
    g.fillRect(pad.l, y1, pw, Math.max(1, y2 - y1));
    g.strokeStyle = 'rgba(176,125,18,0.22)';
    g.setLineDash([3, 4]);
    g.beginPath(); g.moveTo(pad.l, y1 + 0.5); g.lineTo(pad.l + pw, y1 + 0.5); g.stroke();
    g.beginPath(); g.moveTo(pad.l, y2 - 0.5); g.lineTo(pad.l + pw, y2 - 0.5); g.stroke();
    g.setLineDash([]);
  });

  // candles
  const bodyW = Math.max(1, Math.min(12, cw * 0.62));
  bars.forEach((b, i) => {
    const up = b.c >= b.o;
    const col = up ? '#0e9f6e' : '#e5484d';
    const xx = x(i);
    g.strokeStyle = col;
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(xx, y(b.h)); g.lineTo(xx, y(b.l)); g.stroke();
    const yo = y(b.o), yc = y(b.c);
    const top = Math.min(yo, yc);
    const hgt = Math.max(1, Math.abs(yc - yo));
    g.fillStyle = up ? 'rgba(14,159,110,0.9)' : 'rgba(229,72,77,0.9)';
    g.fillRect(xx - bodyW / 2, top, bodyW, hgt);
  });

  // EMAs
  const line = (arr, color, width) => {
    g.strokeStyle = color; g.lineWidth = width; g.beginPath();
    let started = false;
    arr.forEach((v, i) => {
      if (v == null || !isFinite(v)) return;
      const xx = x(i), yy = y(v);
      if (!started) { g.moveTo(xx, yy); started = true; } else g.lineTo(xx, yy);
    });
    g.stroke();
  };
  line(ema20, '#c9971a', 1.2);
  line(ema50, '#3b82f6', 1.2);

  // plan levels (labels are nudged apart so they stay readable on a phone)
  const pl = ch.plan || {};
  const planLines = [];
  if (pl.entry != null) planLines.push({ v: pl.entry, color: '#2563eb', text: 'E ' + fmt2(pl.entry), dash: [] });
  if (pl.stop != null) planLines.push({ v: pl.stop, color: '#e5484d', text: 'SL ' + fmt2(pl.stop), dash: [5, 4] });
  (pl.targets || []).forEach((t, i) => planLines.push({ v: t, color: '#0e9f6e', text: 'TP' + (i + 1) + ' ' + fmt2(t), dash: [2, 4] }));
  planLines.sort((a, b) => b.v - a.v);
  g.font = (compact ? 9 : 10) + 'px ' + MONO;
  g.textBaseline = 'middle';
  let lastLabelY = -99;
  planLines.forEach((L) => {
    if (L.v < lo || L.v > hi) return;
    const yl = Math.round(y(L.v)) + 0.5;
    g.strokeStyle = L.color;
    g.lineWidth = 1;
    g.setLineDash(L.dash);
    g.beginPath(); g.moveTo(pad.l, yl); g.lineTo(pad.l + pw, yl); g.stroke();
    g.setLineDash([]);
    const tw = g.measureText(L.text).width + 8;
    let ly = Math.max(yl, lastLabelY + 12);
    if (ly > pad.t + ph - 7) ly = pad.t + ph - 7;
    lastLabelY = ly;
    const bx = pad.l + pw - tw - 2;
    g.fillStyle = 'rgba(255,255,255,0.92)';
    g.fillRect(bx, ly - 7, tw, 14);
    g.strokeStyle = L.color;
    g.strokeRect(bx + 0.5, ly - 6.5, tw - 1, 13);
    g.fillStyle = L.color;
    g.textAlign = 'center';
    g.fillText(L.text, bx + tw / 2, ly);
    g.textAlign = 'left';
  });

  // current price (live spot, not the last bar close)
  const last = bars[bars.length - 1];
  const spot = (ch.price == null) ? last.c : ch.price;
  const yy = Math.round(y(spot)) + 0.5;
  g.strokeStyle = 'rgba(16,24,40,0.3)';
  g.setLineDash([1, 3]);
  g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(pad.l + pw, yy); g.stroke();
  g.setLineDash([]);
  if (!compact) {
    g.fillStyle = '#101828';
    g.fillRect(pad.l + pw, yy - 8, 74, 16);
    g.fillStyle = '#ffffff';
    g.font = 'bold 10px ' + MONO;
    g.textAlign = 'left';
    g.fillText(fmt2(spot), pad.l + pw + 5, yy);
  } else {
    g.fillStyle = '#101828';
    g.fillRect(pad.l + pw, yy - 7, pad.r - 2, 14);
    g.fillStyle = '#ffffff';
    g.font = 'bold 9px ' + MONO;
    g.textAlign = 'left';
    g.fillText(fmt2(spot), pad.l + pw + 4, yy);
  }

  // swings
  swingPts.forEach((s) => {
    const i = s.i;
    if (i == null || i < 0 || i >= bars.length) return;
    const xx = x(i);
    const sy = y(s.price) + (s.kind === 'H' ? -12 : 12);
    g.fillStyle = s.kind === 'H' ? 'rgba(229,72,77,0.9)' : 'rgba(14,159,110,0.9)';
    g.beginPath();
    g.arc(xx, sy, 2.4, 0, Math.PI * 2);
    g.fill();
    g.font = '9px ' + MONO;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = 'rgba(229,72,77,0.75)';
    if (s.kind === 'H') g.fillText('H', xx, sy - 7);
    else { g.fillStyle = 'rgba(14,159,110,0.75)'; g.fillText('L', xx, sy + 7); }
  });
}

function onMove(ev) {
  const c = $('chart');
  const geo = S.geo;
  const tip = $('tip');
  if (!geo || !c) return;
  const rect = c.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const { pad, cw, bars } = geo;
  const i = Math.floor((mx - pad.l) / cw);
  if (i < 0 || i >= bars.length || my < pad.t || my > pad.t + geo.ph) { tip.style.display = 'none'; return; }
  const b = bars[i];
  tip.style.display = 'block';
  tip.innerHTML = fmtDT(b.t) + ' MYT\nO ' + fmt2(b.o) + '  H ' + fmt2(b.h) +
    '\nL ' + fmt2(b.l) + '  C ' + fmt2(b.c);
  const left = Math.min(rect.width - 150, mx + 14);
  tip.style.left = left + 'px';
  tip.style.top = Math.max(8, my - 10) + 'px';
}

function onLeave() { $('tip').style.display = 'none'; }

/* ------------------------------------------------------- pan / zoom chart */
const clampN = (v, a, b) => Math.min(b, Math.max(a, v));
const chartEl = $('chart');
const pointers = new Map();
let pan = null;
let pinch = null;

function resetView() {
  S.view.offset = 0;
  S.view.count = 120;
  drawChart();
}

chartEl.addEventListener('pointerdown', (e) => {
  try { chartEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    pan = { x: e.clientX, offset: S.view.offset };
    pinch = null;
  } else if (pointers.size === 2) {
    const pts = Array.from(pointers.values());
    pinch = { dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), count: S.view.count };
    pan = null;
  }
});

chartEl.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size >= 2 && pinch) {
    const pts = Array.from(pointers.values());
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    S.view.count = Math.round(clampN(pinch.count * (pinch.dist / Math.max(1, d)), 20, 400));
    drawChart();
    return;
  }
  if (pan && S.geo) {
    const dx = e.clientX - pan.x;
    const maxOffset = Math.max(0, S.geo.total - S.view.count);
    S.view.offset = Math.round(clampN(pan.offset + dx / (S.geo.cw || 3), 0, maxOffset));
    drawChart();
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    pan = null;
    pinch = null;
  } else if (pointers.size === 1) {
    const p = Array.from(pointers.values())[0];
    pan = { x: p.x, offset: S.view.offset };
    pinch = null;
  }
}
chartEl.addEventListener('pointerup', endPointer);
chartEl.addEventListener('pointercancel', endPointer);
chartEl.addEventListener('dblclick', resetView);
chartEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  S.view.count = Math.round(clampN(S.view.count * (e.deltaY > 0 ? 1.15 : 0.87), 20, 400));
  drawChart();
}, { passive: false });

/* iOS Safari: offer "add to home screen" once, hide in standalone mode */
(function () {
  const nav = (typeof window !== 'undefined' && window.navigator) || (typeof navigator !== 'undefined' ? navigator : null);
  const ua = (nav && nav.userAgent) || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const standalone = (nav && nav.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  const hint = $('install-hint');
  if (!hint || !isIOS || standalone) return;
  try { if (localStorage.getItem('gold-hint-closed')) return; } catch (e) { /* ignore */ }
  hint.classList.remove('hidden');
  const close = $('hint-close');
  if (close) {
    close.addEventListener('click', () => {
      hint.classList.add('hidden');
      try { localStorage.setItem('gold-hint-closed', '1'); } catch (e) { /* ignore */ }
    });
  }
})();

</script>
</body>
</html>
